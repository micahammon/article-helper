<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Articles: a / an / the / zero</title>
<style>
:root{
  --paper:#EDF0F2;
  --card:#FAFBFB;
  --ink:#16232B;
  --muted:#5A6E78;
  --rule:#C7D0D5;
  --the:#1F5C7A;
  --the-wash:#E2ECF1;
  --an:#6B3F87;
  --an-wash:#EDE5F2;
  --zero:#2F6B4F;
  --zero-wash:#E1EDE7;
  --fixed:#7A5C10;
  --fixed-wash:#F2EBD8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:0 auto;padding:32px 24px 80px}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:24px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;margin-bottom:28px;
}
.masthead h1{
  font-family:var(--serif);
  font-size:30px;font-weight:400;letter-spacing:-.01em;
  margin:0;
}
.masthead h1 .slash{color:var(--muted);padding:0 2px}
.modes{display:flex;gap:2px;background:var(--rule);padding:2px;border-radius:2px}
.modes button{
  font-family:var(--sans);font-size:13px;
  border:0;background:transparent;color:var(--muted);
  padding:6px 14px;cursor:pointer;border-radius:1px;
}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600}
.modes button:focus-visible{outline:2px solid var(--the);outline-offset:1px}

/* ---------- phrase bar ---------- */
.phrasebar{margin-bottom:24px}
.phrasebar label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.phrasebar input{
  width:100%;font-family:var(--serif);font-size:19px;
  padding:10px 12px;border:1px solid var(--rule);border-radius:2px;
  background:var(--card);color:var(--ink);
}
.phrasebar input:focus{outline:2px solid var(--the);outline-offset:-1px;border-color:var(--the)}

/* ---------- question card ---------- */
.qcard{
  background:var(--card);
  border:1px solid var(--rule);
  border-left:4px solid var(--ink);
  border-radius:2px;
  padding:24px 26px;
}
.gate{font-size:13px;color:var(--muted);margin-bottom:10px}
.qtext{
  font-family:var(--serif);
  font-size:25px;line-height:1.3;font-weight:400;
  margin:0 0 10px;max-width:34em;
}
.qnote{font-size:14px;color:var(--muted);margin:0 0 20px;max-width:46em}
.qnote em{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:block;width:100%;text-align:left;
  font-family:var(--sans);font-size:15px;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:12px 14px;cursor:pointer;
  transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--ink);background:var(--card)}
.opt:focus-visible{outline:2px solid var(--the);outline-offset:1px}
.opt .ex{display:block;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);margin-top:4px}
.opt .tag{float:right;font-size:12px;color:var(--muted);margin-left:12px}

/* checklist style for the identifiability gate */
.checklist .opt{border-left:3px solid var(--the)}
.checklist .opt.none{border-left:3px solid var(--rule);margin-top:6px}

.warn{
  background:var(--fixed-wash);
  border:1px solid #DBCB9A;border-radius:2px;
  padding:12px 14px;font-size:14px;margin:16px 0 0;
}
.warn strong{font-weight:600}
.warn em{font-family:var(--serif);font-size:15px}

/* ---------- result ---------- */
.result{border-radius:2px;padding:26px;border:1px solid var(--rule)}
.result .form{
  font-family:var(--serif);font-size:52px;line-height:1;font-weight:400;
  margin:0 0 6px;letter-spacing:-.02em;
}
.result .cat{font-size:14px;margin:0 0 18px;font-weight:600}
.result .why{font-size:15px;max-width:44em;margin:0 0 16px}
.result .why em{font-family:var(--serif);font-size:16px}
.result .built{
  font-family:var(--serif);font-size:24px;
  padding:14px 0 0;border-top:1px solid rgba(0,0,0,.13);margin-top:6px;
}
.result ul{margin:10px 0 0;padding-left:20px}
.result li{font-family:var(--serif);font-size:16px;margin-bottom:3px}
.r-the{background:var(--the-wash);border-color:#B4CEDC}
.r-the .form,.r-the .cat{color:var(--the)}
.r-an{background:var(--an-wash);border-color:#CDB8D9}
.r-an .form,.r-an .cat{color:var(--an)}
.r-zero{background:var(--zero-wash);border-color:#B2CFC0}
.r-zero .form,.r-zero .cat{color:var(--zero)}
.r-fixed{background:var(--fixed-wash);border-color:#DBCB9A}
.r-fixed .form,.r-fixed .cat{color:var(--fixed)}

/* ---------- trail ---------- */
.trail{margin-top:26px;border-top:1px solid var(--rule);padding-top:16px}
.trail h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 10px}
.trail ol{margin:0;padding:0;list-style:none;counter-reset:step}
.trail li{
  counter-increment:step;font-size:14px;padding:5px 0 5px 30px;position:relative;
  border-bottom:1px solid var(--rule);
}
.trail li:last-child{border-bottom:0}
.trail li::before{
  content:counter(step);position:absolute;left:0;top:5px;
  width:20px;height:20px;border-radius:50%;background:var(--rule);color:var(--ink);
  font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600;
}
.trail .q{color:var(--muted)}
.trail .a{color:var(--ink);font-weight:600}

.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{
  font-family:var(--sans);font-size:14px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:9px 16px;border-radius:2px;cursor:pointer;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--the);outline-offset:1px}
.btn.ghost{border-color:var(--rule);color:var(--muted)}
.btn.ghost:hover{background:var(--rule);color:var(--ink)}

/* ---------- traces ---------- */
.traces{margin-top:34px;border-top:1px solid var(--rule);padding-top:18px}
.traces h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-family:var(--serif);font-size:15px;font-style:italic;
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:6px 11px;cursor:pointer;color:var(--ink);
}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--the);outline-offset:1px}

/* ---------- map ---------- */
.map .mgate{margin-bottom:26px;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ink);border-radius:2px;padding:18px 22px}
.map h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 4px}
.map .mq{font-size:14px;color:var(--muted);margin:0 0 14px}
.map .row{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:14px;align-items:flex-start}
.map .row .lead{flex:1 1 auto}
.map .row .ex{font-family:var(--serif);font-style:italic;color:var(--muted);display:block;margin-top:2px}
.pill{
  flex:0 0 auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:2px;white-space:nowrap;
}
.p-the{background:var(--the-wash);color:var(--the)}
.p-an{background:var(--an-wash);color:var(--an)}
.p-zero{background:var(--zero-wash);color:var(--zero)}
.p-fixed{background:var(--fixed-wash);color:var(--fixed)}
.p-next{background:var(--rule);color:var(--ink)}
.hidden{display:none}
.foot{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:560px){
  .wrap{padding:22px 16px 60px}
  .masthead h1{font-size:24px}
  .qtext{font-size:21px}
  .result .form{font-size:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>a <span class="slash">/</span> an <span class="slash">/</span> the <span class="slash">/</span> zero</h1>
    <div class="modes" role="group" aria-label="View">
      <button id="m-walk" aria-pressed="true">Walk the tree</button>
      <button id="m-map" aria-pressed="false">See the whole map</button>
    </div>
  </div>

  <!-- ============ WALK ============ -->
  <div id="walk">
    <div class="phrasebar">
      <label for="phrase">Noun you're deciding about (optional)</label>
      <input id="phrase" type="text" placeholder="government" autocomplete="off">
    </div>

    <div id="stage" aria-live="polite"></div>

    <div class="trail hidden" id="trailbox">
      <h2>Your path</h2>
      <ol id="trail"></ol>
    </div>

    <div class="actions">
      <button class="btn ghost" id="back">Go back a step</button>
      <button class="btn ghost" id="restart">Start over</button>
    </div>

    <div class="traces">
      <h2>Or watch one of these route itself</h2>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <!-- ============ MAP ============ -->
  <div id="map" class="map hidden"></div>

  <p class="foot">Answer the first question that matches and stop as soon as you reach a form.</p>
</div>

<script>
"use strict";

/* ---------------------------------------------------------
   TREE
   node: {gate, q, note, opts:[{label, ex, tag, go}], style}
   leaf: {out:'the'|'an'|'zero'|'fixed', cat, why, list}
   --------------------------------------------------------- */

var T = {

  q1:{
    gate:"Question 1",
    q:"Is the noun locked into a fixed expression?",
    note:"Set phrases override every rule below, so they get caught first. <em>go to bed · by car · at night · in the morning · twice a week · a lot of · play the piano · in the end</em>",
    opts:[
      {label:"Yes — it's a set phrase", tag:"memorized", go:"outFixed"},
      {label:"No", go:"q2"}
    ]
  },

  outFixed:{
    out:"fixed", cat:"Question 1 · fixed expression",
    why:"Use the memorized form. There's no rule to recover here, and trying to derive one wastes effort. The three groups:",
    list:[
      "<b>Zero</b> — go to school, in class, by car, on foot, have lunch, at night, on Monday, in trouble, on time, at last, take place, hand in hand",
      "<b>The</b> — during the week, in the morning, at the moment, play the piano, on the radio, in the end, by the way, all the time",
      "<b>A/an</b> — twice a week, $50 a night, a lot of, a few, in a hurry, as a result, all of a sudden"
    ]
  },

  q2:{
    gate:"Question 2",
    q:"Is it a proper noun — a name?",
    note:"",
    opts:[
      {label:"Yes", go:"q2a"},
      {label:"No", go:"q3"}
    ]
  },

  q2a:{
    gate:"Question 2a",
    q:"Is it in the <em>the</em>-taking class of names?",
    note:"Plural names, <em>of</em>-constructions, water and landforms, regions, buildings and publications.",
    opts:[
      {label:"Yes", ex:"the Netherlands · the Alps · the Republic of Ireland · the Nile · the Mediterranean · the Sahara · the Middle East · the Prado · the Guardian", go:"outPropThe"},
      {label:"No", ex:"Madrid · Spain · Micah · Everest · Portuguese · President Sánchez", go:"outPropZero"}
    ]
  },

  outPropThe:{
    out:"the", cat:"Question 2a · name in the the-taking class",
    why:"Plural names, <em>of</em>-constructions, rivers, seas, oceans, deserts, mountain ranges, regions, hotels, museums, theaters and newspapers take <em>the</em>. This is a closed list — learn it as one."
  },

  outPropZero:{
    out:"zero", cat:"Question 2a · ordinary name",
    why:"People, cities, single countries, single mountains, streets, continents, languages and companies take no article. Also titles used with a name: <em>President Sánchez</em>, <em>Doctor Ruiz</em> — but <em>the president</em> on its own is a role noun and routes to 4g."
  },

  q3:{
    gate:"Question 3",
    q:"Am I talking about the whole class, or about particular instances?",
    note:"Test: can you insert <em>in general</em> without changing the meaning? If yes, it's generic.",
    opts:[
      {label:"The class as a whole — generic", ex:"Dogs are loyal. · Life is hard.", go:"q3a"},
      {label:"Particular instances", ex:"I saw a dog. · The dog bit me.", go:"q4"}
    ],
    warn:"<strong>Highest-error node for a Spanish speaker.</strong> <em>La vida es dura</em> becomes <em>Life is hard</em>, not <em>the life</em>. When you're unsure at this question, generic plus zero is the safer guess."
  },

  q3a:{
    gate:"Question 3a",
    q:"How is the noun behaving here?",
    note:"All three forms can be generic in English. This is the one place where <em>the</em> and <em>a</em> and zero are all live options for the same meaning.",
    opts:[
      {label:"Plural countable", ex:"Dogs are loyal.", tag:"the usual choice", go:"outGenZeroPl"},
      {label:"Non-count or abstract", ex:"Life is hard. · She studies economics.", go:"outGenZeroNc"},
      {label:"Singular countable, any representative", ex:"A dog needs exercise.", go:"outGenA"},
      {label:"Singular countable, the species", ex:"The dog is a social animal.", tag:"formal", go:"outGenThe"}
    ]
  },

  outGenZeroPl:{
    out:"zero", cat:"Question 3a · generic plural",
    why:"The default way to talk about a whole class in English. Reach for this first when the generic reading is what you want."
  },
  outGenZeroNc:{
    out:"zero", cat:"Question 3a · generic non-count",
    why:"Abstractions and mass nouns take no article in their generic sense: <em>water, life, music, economics, happiness, advice</em>. This is the single biggest source of article errors for Romance-language speakers."
  },
  outGenA:{
    out:"an", cat:"Question 3a · representative singular",
    why:"Picks out any arbitrary member to stand for the class. Slightly more formal than the plural, and it won't work with every predicate — <em>A dog is widespread</em> fails, because being widespread is true of the species and not of any individual."
  },
  outGenThe:{
    out:"the", cat:"Question 3a · the species",
    why:"Names the class as a single entity. Formal and mostly scientific: <em>The blue whale is endangered.</em> Note this reading is only reachable from Question 3 — if you route a generic through the later questions instead, you'll never arrive here."
  },

  q4:{
    gate:"Question 4",
    q:"Can my listener identify <em>which one</em> I mean?",
    note:"Work down the list. The first one that matches is your answer — they all produce <em>the</em>, and the labels just tell you why.",
    style:"checklist",
    opts:[
      {label:"4a · The sentence itself specifies it", ex:"the book I lent you · the man in the corner · the capital of Spain", go:"out4a"},
      {label:"4b · There's a superlative, ordinal or uniqueness word", ex:"the best · the first · the only · the same · the next", go:"out4b"},
      {label:"4c · We've mentioned it already", ex:"I bought a car. The car was red.", go:"out4c"},
      {label:"4d · It's inferable from something we mentioned", ex:"I bought a car. The engine was noisy.", go:"out4d"},
      {label:"4e · There's only one in the world", ex:"the sun · the equator · the internet", go:"out4e"},
      {label:"4f · There's only one in our shared community", ex:"the mall · the beach · the park · the gym · the doctor", go:"q4f"},
      {label:"4g · It's a role that belongs to something", ex:"the government · the president · the economy · the weather", go:"out4g"},
      {label:"None of these — my listener can't tell which one", go:"q5", cls:"none"}
    ]
  },

  out4a:{out:"the", cat:"4a · specified by the sentence",
    why:"A relative clause or an <em>of</em>-phrase narrows the noun to one referent, so the identification happens inside the sentence itself. The most mechanically detectable of the seven, which is why it's checked first."},
  out4b:{out:"the", cat:"4b · superlative, ordinal or uniqueness word",
    why:"<em>Best, first, only, same, next, last, main</em> all entail that there's exactly one, so <em>the</em> follows automatically."},
  out4c:{out:"the", cat:"4c · second mention",
    why:"The classic <em>a</em> → <em>the</em> switch. First mention introduces, second mention points back."},
  out4d:{out:"the", cat:"4d · inferable from what we mentioned",
    why:"Part-whole and possession relations license this without any prior mention of the noun itself. A car has one engine, a room has one ceiling, so naming the whole makes the part identifiable."},
  out4e:{out:"the", cat:"4e · only one in the world",
    why:"Shared world knowledge does the identifying. No context needed at all."},

  q4f:{
    gate:"Question 4f · check first",
    q:"Does the noun name a place, or an institutional activity?",
    note:"This is where <em>the mall</em> and <em>at school</em> collide. Both are familiar community places, so the wrong branch is easy to take.",
    opts:[
      {label:"A place", ex:"mall · beach · park · gym · bank · airport · library · store", go:"out4f"},
      {label:"An institutional activity or state", ex:"school · church · class · prison · court · bed · work · sea", tag:"back to Q1", go:"outFixed"}
    ],
    warn:"Compare <em>at school</em>, meaning studying, with <em>at the school</em>, meaning standing in the building. The activity set is closed and somewhat arbitrary — <em>I'm at school</em> is available but <em>I'm at library</em> isn't."
  },

  out4f:{out:"the", cat:"4f · only one in our shared community",
    why:"No specific one has been mentioned, and none needs to be. <em>I'm at the mall</em> doesn't identify which mall — it relies on your listener not needing to ask. This still holds for a mall neither of you has ever visited, because what's required is that the question <em>which one?</em> doesn't arise, not that a particular referent exists."},

  out4g:{out:"the", cat:"4g · a role that belongs to something",
    why:"Role nouns are inherently <em>of</em> something: government of a country, capital of a country, manager of a team. The article is licensed because the noun carries an implicit slot that context fills — and the slot can stay unfilled out loud. <em>What should the government do?</em> works between an American and a Spaniard discussing neither country, because it means <em>the government of whatever situation we're discussing</em>. Unique relative to an argument, not unique in the world."},

  q5:{
    gate:"Question 5",
    q:"How am I using the noun here — countable or not?",
    note:"Ask about this use, not about the noun. <em>Coffee</em> and <em>a coffee</em>. <em>Experience</em> and <em>an experience</em>. <em>Paper</em> and <em>a paper</em>. A noun-property question sends dual-membership nouns down the wrong branch and keeps them there.",
    opts:[
      {label:"Singular countable", ex:"I saw a dog. · She's a teacher. · I need a pen.", go:"out5a"},
      {label:"Plural countable", ex:"I bought books.", go:"out5zPl"},
      {label:"Non-count", ex:"We need water.", go:"out5zNc"}
    ]
  },

  out5a:{out:"an", cat:"Question 5 · indefinite singular",
    why:"Countable, singular, and your listener can't yet tell which one. Covers first mention, non-specific <em>any</em> uses, and classifying after <em>be</em>."},
  out5zPl:{out:"zero", cat:"Question 5 · indefinite plural",
    why:"The plural counterpart of <em>a</em>. English has no plural indefinite article, so the slot stays empty."},
  out5zNc:{out:"zero", cat:"Question 5 · indefinite non-count",
    why:"Mass nouns take no article when indefinite. Add a quantifier if you need one: <em>some water</em>, <em>a lot of water</em>."}
};

var FORM = {
  the:{word:"the", cls:"r-the"},
  an:{word:"a / an", cls:"r-an"},
  zero:{word:"\u2014 no article \u2014", cls:"r-zero"},
  fixed:{word:"memorized", cls:"r-fixed"}
};

/* traces: each is a scripted list of option indices */
var TRACES = [
  {p:"during the week", path:[0]},
  {p:"go to school",    path:[0]},
  {p:"the Netherlands", path:[1,0,0]},
  {p:"Madrid",          path:[1,0,1]},
  {p:"Dogs are loyal",  path:[1,1,0,0]},
  {p:"Life is hard",    path:[1,1,0,1]},
  {p:"the book I lent you", path:[1,1,1,0]},
  {p:"the mall",        path:[1,1,1,5,0]},
  {p:"at school",       path:[1,1,1,5,1]},
  {p:"the government",  path:[1,1,1,6]},
  {p:"I need a pen",    path:[1,1,1,7,0]},
  {p:"We need water",   path:[1,1,1,7,2]}
];

/* ---------------- state ---------------- */
var cur = "q1";
var hist = [];   /* [{node, optIndex}] */

var stage   = document.getElementById("stage");
var trail   = document.getElementById("trail");
var trailbox= document.getElementById("trailbox");
var phrase  = document.getElementById("phrase");

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");}

function render(){
  var n = T[cur];
  stage.innerHTML = "";

  if(n.out){ renderResult(n); }
  else { renderQuestion(n); }

  renderTrail();
}

function renderQuestion(n){
  var card = document.createElement("div");
  card.className = "qcard";

  var h = "";
  h += '<div class="gate">' + n.gate + '</div>';
  h += '<h2 class="qtext">' + n.q + '</h2>';
  if(n.note) h += '<p class="qnote">' + n.note + '</p>';
  card.innerHTML = h;

  var box = document.createElement("div");
  box.className = "opts" + (n.style === "checklist" ? " checklist" : "");

  n.opts.forEach(function(o,i){
    var b = document.createElement("button");
    b.className = "opt" + (o.cls ? " " + o.cls : "");
    var inner = "";
    if(o.tag) inner += '<span class="tag">' + o.tag + '</span>';
    inner += o.label;
    if(o.ex) inner += '<span class="ex">' + o.ex + '</span>';
    b.innerHTML = inner;
    b.addEventListener("click", function(){ choose(i); });
    box.appendChild(b);
  });
  card.appendChild(box);

  if(n.warn){
    var w = document.createElement("div");
    w.className = "warn";
    w.innerHTML = n.warn;
    card.appendChild(w);
  }
  stage.appendChild(card);
}

function renderResult(n){
  var f = FORM[n.out];
  var card = document.createElement("div");
  card.className = "result " + f.cls;

  var h = "";
  h += '<p class="form">' + f.word + '</p>';
  h += '<p class="cat">' + n.cat + '</p>';
  h += '<p class="why">' + n.why + '</p>';
  if(n.list){
    h += "<ul>";
    n.list.forEach(function(li){ h += "<li>" + li + "</li>"; });
    h += "</ul>";
  }

  var word = phrase.value.trim();
  if(word && n.out !== "fixed"){
    var built = n.out === "the" ? "the " + word
              : n.out === "an"  ? (/^[aeiou]/i.test(word) ? "an " : "a ") + word
              : word;
    h += '<p class="built">' + esc(built) + '</p>';
  }
  card.innerHTML = h;
  stage.appendChild(card);
}

function renderTrail(){
  if(!hist.length){ trailbox.classList.add("hidden"); trail.innerHTML=""; return; }
  trailbox.classList.remove("hidden");
  trail.innerHTML = "";
  hist.forEach(function(step){
    var n = T[step.node];
    var o = n.opts[step.opt];
    var li = document.createElement("li");
    li.innerHTML = '<span class="q">' + n.gate + " — </span>" +
                   '<span class="a">' + o.label.replace(/^\d[a-z]? · /,"") + "</span>";
    trail.appendChild(li);
  });
}

function choose(i){
  var n = T[cur];
  hist.push({node:cur, opt:i});
  cur = n.opts[i].go;
  render();
  stage.scrollIntoView({block:"nearest", behavior:"smooth"});
}

document.getElementById("back").addEventListener("click", function(){
  if(!hist.length) return;
  var last = hist.pop();
  cur = last.node;
  render();
});

document.getElementById("restart").addEventListener("click", function(){
  cur = "q1"; hist = []; phrase.value = ""; render(); phrase.focus();
});

/* ---------------- traces ---------------- */
var chips = document.getElementById("chips");
TRACES.forEach(function(t){
  var b = document.createElement("button");
  b.className = "chip";
  b.textContent = t.p;
  b.addEventListener("click", function(){
    cur = "q1"; hist = [];
    phrase.value = t.p;
    t.path.forEach(function(idx){
      var n = T[cur];
      if(!n || !n.opts) return;
      hist.push({node:cur, opt:idx});
      cur = n.opts[idx].go;
    });
    render();
    stage.scrollIntoView({block:"nearest", behavior:"smooth"});
  });
  chips.appendChild(b);
});

/* ---------------- mode toggle ---------------- */
var walkEl = document.getElementById("walk");
var bWalk = document.getElementById("m-walk");
var bMap  = document.getElementById("m-map");
function mode(isWalk){
  walkEl.classList.toggle("hidden", !isWalk);
  mapEl.classList.toggle("hidden", isWalk);
  bWalk.setAttribute("aria-pressed", String(isWalk));
  bMap.setAttribute("aria-pressed", String(!isWalk));
}
bWalk.addEventListener("click", function(){ mode(true); });
bMap.addEventListener("click", function(){ mode(false); });

render();
