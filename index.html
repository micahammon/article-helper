<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Articles: a / an / the / zero</title>
<style>
:root{
  --paper:#EDF0F2;
  --card:#FAFBFB;
  --ink:#16232B;
  --muted:#5A6E78;
  --rule:#C7D0D5;
  --hairline:rgba(0,0,0,.13);
  --the:#1F5C7A;
  --the-wash:#E2ECF1;
  --the-edge:#B4CEDC;
  --an:#6B3F87;
  --an-wash:#EDE5F2;
  --an-edge:#CDB8D9;
  --zero:#2F6B4F;
  --zero-wash:#E1EDE7;
  --zero-edge:#B2CFC0;
  --fixed:#7A5C10;
  --fixed-wash:#F2EBD8;
  --fixed-edge:#DBCB9A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* Dark mode. Same token names, same roles: paper stays the page, ink stays
   the text, and each of the four article colours keeps its identity, so a
   learner who has learned "teal means the" still reads it that way. */
@media (prefers-color-scheme:dark){
  :root{
    --paper:#131A1F;
    --card:#1B242A;
    --ink:#E4EBEF;
    --muted:#9AAAB3;
    --rule:#33424B;
    --hairline:rgba(255,255,255,.14);
    --the:#7FBEDD;
    --the-wash:#16323F;
    --the-edge:#2C5468;
    --an:#C7A3DC;
    --an-wash:#2A2036;
    --an-edge:#4A3A5C;
    --zero:#84C9A6;
    --zero-wash:#152F22;
    --zero-edge:#2C5442;
    --fixed:#DCBB60;
    --fixed-wash:#332913;
    --fixed-edge:#5C4A20;
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:0 auto;padding:32px 24px 80px}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:24px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;margin-bottom:28px;
}
.masthead h1{
  font-family:var(--serif);
  font-size:30px;font-weight:400;letter-spacing:-.01em;
  margin:0;
}
.masthead h1 .slash{color:var(--muted);padding:0 2px}
.modes{display:flex;gap:2px;background:var(--rule);padding:2px;border-radius:2px}
.modes button{
  font-family:var(--sans);font-size:13px;
  border:0;background:transparent;color:var(--muted);
  padding:6px 14px;cursor:pointer;border-radius:1px;
}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600}
.modes button:focus-visible{outline:2px solid var(--the);outline-offset:1px}

/* ---------- phrase bar ---------- */
.phrasebar{margin-bottom:24px}
.phrasebar label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.phrasebar input{
  width:100%;font-family:var(--serif);font-size:19px;
  padding:10px 12px;border:1px solid var(--rule);border-radius:2px;
  background:var(--card);color:var(--ink);
}
.phrasebar input:focus{outline:2px solid var(--the);outline-offset:-1px;border-color:var(--the)}

/* ---------- question card ---------- */
.qcard{
  background:var(--card);
  border:1px solid var(--rule);
  border-left:4px solid var(--ink);
  border-radius:2px;
  padding:24px 26px;
}
.gate{font-size:13px;color:var(--muted);margin-bottom:10px}
.qtext{
  font-family:var(--serif);
  font-size:25px;line-height:1.3;font-weight:400;
  margin:0 0 10px;max-width:34em;
}
.qnote{font-size:14px;color:var(--muted);margin:0 0 20px;max-width:46em}
.qnote em{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:baseline;
  width:100%;text-align:left;
  font-family:var(--sans);font-size:15px;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:12px 14px;cursor:pointer;
  transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--ink);background:var(--card)}
.opt:focus-visible{outline:2px solid var(--the);outline-offset:1px}
.opt .ex{grid-column:1;grid-row:2;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);margin-top:4px}
.opt .tag{grid-column:2;grid-row:1;font-size:12px;color:var(--muted)}
/* The generic option carries the note's test already applied to its examples.
   Setting the inserted words apart - upright, sans, tinted - lets the eye read
   the original sentence straight through them and see what was added. */
.opt .ex ins{
  text-decoration:none;font-style:normal;font-family:var(--sans);
  font-size:13px;color:var(--the);
  border-bottom:1px dashed var(--the-edge);
  padding-bottom:1px;white-space:nowrap;
}

/* checklist style for the identifiability gate */
.checklist .opt{border-left:3px solid var(--the)}
.checklist .opt.none{border-left:3px solid var(--rule)}
/* names the block underneath: everything below this line answers `the` */
.optgroup{
  display:flex;align-items:center;gap:10px;
  margin:14px 0 2px;font-size:13px;color:var(--muted);
}
.optgroup::after{content:"";flex:1;height:1px;background:var(--rule)}
.optgroup em{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--the)}

.warn{
  background:var(--fixed-wash);
  border:1px solid var(--fixed-edge);border-radius:2px;
  padding:12px 14px;font-size:14px;margin:16px 0 0;
}
.warn strong{font-weight:600}
.warn em{font-family:var(--serif);font-size:15px}

/* ---------- result ---------- */
.result{border-radius:2px;padding:26px;border:1px solid var(--rule)}
.result .form{
  font-family:var(--serif);font-size:52px;line-height:1;font-weight:400;
  margin:0 0 6px;letter-spacing:-.02em;
}
.result .cat{font-size:14px;margin:0 0 18px;font-weight:600}
.result .why{font-size:15px;max-width:44em;margin:0 0 16px}
.result .why em{font-family:var(--serif);font-size:16px}
.result .built{
  font-family:var(--serif);font-size:24px;
  padding:14px 0 0;border-top:1px solid var(--hairline);margin-top:6px;
}
.result ul{margin:10px 0 0;padding-left:20px}
.result li{font-family:var(--serif);font-size:16px;margin-bottom:3px}
.r-the{background:var(--the-wash);border-color:var(--the-edge)}
.r-the .form,.r-the .cat{color:var(--the)}
.r-an{background:var(--an-wash);border-color:var(--an-edge)}
.r-an .form,.r-an .cat{color:var(--an)}
.r-zero{background:var(--zero-wash);border-color:var(--zero-edge)}
.r-zero .form,.r-zero .cat{color:var(--zero)}
.r-fixed{background:var(--fixed-wash);border-color:var(--fixed-edge)}
.r-fixed .form,.r-fixed .cat{color:var(--fixed)}

/* ---------- trail ---------- */
.trail{margin-top:26px;border-top:1px solid var(--rule);padding-top:16px}
.trail h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 10px}
.trail ol{margin:0;padding:0;list-style:none;counter-reset:step}
.trail li{
  counter-increment:step;font-size:14px;padding:5px 0 5px 30px;position:relative;
  border-bottom:1px solid var(--rule);
}
.trail li:last-child{border-bottom:0}
.trail li::before{
  content:counter(step);position:absolute;left:0;top:5px;
  width:20px;height:20px;border-radius:50%;background:var(--rule);color:var(--ink);
  font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600;
}
.trail .q{color:var(--muted);display:block;font-size:13px}
.trail .a{color:var(--ink);font-weight:600}

.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{
  font-family:var(--sans);font-size:14px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:9px 16px;border-radius:2px;cursor:pointer;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--the);outline-offset:1px}
.btn.ghost{border-color:var(--rule);color:var(--muted)}
.btn.ghost:hover{background:var(--rule);color:var(--ink)}

/* ---------- traces ---------- */
.traces{margin-top:34px;border-top:1px solid var(--rule);padding-top:18px}
.traces-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.traces h2{font-size:13px;color:var(--muted);font-weight:600;margin:0}
.traces-tools{display:flex;gap:8px}
.btn.sm{font-size:12px;padding:4px 10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-family:var(--serif);font-size:15px;font-style:italic;
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:6px 11px;cursor:pointer;color:var(--ink);
}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--the);outline-offset:1px}
/* A chip already run is dimmed and ticked. The mark says "you have seen this
   one" and nothing else - never which form it lands on. */
.chip.seen{color:var(--muted);border-style:dashed}
.chip.seen::before{content:"✓ ";font-style:normal;font-size:12px}

/* ---------- map ---------- */
.map .mgate{margin-bottom:26px;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ink);border-radius:2px;padding:18px 22px}
.map .mgate-label{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.map h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 4px}
.map .mq{font-size:14px;color:var(--muted);margin:0 0 14px}
.map .row{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:14px;align-items:flex-start}
.map .row .lead{flex:1 1 auto}
.map .row .ex{font-family:var(--serif);font-style:italic;color:var(--muted);display:block;margin-top:2px}
.pill{
  flex:0 0 auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:2px;white-space:nowrap;
}
.p-the{background:var(--the-wash);color:var(--the)}
.p-an{background:var(--an-wash);color:var(--an)}
.p-zero{background:var(--zero-wash);color:var(--zero)}
.p-fixed{background:var(--fixed-wash);color:var(--fixed)}
.p-next{background:var(--rule);color:var(--ink)}
.hidden{display:none}
.foot{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:560px){
  .wrap{padding:22px 16px 60px}
  .masthead h1{font-size:24px}
  .qtext{font-size:21px}
  .result .form{font-size:40px}
}
@media (max-width:820px){
  .wrap{padding:28px 20px 70px}
  .qtext{font-size:23px}
  .result .form{font-size:46px}
  .map .row{flex-wrap:wrap}
}

/* Motion does one job: showing that what is on screen was just replaced.
   The card that answers you rises in; each trail step rises in after the one
   before it, so an appended step reads as appended. */
@media (prefers-reduced-motion:no-preference){
  .qcard,.result,.err,.note-card{animation:rise .28s cubic-bezier(.16,1,.3,1) both}
  .trail li{animation:rise .24s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 45ms)}
}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- gate 0 ---------- */
.phrasebar .row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.phrasebar .row input{flex:1 1 240px}
.gate0{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:2px;
  background:var(--rule);color:var(--ink);margin-bottom:10px;
}
.g-hit{background:var(--fixed-wash);color:var(--fixed)}
.g-miss{background:var(--rule);color:var(--muted)}
.ref{
  display:inline-block;font-size:12px;color:var(--muted);
  border:1px solid var(--rule);border-radius:2px;padding:2px 7px;margin-top:14px;
}
.note-card{
  background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--fixed);
  border-radius:2px;padding:14px 18px;margin-bottom:18px;font-size:14px;
}
.note-card b{font-weight:600}
.err{
  background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--an);
  border-radius:2px;padding:18px 22px;font-size:14px;
}
.reflist{columns:2;column-gap:26px;margin:10px 0 0;padding:0;list-style:none}
.reflist li{
  font-family:var(--serif);font-style:italic;font-size:14px;
  break-inside:avoid;padding:2px 0;color:var(--ink);
}
.refgroup{margin-bottom:18px}
.refgroup h4{margin:0;font-size:13px;font-weight:600;color:var(--muted);
  display:flex;align-items:center;gap:8px}
.senses{margin-top:16px;border-top:1px solid var(--rule)}
.senses .sense{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);
  align-items:flex-start;font-size:14px}
.senses .sense:last-child{border-bottom:0}
.senses .lead{flex:1 1 auto}
.senses .lead b{font-weight:600}
.senses .ex{font-family:var(--serif);font-style:italic;color:var(--muted);
  display:block;margin-top:3px}
/* ---------- which word are we deciding about ---------- */
.focusbar{
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:12px 16px;margin-bottom:16px;
}
.focusbar h3{
  margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
}
.sentence{font-family:var(--serif);font-size:18px;line-height:1.9}
.sentence .w{
  padding:1px 3px;border-radius:2px;color:var(--ink);
  border:1px solid transparent;background:none;font:inherit;
}
.sentence button.w{
  cursor:pointer;color:var(--muted);
  text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:4px;
}
.sentence button.w:hover{border-color:var(--rule);background:var(--paper);color:var(--ink)}
.sentence button.w:focus-visible{outline:2px solid var(--the);outline-offset:1px}
.sentence .w.on{
  background:var(--the-wash);border-color:var(--the);color:var(--the);font-weight:600;
}
.focushint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.result .headword{
  /* A dictionary headword, not a title. Grey rather than ink, so it names
     the entry without competing with the article underneath, and the rule
     goes grey with it. The underline sits 5px down, so the margin below has
     to clear it. */
  font-family:var(--serif);font-size:17px;margin:0 0 14px;
  color:var(--muted);
  text-decoration:underline;text-underline-offset:5px;
  text-decoration-thickness:1px;
}
/* "Go back a step" is disabled when there is no step to go back to, rather
   than sitting there looking clickable and doing nothing */
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost:disabled:hover{background:transparent;color:var(--muted)}
@media (max-width:560px){ .reflist{columns:1} }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>a <span class="slash">/</span> an <span class="slash">/</span> the <span class="slash">/</span> zero</h1>
    <div class="modes" role="group" aria-label="View">
      <button id="m-walk" aria-pressed="true">Walk the tree</button>
      <button id="m-map" aria-pressed="false">See the whole map</button>
    </div>
  </div>

  <!-- ============ WALK ============ -->
  <div id="walk">
    <div class="phrasebar">
      <label for="phrase">Noun or phrase you're deciding about</label>
      <div class="row">
        <input id="phrase" type="text" placeholder="government" autocomplete="off">
        <button class="btn" id="check">Check</button>
      </div>
    </div>

    <div id="focusbar" class="focusbar hidden"></div>

    <div id="stage" aria-live="polite"></div>

    <div class="trail hidden" id="trailbox">
      <h2>Your path</h2>
      <ol id="trail"></ol>
    </div>

    <div class="actions">
      <button class="btn ghost" id="back">Go back a step</button>
      <button class="btn ghost" id="restart">Start over</button>
    </div>

    <div class="traces">
      <div class="traces-head">
        <h2>Or watch one of these route itself</h2>
        <div class="traces-tools">
          <button class="btn ghost sm" id="shuffle" type="button">Shuffle</button>
          <button class="btn ghost sm" id="clearseen" type="button">Clear marks</button>
        </div>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <!-- ============ MAP ============ -->
  <div id="map" class="map hidden"></div>

  <p class="foot">Fixed expressions and known names are matched automatically. Everything else answers the first question that matches and stops as soon as it reaches a form.</p>
</div>

<script>
"use strict";

/* =========================================================
   All content lives in rules_data.json, shared with the
   Tkinter app. Gate 0 is matched here; the tree is walked.
   ========================================================= */

var D = null, T = null, FORM = null;
var cur = null, hist = [], entry = "q2";
var pendingNote = null;
var pinned = null;

var stage    = document.getElementById("stage");
var trail    = document.getElementById("trail");
var trailbox = document.getElementById("trailbox");
var phrase   = document.getElementById("phrase");
var mapEl    = document.getElementById("map");
var chipsEl  = document.getElementById("chips");
var focusEl  = document.getElementById("focusbar");
var backBtn  = document.getElementById("back");

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---------------- normalization (mirrors logic.py) ---------------- */

var PUNCT = /[!-\/:-@\[-`{-~]/g;

/* Punctuation goes, except an apostrophe between two letters. Part 4.2 is full
   of places spelled that way - the doctor's, the baker's - and stripping it
   turned the headword into `doctors` and cut the word off from its own entry. */
function stripPunct(s){
  return String(s)
    .replace(/([A-Za-z0-9])['’]([A-Za-z0-9])/g, "$1$2")
    .replace(PUNCT, "")
    .replace(//g, "'");
}

function normalize(s){
  var n = String(s == null ? "" : s).trim();
  n = n.replace(/^(?:the|an|a)\s+/i, "");
  n = stripPunct(n);
  n = n.replace(/\s+/g, " ").trim();
  return n.toLowerCase();
}

/* same trimming as normalize(), but keeps the user's capitalisation so
   proper nouns render as "the Nile" rather than "the nile" */
function displayWord(s){
  var n = String(s == null ? "" : s).trim();
  n = n.replace(/^(?:the|an|a)\s+/i, "");
  n = stripPunct(n);
  return n.replace(/\s+/g, " ").trim();
}

/* mirrors WORD_PATTERN in logic.py: the clitic stays attached, so `There's`
   is one token and can be told apart from a possessive */
function tokenize(s){
  var m = String(s == null ? "" : s).toLowerCase()
            .match(/[a-z0-9]+(?:['\u2019][a-z]+)?/g);
  return m || [];
}

/* word tokens with their original capitalisation kept */
function casedTokens(s){
  var m = String(s == null ? "" : s).match(/[A-Za-z0-9]+(?:'[A-Za-z]+)?/g);
  return m || [];
}
function isCap(t){ return !!t && t[0] >= "A" && t[0] <= "Z"; }

/* a or an by sound, not spelling: the lists live in the JSON */
function chooseAOrAn(word){
  if(!word) return "a";
  var bare = String(word).replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, "");
  if(!bare) return "a";
  var low = bare.toLowerCase(), P = D.phonetics, i;

  if(P.word_acronyms.words.indexOf(low) !== -1){
    return "aeiou".indexOf(low.charAt(0)) !== -1 ? "an" : "a";
  }

  /* a leading run of capitals is read as letters: MBA, FBI, X-ray */
  var run = bare.match(/^[A-Z]+/);
  if(run){
    var rest = bare.slice(run[0].length);
    var nextIsLower = rest.length > 0 && rest[0] >= "a" && rest[0] <= "z";
    if(run[0].length > 1 || !nextIsLower){
      return P.initialisms.vowel_sounding_letters.indexOf(run[0].charAt(0)) !== -1 ? "an" : "a";
    }
  }

  var cs = P.vowel_letter_consonant_sound;
  if(cs.words.indexOf(low) !== -1) return cs.article;
  for(i = 0; i < cs.prefixes.length; i++){
    if(low.indexOf(cs.prefixes[i]) === 0) return cs.article;
  }

  var vs = P.consonant_letter_vowel_sound;
  if(vs.words.indexOf(low) !== -1) return vs.article;
  for(i = 0; i < vs.prefixes.length; i++){
    if(low.indexOf(vs.prefixes[i]) === 0) return vs.article;
  }

  return "aeiou".indexOf(low.charAt(0)) !== -1 ? "an" : "a";
}

/* ---- the sentence, with the targeted word marked and the rest clickable --- */

function renderFocusBar(text, hitResult){
  var raw = String(text || "").trim();
  var cands = focusCandidates(raw);
  focusEl.innerHTML = "";

  var target = pinned ? normalize(pinned)
             : (hitResult ? String(hitResult.match || "") : inferFocus(raw));
  var targetWords = target ? target.split(" ") : [];

  /* The word Gate 0 matched is not always a candidate: in `I work for
     government` the verb filter drops `work`, but Gate 0 still answers about
     it, so the bar has to stay up or there is no way off that answer. */
  var targetIsCandidate = false;
  for(var k = 0; k < cands.length; k++){
    if(targetWords.indexOf(cands[k].word) !== -1) targetIsCandidate = true;
  }
  var choices = cands.length + ((target && !targetIsCandidate) ? 1 : 0);

  /* nothing to disambiguate: one word to choose from, or none */
  if(!raw || choices < 2){ focusEl.classList.add("hidden"); return; }
  focusEl.classList.remove("hidden");

  var head = document.createElement("h3");
  head.textContent = pinned ? "Deciding about" : "Deciding about \u2014 tap another word to change";
  focusEl.appendChild(head);

  var line = document.createElement("p");
  line.className = "sentence";

  /* walk the original text so capitalisation and punctuation survive */
  var parts = raw.split(/(\s+)/), i, bare, isTarget, isCand;
  for(i = 0; i < parts.length; i++){
    if(/^\s+$/.test(parts[i])){ line.appendChild(document.createTextNode(parts[i])); continue; }
    bare = normalizeWord(parts[i]);
    isTarget = targetWords.indexOf(bare) !== -1;
    isCand = false;
    for(var c = 0; c < cands.length; c++){ if(cands[c].word === bare) isCand = true; }

    if(isCand && !isTarget){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "w";
      b.textContent = parts[i];
      b.title = "Decide about \u201c" + bare + "\u201d instead";
      (function(word){
        b.addEventListener("click", function(){
          analyze(phrase.value, null, word);
          stage.scrollIntoView({block:"nearest", behavior:"smooth"});
        });
      })(cands.filter(function(x){ return x.word === bare; })[0].word);
      line.appendChild(b);
    }else{
      var span = document.createElement("span");
      span.className = "w" + (isTarget ? " on" : "");
      span.textContent = parts[i];
      line.appendChild(span);
    }
  }
  focusEl.appendChild(line);

  var hint = document.createElement("p");
  hint.className = "focushint";
  hint.textContent = targetWords.length
    ? "Answering about the highlighted word. The others are underlined - tap one to switch."
    : "More than one noun here. Tap the one you are deciding about.";
  focusEl.appendChild(hint);
}

/* strip punctuation from one word, keeping the clitic */
function normalizeWord(w){
  return String(w).toLowerCase().replace(/^[^a-z0-9]+|[^a-z0-9'\u2019]+$/g, "");
}

/* ---- which word is the learner asking about? (mirrors logic.py) ---- */

var NOT_A_FOCUS = ["a","an","the","this","that","these","those","my","your",
  "his","her","its","our","their","i","you","he","she","it","we","they","me",
  "him","us","them","and","or","but","if","so","because","at","in","on","to",
  "for","from","with","by","of","about","as","into","over","under","very",
  "really","always","never","not","there","here","then","than","when","where",
  "how","why","what","some","any","no","all","every","each","much","many",
  "more","most","few","little","lots","one","two","three","next","last",
  "first","second","other","same","own"];

/* mirrors _infer_focus_noun in logic.py: the noun after the first article,
   otherwise the last content word */
function inferFocus(text){
  var toks = tokenize(text), dets = ["a","an","the"], i;
  for(i = 0; i < toks.length - 1; i++){
    if(dets.indexOf(toks[i]) !== -1 && dets.indexOf(toks[i + 1]) === -1){
      return toks[i + 1];
    }
  }
  var cands = focusCandidates(text);
  if(!cands.length) return "";

  /* `Dogs are loyal` ends in an adjective, so the last content word is the
     wrong guess. After a copula with no determiner behind it the tail is a
     predicate adjective, and the subject in front is what the sentence is
     about. A determiner there means a predicate noun - `is a teacher` - and
     the scan above has already returned it. */
  for(i = 0; i < toks.length; i++){
    if(BE_FORMS.indexOf(toks[i]) === -1) continue;
    for(var c = cands.length - 1; c >= 0; c--){
      if(cands[c].index < i) return cands[c].word;
    }
    break;
  }
  return cands[cands.length - 1].word;
}

var BE_FORMS = ["is","are","was","were","am","be","been","being"];

/* Does the data have a rule for this word as a noun? `work` is on the verb
   list and is also a lookup entry, so a word the tool can actually answer
   about must not be filtered out as a verb. */
function isKnownNoun(t){
  if(Object.prototype.hasOwnProperty.call(D.lookup_table, t)) return true;
  var name;
  for(name in D.categories){
    if(Object.prototype.hasOwnProperty.call(D.categories, name) &&
       D.categories[name].words.indexOf(t) !== -1) return true;
  }
  for(name in D.time_words.groups){
    if(Object.prototype.hasOwnProperty.call(D.time_words.groups, name) &&
       D.time_words.groups[name].words.indexOf(t) !== -1) return true;
  }
  return false;
}

/* A pronoun that can head a clause. The word straight after one of these is
   that pronoun's verb, whatever else the word can be, which is the one verb
   test a word list cannot do: `work`, `play` and `book` are all real nouns
   with real rules, so `I work`, `did you book a table` and `the book I lent
   you` can only be settled by where the word sits. */
var SUBJECT_PRONOUNS = ["i","you","he","she","it","we","they"];

function focusCandidates(text){
  var seen = {}, out = [], toks = tokenize(text), i, t;
  for(i = 0; i < toks.length; i++){
    t = toks[i];
    if(NOT_A_FOCUS.indexOf(t) !== -1) continue;
    if(i > 0 && SUBJECT_PRONOUNS.indexOf(toks[i - 1]) !== -1) continue;
    if(VERB_HINTS.indexOf(t) !== -1 && !isKnownNoun(t)) continue;
    if(t.length < 2) continue;
    if(Object.prototype.hasOwnProperty.call(seen, t)) continue;
    seen[t] = 1;
    out.push({word:t, index:i});
  }
  return out;
}

/* longest n-gram in tokens that exists as a key of map */
function longestPhrase(tokens, map){
  var max = Math.min(tokens.length, 5), n, i, key;
  for(n = max; n >= 1; n--){
    for(i = 0; i + n <= tokens.length; i++){
      key = tokens.slice(i, i + n).join(" ");
      if(Object.prototype.hasOwnProperty.call(map, key)) return key;
    }
  }
  return null;
}

/* article string -> form key */
function formOf(article){
  var a = String(article).toLowerCase();
  if(a.indexOf("either") === 0) return "either";
  if(a === "one") return "one";
  if(a.indexOf("a / an with") === 0) return "countable";
  if(a.indexOf("the") === 0) return "the";
  if(a.indexOf("a /") === 0 || a.indexOf("a/") === 0 || a.indexOf("an") === 0) return "an";
  return "zero";
}

/* ---------------- Gate 0 ---------------- */

function gate0(text){
  var norm = normalize(text);
  var tokens = tokenize(text);
  if(!norm && !tokens.length) return null;
  var key, e;

  /* 0. constructions whose match covers the whole input. First, because
        `last summer` is Part 7.11 and not a season. */
  var whole = checkConstructions(text, tokens, true);
  if(whole) return whole;

  /* 0.5 the article slot may already be taken: my book, this book, each student.
        That is not a zero-article answer - no article can go there at all. */
  var det = checkDeterminer(text, tokens);
  if(det) return det;

  /* 1. fixed expressions win over everything */
  key = longestPhrase(tokens, D.fixed_expressions) ||
        (D.fixed_expressions[norm] ? norm : null);
  if(key){
    e = D.fixed_expressions[key];
    return {form:formOf(e.article), why:e.explanation, ref:e.rule_ref,
            cat:"Fixed expression", match:key, fixed:true};
  }

  /* 2. noun + classifying number or letter */
  var np = D.patterns.noun_number;
  if(new RegExp(np.regex, "i").test(norm)){
    return {form:formOf(np.article), why:np.explanation, ref:np.rule_ref,
            cat:"Noun with a classifying number", match:norm};
  }

  /* 3. the lookup table, direct then longest phrase - subject to conditions */
  key = Object.prototype.hasOwnProperty.call(D.lookup_table, norm) ? norm
      : longestPhrase(tokens, D.lookup_table);
  if(key){
    return lookupResult(key, tokens);
  }

  /* 3.5 time words: months, days, holidays, seasons, periods, dates, years */
  var timeHit = checkTimeWords(norm, tokens);
  if(timeHit) return timeHit;

  /* 4. nationality adjective for a whole people. This is the "the + adjective"
        construction, so it needs the article in front - without it, `Spanish`
        is a language, not a people. */
  var nat = D.nationality_the;
  if(nat.examples.indexOf(norm) !== -1){
    var natSpan = spanOf(tokens, norm);
    var need = nat.requires_prev;
    var okPrev = !need || (natSpan[1] !== null && natSpan[0] > 0 &&
                           need.indexOf(tokens[natSpan[0] - 1]) !== -1);
    if(okPrev){
      return {form:formOf(nat.article), why:nat.explanation, ref:nat.rule_ref,
              cat:"Nationality adjective", match:norm};
    }
  }

  /* 4.5 productive categories: languages, meals, sports */
  var catHit = checkCategories(norm, tokens);
  if(catHit) return catHit;

  /* 5. names in the the-taking class */
  if(isTheTakingName(text, norm)){
    var pn = D.proper_noun_the;
    return {form:formOf(pn.article), why:pn.explanation, ref:pn.rule_ref,
            cat:"Name in the the-taking class", match:norm};
  }

  /* last: a construction inside a longer sentence. An incidental match loses
     to the gates above, which name a specific noun. */
  var loose = checkConstructions(text, tokens, false);
  if(loose) return loose;

  return null;
}

/* Patterns where the shape of the phrase decides the article, not the noun.
   Two passes: whole-input matches go first, loose matches last. */
function checkConstructions(text, tokens, wholeOnly){
  var phrase = tokens.join(" ");
  if(!phrase) return null;
  var i, rule, subject, m, covers;

  for(i = 0; i < D.constructions.length; i++){
    rule = D.constructions[i];
    subject = rule.case_sensitive ? String(text || "") : phrase;
    m = new RegExp(rule.regex, rule.case_sensitive ? "" : "i").exec(subject);
    if(!m) continue;
    /* too generic to trust over a name the tool already knows: `the
       Netherlands` fits "the + capitalised word + s" as neatly as `the
       Smiths` does */
    if(rule.not_if_known){
      var known = normalize(text);
      if(Object.prototype.hasOwnProperty.call(D.lookup_table, known) ||
         D.proper_noun_the.named.indexOf(known) !== -1) continue;
    }
    covers = (m.index === 0 && m.index + m[0].length === subject.replace(/^\s+|\s+$/g, "").length);
    /* a frame rule describes the shape of the whole clause rather than an
       adjunct inside it, so it belongs in the first pass even when partial */
    if(wholeOnly !== (covers || !!rule.frame)) continue;
    return {form:formOf(rule.article), why:rule.explanation, ref:rule.rule_ref,
            cat:"Construction",
            /* what the rule actually matched: the page highlights this, and a
               pinned focus is checked against it */
            match:(m[0] || "").replace(/^\s+|\s+$/g, "") || phrase,
            matched:(m[0] || "").replace(/^\s+|\s+$/g, ""),
            frame:!!rule.frame,
            construction:true,
            either:(String(rule.article).indexOf("either") === 0),
            examples:rule.examples || [], contrast:rule.contrast || null};
  }
  return null;
}

/* the longest listed phrase present in the tokens */
function findIn(tokens, words){
  var size, start, candidate;
  for(size = Math.min(3, tokens.length); size >= 1; size--){
    for(start = 0; start + size <= tokens.length; start++){
      candidate = tokens.slice(start, start + size).join(" ");
      if(words.indexOf(candidate) !== -1) return candidate;
    }
  }
  return null;
}

/* months, days, holidays, seasons, periods, and the date/year/decade patterns */
function checkTimeWords(norm, tokens){
  var T2 = D.time_words, name, p, g, key;
  for(name in T2.patterns){
    if(!Object.prototype.hasOwnProperty.call(T2.patterns, name)) continue;
    p = T2.patterns[name];
    if(new RegExp(p.regex, "i").test(norm)){
      return {form:formOf(p.article), why:p.explanation, ref:p.rule_ref,
              cat:"Time expression", match:norm,
              either:(p.article.indexOf("either") === 0)};
    }
  }
  for(name in T2.groups){
    if(!Object.prototype.hasOwnProperty.call(T2.groups, name)) continue;
    g = T2.groups[name];
    key = (g.words.indexOf(norm) !== -1) ? norm : findIn(tokens, g.words);
    if(key){
      return {form:formOf(g.article), why:g.explanation, ref:g.rule_ref,
              cat:cap(name.replace(/s$/, "")), match:key,
              either:(g.article.indexOf("either") === 0),
              unusual:T2.unusual};
    }
  }
  return null;
}

/* languages, meals and sports - productive rules, not word lists */
function checkCategories(norm, tokens){
  var name, c, key;
  for(name in D.categories){
    if(!Object.prototype.hasOwnProperty.call(D.categories, name)) continue;
    c = D.categories[name];
    key = (c.words.indexOf(norm) !== -1) ? norm : findIn(tokens, c.words);
    if(key){
      return {form:formOf(c.article), why:c.explanation, ref:c.rule_ref,
              cat:cap(name.replace(/s$/, "")), match:key,
              unusual:c.unusual};
    }
  }
  return null;
}

/* ---- the lookup table, but only where the fixed sense actually holds ---- */

var LOOKBACK_BOUNDARY = ["on","in","at","to","by","for","of","with","from","into",
  "onto","about","over","under","and","or","but","that","who","which","than"];
var LOOKBACK_LIMIT = 4;

function spanOf(tokens, phrase){
  var parts = phrase.split(" "), i, j, ok;
  for(i = 0; i + parts.length <= tokens.length; i++){
    ok = true;
    for(j = 0; j < parts.length; j++){
      if(tokens[i + j] !== parts[j]){ ok = false; break; }
    }
    if(ok) return [i, i + parts.length];
  }
  return [0, null];
}

/* the determiner governing a noun, looking past any adjectives between them */
function determinerBefore(tokens, start, words){
  var i = start - 1, steps = 0, t;
  while(i >= 0 && steps < LOOKBACK_LIMIT){
    t = tokens[i];
    if(words.indexOf(t) !== -1) return t;
    if(LOOKBACK_BOUNDARY.indexOf(t) !== -1) return null;
    i--; steps++;
  }
  return null;
}

function lookupResult(key, tokens){
  var e = D.lookup_table[key];
  var cond = e.conditions || null;
  var span = spanOf(tokens, key);
  var start = span[0], end = span[1];
  var following = (end !== null && end < tokens.length) ? tokens[end] : null;
  var forms = D.determiner_conflict.determiner_forms;

  function deferred(reason, why){
    return {form:"context", context:true, reason:reason, why:why,
            ref:(cond && cond.contrast_rule_ref) || e.rule_ref,
            cat:"Depends on the sentence", match:key,
            fixed:null,
            fixedSense:{article:e.article, why:e.explanation, ref:e.rule_ref},
            sense:cond ? cond.sense : null,
            examples:(cond && cond.examples) || []};
  }

  /* 1. a determiner already in front of the noun */
  var words = Object.keys(forms), g;
  for(g in D.determiners.groups){
    if(Object.prototype.hasOwnProperty.call(D.determiners.groups, g)){
      words = words.concat(D.determiners.groups[g]);
    }
  }
  var governing = determinerBefore(tokens, start, words);
  if(governing){
    for(g in D.determiners.groups){
      if(!Object.prototype.hasOwnProperty.call(D.determiners.groups, g)) continue;
      if(D.determiners.groups[g].indexOf(governing) !== -1){
        return {form:"blocked", blocked:true, why:D.determiners.explanation,
                ref:(g === "some_any" ? D.determiners.some_any_rule_ref : D.determiners.rule_ref),
                cat:"The slot is already taken", match:key};
      }
    }
    if(forms[governing] && forms[governing] !== e.article){
      return deferred("determiner_conflict", D.determiner_conflict.explanation);
    }
  }

  /* 2. the entry's own conditions */
  if(cond){
    var prev = start > 0 ? tokens[start - 1] : null;
    if(cond.requires_prev && cond.requires_prev.indexOf(prev) === -1){
      return deferred("missing_required_word", cond.contrast);
    }
    if(cond.blocked_by_next && cond.blocked_by_next.indexOf(following) !== -1){
      return deferred("blocked_by_following_word", cond.contrast);
    }
    if(cond.requires_any){
      var found = false, i;
      for(i = 0; i < cond.requires_any.length; i++){
        if(tokens.indexOf(cond.requires_any[i]) !== -1){ found = true; break; }
      }
      if(!found) return deferred("missing_required_word", cond.contrast);
    }
  }

  return {form:formOf(e.article), why:e.explanation, ref:e.rule_ref,
          cat:"Listed noun", match:key, note:e.note || null};
}

/* how long an input can be and still read as a bare noun phrase, and the verbs
   that mark it as a sentence instead */
var NOUN_PHRASE_LIMIT = 4;
var VERB_HINTS = ["is","are","was","were","am","be","been","being","have","has",
  "had","do","does","did","go","goes","went","like","likes","liked","want",
  "wants","need","needs","think","thinks","said","say","says","saw","see",
  "sees","bought","buy","buys","take","takes","took","get","gets","got","make",
  "makes","made","come","comes","came","play","plays","played","eat","eats",
  "ate","live","lives","lived","work","works","worked","study","studies",
  "studied","speak","speaks","spoke","read","reads","write","writes","wrote",
  "gave","give","gives","put","puts","know","knows","knew","found","find",
  "lend","lends","lent","send","sends","sent","spend","spends","spent",
  "meet","meets","met","tell","tells","told","bring","brings","brought",
  "catch","catches","caught","teach","teaches","taught","keep","keeps","kept",
  "feel","feels","felt","hold","holds","held","hear","hears","heard",
  "win","wins","won","pay","pays","paid","sell","sells","sold",
  "build","builds","built","mean","means","meant","become","becomes","became",
  "begin","begins","began","choose","chooses","chose","forget","forgets",
  "forgot","understand","understands","understood","borrow","borrows",
  "borrowed","wear","wears","wore","break","breaks","broke"];

/* Gate 0 for a noun the learner picked, inside the sentence they typed.
   The sentence still supplies context - the determiner in front of the word,
   the verb a condition needs - so only the matching narrows to that word. */
function gate0Pinned(text, focus){
  var tokens = tokenize(text);
  var word = normalize(focus);
  var span = spanOf(tokens, word);
  var i, hit;

  for(i = 0; i < 2; i++){
    hit = checkConstructions(text, tokens, i === 0);
    /* a frame speaks for the whole clause, so it still covers a noun inside
       it; any other rule has to have matched that word */
    if(hit && word && (hit.frame || (hit.matched || "").split(" ").indexOf(word) !== -1)){
      return hit;
    }
  }

  if(span[1] !== null){
    if(Object.prototype.hasOwnProperty.call(D.fixed_expressions, word)){
      var fx = D.fixed_expressions[word];
      return {form:formOf(fx.article), why:fx.explanation, ref:fx.rule_ref,
              cat:"Fixed expression", match:word, fixed:true};
    }
    if(Object.prototype.hasOwnProperty.call(D.lookup_table, word)){
      return lookupResult(word, tokens);
    }
  }

  hit = checkTimeWords(word, [word]) || checkCategories(word, [word]);
  if(hit) return hit;

  var nat = D.nationality_the;
  if(nat.examples.indexOf(word) !== -1 && span[0] > 0 &&
     (nat.requires_prev || ["the"]).indexOf(tokens[span[0] - 1]) !== -1){
    return {form:formOf(nat.article), why:nat.explanation, ref:nat.rule_ref,
            cat:"Nationality adjective", match:word};
  }

  if(isTheTakingName(text, word)){
    var pn = D.proper_noun_the;
    return {form:formOf(pn.article), why:pn.explanation, ref:pn.rule_ref,
            cat:"Name in the the-taking class", match:word};
  }
  return null;
}

/* The article slot is already filled.

   Only looks at the first word, so it can only speak for a bare noun phrase.
   In a sentence the leading determiner governs the subject, not necessarily
   the noun being asked about - "My mother is a teacher" was answering about
   `my mother` when the question is plainly about `a teacher`. */
function checkDeterminer(text, tokens){
  if(!tokens.length) return null;
  if(tokens.length > NOUN_PHRASE_LIMIT) return null;
  for(var v = 0; v < tokens.length; v++){
    if(VERB_HINTS.indexOf(tokens[v]) !== -1) return null;
  }
  var det = D.determiners, first = tokens[0], group, words;

  for(group in det.groups){
    if(!Object.prototype.hasOwnProperty.call(det.groups, group)) continue;
    words = det.groups[group];
    if(words.indexOf(first) !== -1){
      return {form:"blocked", why:det.explanation, blocked:true,
              ref:(group === "some_any" ? det.some_any_rule_ref : det.rule_ref),
              cat:"The slot is already taken",
              match:tokens.slice(1).join(" ") || first};
    }
  }

  /* a possessive 's fills the same slot: Sarah's car. A contraction does not -
     "There's a post office" is "there is". */
  var CONTRACTIONS = ["there","here","it","that","what","who","he","she","let",
                      "this","how","where"];
  var stem = String(first).split(/['\u2019]/)[0];
  if(CONTRACTIONS.indexOf(stem) === -1 &&
     /^\s*\S+['\u2019]s\s+\S+/.test(String(text || ""))){
    return {form:"blocked", why:det.explanation, blocked:true, ref:det.rule_ref,
            cat:"The slot is already taken",
            match:tokens.slice(1).join(" ") || tokens[0]};
  }
  return null;
}

/* A the-taking name, checked conservatively: a keyword only counts inside a
   capitalised name, and an of-construction needs a capital on each side. */
function isTheTakingName(text, norm){
  var pn = D.proper_noun_the;
  if(pn.named.indexOf(norm) !== -1) return true;

  var cased = casedTokens(text), i, j, t, neighbours;
  var lowered = cased.map(function(x){ return x.toLowerCase(); });

  for(i = 0; i < lowered.length; i++){
    if(pn.named.indexOf(lowered[i]) !== -1 && isCap(cased[i])) return true;
  }

  for(i = 0; i < lowered.length; i++){
    t = lowered[i];
    if(pn.keywords.indexOf(t) === -1 || !isCap(cased[i])) continue;
    neighbours = [];
    if(i > 0) neighbours.push(cased[i - 1]);
    if(i + 1 < cased.length) neighbours.push(cased[i + 1]);
    for(j = 0; j < neighbours.length; j++){
      if(isCap(neighbours[j])) return true;
    }
  }

  if(pn.contains_of){
    for(i = 1; i + 1 < cased.length; i++){
      if(lowered[i] === "of" && isCap(cased[i - 1]) && isCap(cased[i + 1])) return true;
    }
  }
  return false;
}

/* ---------------- entry point ---------------- */

function analyze(text, scriptedPath, focus){
  hist = [];
  pendingNote = null;
  cur = entry;
  pinned = focus || null;

  var hitResult = focus ? gate0Pinned(text, focus) : gate0(text);
  renderFocusBar(text, hitResult);
  if(hitResult){ renderGate0(hitResult); updateActions(); return true; }

  /* noun adjunct: two bare nouns, nothing matched -> the second noun decides */
  var tokens = tokenize(normalize(text));
  if(tokens.length === 2){
    var second = tokens[1];
    var secondHit = gate0(second);
    if(secondHit){
      secondHit.adjunct = tokens[0];
      renderGate0(secondHit);
      return true;
    }
    pendingNote = "<b>Noun-noun pair.</b> " + D.patterns.noun_adjunct.explanation +
                  " Deciding about <em>" + esc(second) + "</em>.";
  }

  if(scriptedPath && scriptedPath.length){
    scriptedPath.forEach(function(idx){
      var n = T[cur];
      if(!n || !n.opts) return;
      hist.push({node:cur, opt:idx});
      cur = n.opts[idx].go;
    });
  }
  render();
  return false;
}

/* ---------------- rendering ---------------- */

function render(){
  var n = T[cur];
  stage.innerHTML = "";
  if(pendingNote){
    var nc = document.createElement("div");
    nc.className = "note-card";
    nc.innerHTML = pendingNote;
    stage.appendChild(nc);
  }
  if(!hist.length){
    var badge = document.createElement("div");
    badge.className = "gate0 g-miss";
    badge.textContent = "No set phrase or known name \u2014 working through the questions";
    stage.appendChild(badge);
  }
  if(n.out) renderResult(n); else renderQuestion(n);
  renderTrail();
  updateActions();
}

function renderQuestion(n){
  var card = document.createElement("div");
  card.className = "qcard";
  var h = '<div class="gate">' + n.gate + '</div><h2 class="qtext">' + n.q + '</h2>';
  if(n.note) h += '<p class="qnote">' + n.note + '</p>';
  card.innerHTML = h;

  var box = document.createElement("div");
  var isChecklist = (n.style === "checklist");
  box.className = "opts" + (isChecklist ? " checklist" : "");

  function addOption(o, i){
    var b = document.createElement("button");
    b.className = "opt" + (o.cls ? " " + o.cls : "");
    var inner = "";
    if(o.tag) inner += '<span class="tag">' + o.tag + '</span>';
    inner += o.label;
    if(o.ex) inner += '<span class="ex">' + o.ex + '</span>';
    b.innerHTML = inner;
    b.addEventListener("click", function(){ choose(i); });
    box.appendChild(b);
  }

  /* On the checklist gate the way out goes first, and the reasons that all
     end in `the` sit under a heading that says so. Bottom-of-the-list, the
     escape hatch read as the last resort after seven the-options rather than
     as the other half of the choice.

     Indexes stay the ones in the data, so saved trace paths and the map do
     not move with the buttons. */
  var escapes = [], reasons = [];
  n.opts.forEach(function(o, i){
    (isChecklist && o.cls === "none" ? escapes : reasons).push({o:o, i:i});
  });

  if(isChecklist && escapes.length){
    escapes.forEach(function(e){ addOption(e.o, e.i); });
    var head = document.createElement("p");
    head.className = "optgroup";
    head.innerHTML = n.group || "";
    box.appendChild(head);
  }
  reasons.forEach(function(e){ addOption(e.o, e.i); });
  card.appendChild(box);

  if(n.warn){
    var w = document.createElement("div");
    w.className = "warn";
    w.innerHTML = n.warn;
    card.appendChild(w);
  }
  stage.appendChild(card);
}

/* The word this card is about, set as a heading. The card reads like a
   reference entry, so the entry needs a headword - otherwise the only clue
   that "work" was chosen over "government" is a line of small grey caps. */
function headword(word){
  if(!word) return "";
  return '<p class="headword">' + esc(asTyped(word)) + '</p>';
}

/* Matched keys are normalised, so `the Netherlands` comes back as
   "netherlands". Show it the way the learner wrote it. */
function asTyped(word){
  var raw = String(phrase.value || "");
  if(!raw || !word) return word;
  var escaped = String(word).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
                            .replace(/\s+/g, "\\s+");
  var m = new RegExp("\\b" + escaped + "\\b", "i").exec(raw);
  return m ? m[0] : word;
}

/* Is the whole input a bare noun phrase, so the article goes in front of all
   of it? Same test checkDeterminer uses. */
var CLAUSE_MARKERS = ["i","you","he","she","it","we","they","me","him","her",
  "us","them","who","which","that","there"];

function isNounPhrase(text){
  var toks = tokenize(normalize(text));
  if(!toks.length || toks.length > NOUN_PHRASE_LIMIT) return false;
  for(var v = 0; v < toks.length; v++){
    /* a pronoun is a clause subject or object, never part of the noun phrase
       being decided: `I work for government` is a sentence, not a phrase */
    if(CLAUSE_MARKERS.indexOf(toks[v]) !== -1) return false;
    if(VERB_HINTS.indexOf(toks[v]) !== -1 && !isKnownNoun(toks[v])) return false;
  }
  return true;
}

/* The word the answer is about.

   For `a lovely dinner` that is the whole input - the article goes in front of
   the phrase. For a sentence it is one noun inside it, so building the answer
   from the whole input gave `an I work for government`. */
function resultWord(){
  var raw = String(phrase.value || "");
  if(pinned) return asTyped(normalize(pinned));
  if(isNounPhrase(raw)) return displayWord(raw);
  var f = inferFocus(raw);
  return f ? asTyped(f) : displayWord(raw);
}

function buildPhrase(form, word){
  if(!word) return "";
  if(form === "the") return "the " + word;
  if(form === "an")  return chooseAOrAn(word) + " " + word;
  return word;
}

function renderResult(n){
  var f = FORM[n.out];
  var card = document.createElement("div");
  card.className = "result " + f.cls;
  var h = headword(resultWord()) +
          '<p class="form">' + f.word + '</p>' +
          '<p class="cat">' + n.cat + '</p>' +
          '<p class="why">' + n.why + '</p>';
  if(n.list){
    h += "<ul>";
    n.list.forEach(function(li){ h += "<li>" + li + "</li>"; });
    h += "</ul>";
  }
  var word = resultWord();
  if(word && n.out !== "fixed"){
    h += '<p class="built">' + esc(buildPhrase(n.out, word)) + '</p>';
  }
  h += refPill(n.rule_ref, n.rule_name);
  card.innerHTML = h;
  stage.appendChild(card);
}

function renderGate0(r){
  stage.innerHTML = "";
  trailbox.classList.add("hidden");
  trail.innerHTML = "";

  var badge = document.createElement("div");
  badge.className = "gate0 g-hit";
  badge.textContent = r.context
    ? "\u201c" + r.match + "\u201d has more than one reading"
    : "Matched \u201c" + r.match + "\u201d before any question";
  stage.appendChild(badge);

  if(r.adjunct){
    var nc = document.createElement("div");
    nc.className = "note-card";
    nc.innerHTML = "<b>Noun-noun pair.</b> " + D.patterns.noun_adjunct.explanation +
                   " So <em>" + esc(r.adjunct) + "</em> is ignored and <em>" +
                   esc(r.match) + "</em> decides.";
    stage.appendChild(nc);
  }

  if(r.context){ renderContext(r); return; }

  var f = FORM[r.form];
  var card = document.createElement("div");
  card.className = "result " + f.cls;
  var h = headword(r.match) +
          '<p class="form">' + f.word + '</p>' +
          '<p class="cat">' + r.cat + '</p>' +
          '<p class="why">' + r.why + '</p>';
  if(r.note){
    h += '<div class="senses"><div class="sense">' +
         '<span class="pill p-next">but</span><div class="lead">' + r.note.text +
         '<span class="ex">' + r.note.examples.map(esc).join(" \u00b7 ") + '</span>' +
         '</div></div></div>';
  }
  if(r.unusual){
    h += '<div class="senses"><div class="sense">' +
         '<span class="pill p-next">unusual use</span>' +
         '<div class="lead">' + r.unusual + '</div></div></div>';
  }
  if(r.construction && (r.examples.length || r.contrast)){
    h += '<div class="senses">';
    if(r.examples.length){
      h += '<div class="sense"><span class="pill p-next">examples</span>' +
           '<div class="lead"><span class="ex">' +
           r.examples.map(esc).join(" \u00b7 ") + '</span></div></div>';
    }
    if(r.contrast){
      h += '<div class="sense"><span class="pill p-next">but</span>' +
           '<div class="lead">' + r.contrast + '</div></div>';
    }
    h += '</div>';
  }
  if(r.fixed || r.blocked || r.either || r.construction){
    /* nothing to build: the phrase is already complete as typed, so echo it
       verbatim rather than through displayWord, which strips the apostrophe
       out of "Sarah's car" */
    h += '<p class="built">' + esc(String(phrase.value).trim() || r.match) + '</p>';
  }else{
    /* prefer what the user actually typed, so capitalisation survives */
    var typed = displayWord(phrase.value);
    var word = (normalize(typed) === r.match) ? typed : r.match;
    h += '<p class="built">' + esc(buildPhrase(r.form, word)) + '</p>';
  }
  h += refPill(r.ref);
  card.innerHTML = h;
  stage.appendChild(card);
}

/* Two readings, and no guess between them. Shows the fixed sense, the sense
   that applies otherwise, and a way into the questions. */
function renderContext(r){
  var f = FORM.context;
  var card = document.createElement("div");
  card.className = "result " + f.cls;

  var fixedForm = FORM[formOf(r.fixedSense.article)];
  var h = headword(r.match) +
          '<p class="form">' + f.word + '</p>' +
          '<p class="cat">' + r.cat + '</p>' +
          '<p class="why">' + r.why + '</p>' +
          '<div class="senses">' +
            '<div class="sense"><span class="pill ' + fixedForm.cls.replace("r-","p-") + '">' +
              fixedForm.word + '</span><div class="lead"><b>' +
              (r.sense ? esc(r.sense) : "the fixed sense") + '</b><span class="ex">' +
              r.fixedSense.why + '</span></div></div>';

  if(r.examples && r.examples.length){
    h += '<div class="sense"><span class="pill p-next">otherwise</span>' +
         '<div class="lead"><b>ordinary rules apply</b><span class="ex">' +
         r.examples.map(function(x){ return esc(x); }).join(" \u00b7 ") +
         '</span></div></div>';
  }
  h += '</div>';
  h += refPill(r.ref);
  card.innerHTML = h;
  stage.appendChild(card);

  var go = document.createElement("button");
  go.className = "btn";
  go.style.marginTop = "14px";
  go.textContent = "Work it out with the questions";
  go.addEventListener("click", function(){
    hist = []; cur = entry; pendingNote = null;
    /* the questions are about the word Gate 0 flagged, not whatever the
       sentence would otherwise infer - keep the answer on that word */
    pinned = r.match;
    render();
    stage.scrollIntoView({block:"nearest", behavior:"smooth"});
  });
  stage.appendChild(go);
}

function renderTrail(){
  if(!hist.length){ trailbox.classList.add("hidden"); trail.innerHTML = ""; return; }
  trailbox.classList.remove("hidden");
  trail.innerHTML = "";
  hist.forEach(function(step){
    var n = T[step.node], o = n.opts[step.opt];
    var li = document.createElement("li");
    /* short is the question in a few words - "can the listener identify it?"
       - which is what the reader needs to see beside their answer */
    var asked = n.short || n.gate;
    asked = asked.charAt(0).toUpperCase() + asked.slice(1);
    li.innerHTML = '<span class="q">' + asked + ' \u2014 </span>' +
                   '<span class="a">' + o.label.replace(/^\d[a-z]? \u00b7 /, "") + '</span>';
    trail.appendChild(li);
  });
}

function choose(i){
  var n = T[cur];
  hist.push({node:cur, opt:i});
  cur = n.opts[i].go;
  pendingNote = null;
  render();
  stage.scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* ---------------- controls ---------------- */

function runCheck(){
  analyze(phrase.value, null);
  stage.scrollIntoView({block:"nearest", behavior:"smooth"});
}

document.getElementById("check").addEventListener("click", runCheck);
phrase.addEventListener("keydown", function(e){
  if(e.key === "Enter"){ e.preventDefault(); runCheck(); }
});

/* "Go back a step" has to mean something at every point. After a Gate 0 match
   there is no walk to unwind, so the only step the learner has taken is
   choosing a word - and if they have not done that either, the button is
   disabled rather than sitting there doing nothing. */
function stepsAvailable(){
  return hist.length > 0 || !!pinned;
}

function updateActions(){
  backBtn.disabled = !stepsAvailable();
  backBtn.textContent = (!hist.length && pinned)
    ? "Undo word choice"
    : "Go back a step";
}

backBtn.addEventListener("click", function(){
  if(hist.length){
    var last = hist.pop();
    cur = last.node;
    render();
    return;
  }
  if(pinned){
    /* back to the word the tool picked on its own */
    analyze(phrase.value, null, null);
    stage.scrollIntoView({block:"nearest", behavior:"smooth"});
  }
});

document.getElementById("restart").addEventListener("click", function(){
  hist = []; cur = entry; pendingNote = null; pinned = null; phrase.value = "";
  focusEl.classList.add("hidden"); focusEl.innerHTML = "";
  render(); updateActions(); phrase.focus();
});

/* ---------------- map ---------------- */

function buildMap(){
  mapEl.innerHTML = "";

  /* Gate 0 reference: what used to be Question 1 */
  var fr = D.fixed_reference;
  var g0 = document.createElement("div");
  g0.className = "mgate";
  var gh = "<h3>" + fr.title + "</h3><p class=\"mq\">" + fr.note + "</p>";
  fr.groups.forEach(function(grp){
    gh += '<div class="refgroup"><h4>' + grp.label +
          ' <span class="pill p-' + (grp.form === "an" ? "an" : grp.form) + '">' +
          FORM[grp.form].word + '</span></h4><ul class="reflist">';
    grp.items.forEach(function(it){ gh += "<li>" + esc(it) + "</li>"; });
    gh += "</ul></div>";
  });
  g0.innerHTML = gh;
  mapEl.appendChild(g0);

  /* the tree itself, generated from the same data the walk uses */
  var order = ["q2", "q3", "q4", "q5"];
  order.forEach(function(id){
    var n = T[id];
    var d = document.createElement("div");
    d.className = "mgate";
    var h = "<h3>" + n.q + "</h3>";
    if(n.note) h += '<p class="mq">' + n.note + "</p>";
    h += renderMapRows(n);
    d.innerHTML = h;
    mapEl.appendChild(d);
  });
}

function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

/* A rule reaches the reader by name. The number it carries internally is for
   us, not for a student who has no numbered rules to look up.

   Some outcomes are reached by more than their cited section covers - the
   ordinary-name leaf answers for people and companies, not only places - so
   they carry a name of their own, and it wins over the one the ref implies. */
function refPill(ref, override){
  var name = override || (ref && D.rule_names ? D.rule_names[ref] : null);
  return name ? '<span class="ref">' + esc(name) + "</span>" : "";
}

function pillFor(nodeId){
  var n = T[nodeId];
  if(!n) return {p:nodeId, c:"p-next"};
  if(n.out) return {p:FORM[n.out].word, c:"p-" + n.out};
  return {p:n.gate, c:"p-next"};
}

function renderMapRows(n){
  var h = "";
  n.opts.forEach(function(o){
    var target = T[o.go], rows;
    /* expand a sub-question inline so the map stays flat and readable */
    if(target && target.opts && (o.go === "q2a" || o.go === "q3a" || o.go === "q4g")){
      rows = target.opts.map(function(so){
        var pf = pillFor(so.go);
        return {t: o.label + " \u2192 " + so.label, e: so.ex || "", p: pf.p, c: pf.c};
      });
    }else{
      var pf2 = pillFor(o.go);
      rows = [{t:o.label, e:o.ex || "", p:pf2.p, c:pf2.c}];
    }
    rows.forEach(function(r){
      h += '<div class="row"><div class="lead">' + r.t +
           (r.e ? '<span class="ex">' + r.e + "</span>" : "") +
           '</div><span class="pill ' + r.c + '">' + r.p + "</span></div>";
    });
  });
  return h;
}

/* ---------------- traces ---------------- */

var CHIP_COUNT = 24;
var SEEN_KEY = "article-helper:seen";

/* Which phrases have already been run. Kept across reloads so the row reads as
   a checklist, but a seen phrase stays in the pool and can be drawn again. */
var seen = loadSeen();

function loadSeen(){
  try{
    var raw = window.localStorage.getItem(SEEN_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  }catch(e){
    return new Set();
  }
}

function saveSeen(){
  try{
    window.localStorage.setItem(SEEN_KEY, JSON.stringify(Array.from(seen)));
  }catch(e){ /* private mode, file:// quirks - the marks are just not kept */ }
}

function shuffled(list){
  var a = list.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function buildChips(){
  chipsEl.innerHTML = "";
  shuffled(D.traces).slice(0, CHIP_COUNT).forEach(function(t){
    var b = document.createElement("button");
    b.className = "chip" + (seen.has(t.p) ? " seen" : "");
    b.textContent = t.p;
    if(seen.has(t.p)) b.title = "already run";
    b.addEventListener("click", function(){
      seen.add(t.p);
      saveSeen();
      b.className = "chip seen";
      b.title = "already run";
      phrase.value = t.p;
      analyze(t.p, t.path || null);
      stage.scrollIntoView({block:"nearest", behavior:"smooth"});
    });
    chipsEl.appendChild(b);
  });
}

document.getElementById("shuffle").addEventListener("click", buildChips);
document.getElementById("clearseen").addEventListener("click", function(){
  seen = new Set();
  saveSeen();
  buildChips();
});

/* ---------------- mode toggle ---------------- */

var walkEl = document.getElementById("walk");
var bWalk  = document.getElementById("m-walk");
var bMap   = document.getElementById("m-map");
function mode(isWalk){
  walkEl.classList.toggle("hidden", !isWalk);
  mapEl.classList.toggle("hidden", isWalk);
  bWalk.setAttribute("aria-pressed", String(isWalk));
  bMap.setAttribute("aria-pressed", String(!isWalk));
}
bWalk.addEventListener("click", function(){ mode(true); });
bMap.addEventListener("click", function(){ mode(false); });

/* ---------------- boot ---------------- */

/* Pages serves this with max-age=600, and it is cached independently of the
   page that reads it. Without revalidation a deploy can leave a visitor
   running new code against ten-minute-old rules. "no-cache" still uses the
   cache, but checks the ETag first, so a stale pair cannot happen. */
fetch("rules_data.json", {cache: "no-cache"})
  .then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function(data){
    D = data;
    T = D.decision_tree;
    FORM = D.form_labels;
    entry = (D.meta && D.meta.entry_node) || "q2";
    cur = entry;
    buildChips();
    buildMap();
    render();
  })
  .catch(function(err){
    stage.innerHTML = '<div class="err"><b>Could not load rules_data.json.</b><br><br>' +
      'The page reads its rules from that file, so it has to be served over HTTP \u2014 ' +
      'opening the .html directly from disk will not work. Run ' +
      '<code>python -m http.server</code> in the project folder and open ' +
      '<code>http://localhost:8000/</code>.<br><br>' +
      '<span class="ex">' + esc(String(err && err.message ? err.message : err)) + '</span></div>';
  });
</script>
</body>
</html>
