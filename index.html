<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Articles: a / an / the / zero</title>
<style>
:root{
  --paper:#EDF0F2;
  --card:#FAFBFB;
  --ink:#16232B;
  --muted:#5A6E78;
  --rule:#C7D0D5;
  --hairline:rgba(0,0,0,.13);
  --the:#1F5C7A;
  --the-wash:#E2ECF1;
  --the-edge:#B4CEDC;
  --an:#6B3F87;
  --an-wash:#EDE5F2;
  --an-edge:#CDB8D9;
  --zero:#2F6B4F;
  --zero-wash:#E1EDE7;
  --zero-edge:#B2CFC0;
  --fixed:#7A5C10;
  --fixed-wash:#F2EBD8;
  --fixed-edge:#DBCB9A;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
/* Dark mode. Same token names, same roles: paper stays the page, ink stays
   the text, and each of the four article colours keeps its identity, so a
   learner who has learned "teal means the" still reads it that way. */
@media (prefers-color-scheme:dark){
  :root{
    --paper:#131A1F;
    --card:#1B242A;
    --ink:#E4EBEF;
    --muted:#9AAAB3;
    --rule:#33424B;
    --hairline:rgba(255,255,255,.14);
    --the:#7FBEDD;
    --the-wash:#16323F;
    --the-edge:#2C5468;
    --an:#C7A3DC;
    --an-wash:#2A2036;
    --an-edge:#4A3A5C;
    --zero:#84C9A6;
    --zero-wash:#152F22;
    --zero-edge:#2C5442;
    --fixed:#DCBB60;
    --fixed-wash:#332913;
    --fixed-edge:#5C4A20;
  }
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:0 auto;padding:32px 24px 80px}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:24px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;margin-bottom:28px;
}
.masthead h1{
  font-family:var(--serif);
  font-size:30px;font-weight:400;letter-spacing:-.01em;
  margin:0;
}
.masthead h1 .slash{color:var(--muted);padding:0 2px}
.modes{display:flex;gap:2px;background:var(--rule);padding:2px;border-radius:2px}
.modes button{
  font-family:var(--sans);font-size:13px;
  border:0;background:transparent;color:var(--muted);
  padding:6px 14px;cursor:pointer;border-radius:1px;
}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600}
.modes button:focus-visible{outline:2px solid var(--the);outline-offset:1px}

/* ---------- phrase bar ---------- */
.phrasebar{margin-bottom:24px}
.phrasebar label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.phrasebar input{
  width:100%;font-family:var(--serif);font-size:19px;
  padding:10px 12px;border:1px solid var(--rule);border-radius:2px;
  background:var(--card);color:var(--ink);
}
.phrasebar input:focus{outline:2px solid var(--the);outline-offset:-1px;border-color:var(--the)}

/* ---------- question card ---------- */
.qcard{
  background:var(--card);
  border:1px solid var(--rule);
  border-left:4px solid var(--ink);
  border-radius:2px;
  padding:24px 26px;
}
.gate{font-size:13px;color:var(--muted);margin-bottom:10px}
.qtext{
  font-family:var(--serif);
  font-size:25px;line-height:1.3;font-weight:400;
  margin:0 0 10px;max-width:34em;
}
.qnote{font-size:14px;color:var(--muted);margin:0 0 20px;max-width:46em}
.qnote em{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:grid;grid-template-columns:1fr auto;column-gap:12px;align-items:baseline;
  width:100%;text-align:left;
  font-family:var(--sans);font-size:15px;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:12px 14px;cursor:pointer;
  transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--ink);background:var(--card)}
.opt:focus-visible{outline:2px solid var(--the);outline-offset:1px}
.opt .ex{grid-column:1;grid-row:2;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);margin-top:4px}
.opt .tag{grid-column:2;grid-row:1;font-size:12px;color:var(--muted)}
/* The generic option carries the note's test already applied to its examples.
   Setting the inserted words apart - upright, sans, tinted - lets the eye read
   the original sentence straight through them and see what was added. */
.opt .ex ins{
  text-decoration:none;font-style:normal;font-family:var(--sans);
  font-size:13px;color:var(--the);
  border-bottom:1px dashed var(--the-edge);
  padding-bottom:1px;white-space:nowrap;
}

/* checklist style for the identifiability gate */
.checklist .opt{border-left:3px solid var(--the)}
.checklist .opt.none{border-left:3px solid var(--rule)}
/* names the block underneath: everything below this line answers `the` */
.optgroup{
  display:flex;align-items:center;gap:10px;
  margin:14px 0 2px;font-size:13px;color:var(--muted);
}
.optgroup::after{content:"";flex:1;height:1px;background:var(--rule)}
.optgroup em{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--the)}

.warn{
  background:var(--fixed-wash);
  border:1px solid var(--fixed-edge);border-radius:2px;
  padding:12px 14px;font-size:14px;margin:16px 0 0;
}
.warn strong{font-weight:600}
.warn em{font-family:var(--serif);font-size:15px}

/* ---------- result ---------- */
.result{border-radius:2px;padding:26px;border:1px solid var(--rule)}
.result .form{
  font-family:var(--serif);font-size:52px;line-height:1;font-weight:400;
  margin:0 0 6px;letter-spacing:-.02em;
}
.result .cat{font-size:14px;margin:0 0 18px;font-weight:600}
.result .why{font-size:15px;max-width:44em;margin:0 0 16px}
.result .why em{font-family:var(--serif);font-size:16px}
.result .built{
  font-family:var(--serif);font-size:24px;
  padding:14px 0 0;border-top:1px solid var(--hairline);margin-top:6px;
}
.result ul{margin:10px 0 0;padding-left:20px}
.result li{font-family:var(--serif);font-size:16px;margin-bottom:3px}
.r-the{background:var(--the-wash);border-color:var(--the-edge)}
.r-the .form,.r-the .cat{color:var(--the)}
.r-an{background:var(--an-wash);border-color:var(--an-edge)}
.r-an .form,.r-an .cat{color:var(--an)}
.r-zero{background:var(--zero-wash);border-color:var(--zero-edge)}
.r-zero .form,.r-zero .cat{color:var(--zero)}
.r-fixed{background:var(--fixed-wash);border-color:var(--fixed-edge)}
.r-fixed .form,.r-fixed .cat{color:var(--fixed)}

/* ---------- trail ---------- */
.trail{margin-top:26px;border-top:1px solid var(--rule);padding-top:16px}
.trail h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 10px}
.trail ol{margin:0;padding:0;list-style:none;counter-reset:step}
.trail li{
  counter-increment:step;font-size:14px;padding:5px 0 5px 30px;position:relative;
  border-bottom:1px solid var(--rule);
}
.trail li:last-child{border-bottom:0}
.trail li::before{
  content:counter(step);position:absolute;left:0;top:5px;
  width:20px;height:20px;border-radius:50%;background:var(--rule);color:var(--ink);
  font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600;
}
.trail .q{color:var(--muted);display:block;font-size:13px}
.trail .a{color:var(--ink);font-weight:600}

.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{
  font-family:var(--sans);font-size:14px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:9px 16px;border-radius:2px;cursor:pointer;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--the);outline-offset:1px}
.btn.ghost{border-color:var(--rule);color:var(--muted)}
.btn.ghost:hover{background:var(--rule);color:var(--ink)}

/* ---------- traces ---------- */
.traces{margin-top:34px;border-top:1px solid var(--rule);padding-top:18px}
.traces-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.traces h2{font-size:13px;color:var(--muted);font-weight:600;margin:0}
.traces-tools{display:flex;gap:8px}
.btn.sm{font-size:12px;padding:4px 10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-family:var(--serif);font-size:15px;font-style:italic;
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:6px 11px;cursor:pointer;color:var(--ink);
}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--the);outline-offset:1px}
/* A chip already run is dimmed and ticked. The mark says "you have seen this
   one" and nothing else - never which form it lands on. */
.chip.seen{color:var(--muted);border-style:dashed}
.chip.seen::before{content:"✓ ";font-style:normal;font-size:12px}

/* ---------- map ---------- */
.map .mgate{margin-bottom:26px;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ink);border-radius:2px;padding:18px 22px}
.map .mgate-label{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 4px}
.map h2{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 4px}
.map .mq{font-size:14px;color:var(--muted);margin:0 0 14px}
.map .row{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:14px;align-items:flex-start}
.map .row .lead{flex:1 1 auto}
.map .row .ex{font-family:var(--serif);font-style:italic;color:var(--muted);display:block;margin-top:2px}
.pill{
  flex:0 0 auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:2px;white-space:nowrap;
}
.p-the{background:var(--the-wash);color:var(--the)}
.p-an{background:var(--an-wash);color:var(--an)}
.p-zero{background:var(--zero-wash);color:var(--zero)}
.p-fixed{background:var(--fixed-wash);color:var(--fixed)}
.p-next{background:var(--rule);color:var(--ink)}

/* ---------- the readings list ---------- */
/* Each reading is a button, because choosing one is the whole point of the
   mode. It borrows the result card's wash so the form it recommends is
   readable before the text under it is. */
.reading{
  display:block;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;
  border:1px solid var(--rule);border-radius:2px;padding:16px 18px;margin-bottom:10px;
}
.reading:hover,.reading:focus-visible{border-color:var(--ink)}
.reading .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.reading .built{font-family:var(--serif);font-size:24px;margin:0}
.reading .cat{font-size:13px;font-weight:600;margin:8px 0 0}
/* The example is what the learner reads the card by: they recognise the use
   they meant faster than they recognise a description of it. So it leads, in
   the serif, and the rule that licenses it follows underneath in the small
   grey the trail uses. */
.reading .lead-ex{
  font-family:var(--serif);font-size:17px;line-height:1.6;
  margin:10px 0 0;color:var(--ink);
}
.reading .why{font-size:13px;margin:6px 0 0;max-width:44em;color:var(--muted)}
.reading .why em{font-family:var(--serif);font-size:15px}
.reading .when{font-size:13px;color:var(--muted);margin:6px 0 0}
.reading .ex{font-family:var(--serif);font-style:italic;color:var(--muted);
  display:block;font-size:14px;margin-top:6px}
.readhead{
  margin:22px 0 10px;font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
  border-top:1px solid var(--rule);padding-top:14px;
}
.readhead:first-child{border-top:0;margin-top:0;padding-top:0}
/* A cue says why `the` is right, so it repeats neither the phrase nor the
   form: the heading above the run of them has said both once. */
.reading.cue{padding:14px 18px}
.reading.cue .lead-ex{margin-top:0}
.hidden{display:none}
.foot{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:560px){
  .wrap{padding:22px 16px 60px}
  .masthead h1{font-size:24px}
  .qtext{font-size:21px}
  .result .form{font-size:40px}
}
@media (max-width:820px){
  .wrap{padding:28px 20px 70px}
  .qtext{font-size:23px}
  .result .form{font-size:46px}
  .map .row{flex-wrap:wrap}
}

/* Motion does one job: showing that what is on screen was just replaced.
   The card that answers you rises in; each trail step rises in after the one
   before it, so an appended step reads as appended. */
@media (prefers-reduced-motion:no-preference){
  .qcard,.result,.err,.note-card{animation:rise .28s cubic-bezier(.16,1,.3,1) both}
  .trail li{animation:rise .24s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i,0) * 45ms)}
}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- gate 0 ---------- */
.phrasebar .row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.phrasebar .row input{flex:1 1 240px}
.gate0{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:2px;
  background:var(--rule);color:var(--ink);margin-bottom:10px;
}
.g-hit{background:var(--fixed-wash);color:var(--fixed)}
.g-miss{background:var(--rule);color:var(--muted)}
.ref{
  display:inline-block;font-size:12px;color:var(--muted);
  border:1px solid var(--rule);border-radius:2px;padding:2px 7px;margin-top:14px;
}
.note-card{
  background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--fixed);
  border-radius:2px;padding:14px 18px;margin-bottom:18px;font-size:14px;
}
.note-card b{font-weight:600}
.err{
  background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--an);
  border-radius:2px;padding:18px 22px;font-size:14px;
}
.reflist{columns:2;column-gap:26px;margin:10px 0 0;padding:0;list-style:none}
.reflist li{
  font-family:var(--serif);font-style:italic;font-size:14px;
  break-inside:avoid;padding:2px 0;color:var(--ink);
}
.refgroup{margin-bottom:18px}
.refgroup h3{margin:0;font-size:13px;font-weight:600;color:var(--muted);
  display:flex;align-items:center;gap:8px}
.senses{margin-top:16px;border-top:1px solid var(--rule)}
.senses .sense{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);
  align-items:flex-start;font-size:14px}
.senses .sense:last-child{border-bottom:0}
.senses .lead{flex:1 1 auto}
.senses .lead b{font-weight:600}
.senses .ex{font-family:var(--serif);font-style:italic;color:var(--muted);
  display:block;margin-top:3px}
/* ---------- which word are we deciding about ---------- */
.focusbar{
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:12px 16px;margin-bottom:16px;
}
.focusbar h2{
  margin:0 0 8px;font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;color:var(--muted);
}
.sentence{font-family:var(--serif);font-size:18px;line-height:1.9}
.sentence .w{
  padding:1px 3px;border-radius:2px;color:var(--ink);
  border:1px solid transparent;background:none;font:inherit;
  /* a word with no break in it - a compound, a pasted URL - used to push the
     whole page sideways rather than wrap */
  overflow-wrap:anywhere;
}
.sentence button.w{
  cursor:pointer;color:var(--muted);
  text-decoration:underline;text-decoration-style:dotted;
  text-underline-offset:4px;
}
.sentence button.w:hover{border-color:var(--rule);background:var(--paper);color:var(--ink)}
.sentence button.w:focus-visible{outline:2px solid var(--the);outline-offset:1px}
.sentence .w.on{
  background:var(--the-wash);border-color:var(--the);color:var(--the);font-weight:600;
}
.focushint{margin:8px 0 0;font-size:13px;color:var(--muted)}
.result .headword{
  /* A dictionary headword, not a title. Grey rather than ink, so it names
     the entry without competing with the article underneath, and the rule
     goes grey with it. The underline sits 5px down, so the margin below has
     to clear it. */
  font-family:var(--serif);font-size:17px;margin:0 0 14px;
  color:var(--muted);
  text-decoration:underline;text-underline-offset:5px;
  text-decoration-thickness:1px;
}
/* "Go back a step" is disabled when there is no step to go back to, rather
   than sitting there looking clickable and doing nothing */
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost:disabled:hover{background:transparent;color:var(--muted)}
@media (max-width:560px){ .reflist{columns:1} }
/* ---------------- play ---------------- */

/* Right and wrong get colours of their own. The four article colours say which
   article it is, not whether the learner was right, and the Gloss restyle is
   about to collapse them into one blue - borrowing --zero for "correct" would
   leave the drill with no way to say so. */
:root{
  --good:#2F6B4F; --good-wash:#E4EEE8;
  --bad:#8A3324;  --bad-wash:#F5E4E0;
}
@media (prefers-color-scheme:dark){
  :root{
    --good:#7FC3A0; --good-wash:#16302A;
    --bad:#E09A88;  --bad-wash:#38201B;
  }
}
.gbar{
  display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  margin:0 0 18px;padding-bottom:10px;border-bottom:1px solid var(--hairline);
  font-size:13px;color:var(--muted);
}
.glevel{margin:0;font-weight:600;color:var(--ink)}
.gscore{margin:0}
.glevelnote{
  margin:0 0 14px;padding-bottom:12px;border-bottom:1px solid var(--hairline);
  font-size:14px;color:var(--muted);max-width:44em;
}
.gphrase{
  font-family:var(--serif);font-size:26px;line-height:1.45;
  margin:0 0 4px;color:var(--ink);
}
.gphrase .blank{
  border-bottom:2px solid var(--rule);padding:0 .1em;
  letter-spacing:.06em;color:var(--muted);
}
.gopts{display:grid;gap:8px;margin-top:18px;max-width:44em}
.gopt{
  display:flex;gap:12px;align-items:baseline;text-align:left;width:100%;
  font:inherit;cursor:pointer;background:var(--card);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px;padding:12px 14px;
}
.gopt .num{font-size:12px;color:var(--muted);min-width:1em;flex:0 0 auto}
.gopt:hover:not(:disabled){border-color:var(--ink)}
.gopt:disabled{cursor:default}
.gopt.right{background:var(--good-wash);border-color:var(--good);color:var(--good)}
.gopt.right .num,.gopt.wrong .num{color:inherit}
.gopt.wrong{background:var(--bad-wash);border-color:var(--bad);color:var(--bad)}
.gfeed{margin-top:14px}
.gverdict{
  font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  margin:0 0 10px;
}
.gverdict.good{color:var(--good)}
.gverdict.bad{color:var(--bad)}
.gfeed .built{font-family:var(--serif);font-size:24px;margin:0 0 14px;color:var(--ink)}
.gfeed .built .fill{color:var(--muted)}
.gfeed .cat{font-size:14px;font-weight:600;margin:0 0 10px}
.gfeed .why{font-size:15px;max-width:44em;margin:0 0 14px}
.gfeed .why em{font-family:var(--serif);font-size:16px}
.gacts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.gsum{display:flex;gap:32px;flex-wrap:wrap;margin:14px 0 18px}
.gsum b{display:block;font-family:var(--serif);font-size:30px;font-weight:400;color:var(--ink)}
.gsum div{font-size:13px;color:var(--muted)}
.gmissh{font-size:13px;font-weight:600;letter-spacing:.04em;margin:18px 0 10px;color:var(--muted)}
@media (max-width:560px){
  .gbar{flex-direction:column;align-items:flex-start;gap:2px}
  .gphrase{font-size:22px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>a <span class="slash">/</span> an <span class="slash">/</span> the <span class="slash">/</span> zero</h1>
    <div class="modes" role="group" aria-label="View">
      <button id="m-walk" aria-pressed="true">Walk the tree</button>
      <button id="m-map" aria-pressed="false">See the whole map</button>
      <button id="m-senses" aria-pressed="false">Look a word up</button>
      <button id="m-play" aria-pressed="false">Play</button>
    </div>
  </div>

  <!-- ============ WALK ============ -->
  <div id="walk">
    <div class="phrasebar">
      <label for="phrase">Noun or phrase you're deciding about</label>
      <div class="row">
        <input id="phrase" type="text" placeholder="government" autocomplete="off">
        <button class="btn" id="check">Check</button>
      </div>
    </div>

,"have dinner","for breakfast","for lunch","for dinner","on Monday","on Tuesday","on Wednesday","on Thursday","on Friday","on Saturday","on Sunday","at night","at noon","at midnight","at dawn","at dusk","by car","by bus","by train","by plane","by bike","by boat","by taxi","on foot","by heart","on time","in time","on purpose","in trouble","in charge of","out of date","in fact","at first","at last","by mistake","in danger","take place","catch fire","make progress","give way","hand in hand","side by side","face to face","from beginning to end","day by day","step by step","little by little"]},{"form":"the","label":"The","items":["in the morning","in the afternoon","in the evening","during the day","during the week","the day after tomorrow","the day before yesterday","play the piano","play the guitar","play the violin","on the radio","at the moment","in the end","by the way","all the time","on the whole","in the meantime","at the same time","on the other hand"]},{"form":"an","label":"A / an","items":["twice a week","once a week","three times a week","50 a night","once a day","twice a month","a lot of","a few","a little","in a hurry","as a result","all of a sudden","a couple of","in a moment","have a good time","as a matter of fact","at a loss","in a row"]}]},"determiners":{"article":"no article needed","result":"blocked","rule_ref":null,"explanation":"The slot before the noun is already filled. English allows only one determiner there, so an article is neither needed nor possible: \u003cem>my book\u003c/em>, never \u003cem>the my book\u003c/em>. This is not a zero-article rule — the question simply does not arise.","groups":{"possessive":["my","your","his","her","its","our","their","whose"],"demonstrative":["this","that","these","those"],"quantifier":["each","every","either","neither","both","all","another","much","many","several","enough"],"some_any":["some","any","no"]},"some_any_rule_ref":"Appendix 3","possessive_s_note":"A possessive \u003cem>'s\u003c/em> fills the same slot: \u003cem>Sarah's car\u003c/em>.","rule_name":"Only one determiner before a noun"},"constructions":[{"name":"there_is_singular","regex":"\\b(there is|there's|there was|is there|was there)\\b","article":"a / an","rule_ref":"2.7","explanation":"\u003cem>There is / there are\u003c/em> in the \u003cem>something exists\u003c/em> sense introduces something the listener does not yet know about, so a singular noun takes \u003cem>a/an\u003c/em>.","examples":["There's a post office in my town.","Is there a bank nearby?"],"contrast":"An uncountable noun after \u003cem>there is\u003c/em> takes no article instead: \u003cem>There is always traffic on this road.\u003c/em> And \u003cem>there\u003c/em> can mean \u003cem>in a certain place\u003c/em>, where no special rule applies: \u003cem>There are the books that I lost!\u003c/em>","frame":true},{"name":"there_are_plural","regex":"\\b(there are|there were|are there|were there)\\b","article":"no article","rule_ref":"2.7","explanation":"\u003cem>There are\u003c/em> in the \u003cem>something exists\u003c/em> sense takes a plural noun, and it is normal to use a number or no article rather than an article.","examples":["There are two train stations in Glasgow.","There are butterflies in my garden.","There is always traffic on this road."],"contrast":"\u003cem>There\u003c/em> meaning \u003cem>in a certain place\u003c/em> is different: \u003cem>There are the books that I lost!\u003c/em>","frame":true},{"name":"exclamation_what_a","regex":"^what (a|an)\\b","article":"a / an","rule_ref":"5.3","explanation":"An exclamation with \u003cem>what\u003c/em> and a singular countable noun takes \u003cem>a/an\u003c/em>.","examples":["What a beautiful day!","What a party!","What a horrible taste!"],"frame":true},{"name":"exclamation_what","regex":"^what\\b","article":"a / an with a singular countable noun, otherwise no article","rule_ref":"5.3","explanation":"An exclamation with \u003cem>what\u003c/em> takes \u003cem>a/an\u003c/em> before a singular countable noun, and no article before a plural or uncountable one.","examples":["What a beautiful day!","What terrible weather!","What lovely shoes!","What luck!"],"frame":true},{"name":"unique_role","regex":"\\b(elect|elects|elected|appoint|appoints|appointed|become|becomes|became|crowned|made|as)\\s+(?:[a-z]+\\s+)?(?:a |an |the )?(captain|chairman|chairwoman|chair|ceo|cfo|cto|director|treasurer|king|queen|president|professor|chief|head|headteacher|principal|dean|ambassador|governor|mayor|pope|chancellor|secretary|manager|coach|prime minister|vice president|head teacher)\\b","article":"no article","rule_ref":"6.5","explanation":"A job that is the only one of its kind in an organization takes no article after verbs such as \u003cem>elect\u003c/em>, \u003cem>appoint\u003c/em>, \u003cem>become\u003c/em> and \u003cem>be\u003c/em>, or after \u003cem>as\u003c/em>.","examples":["Julie was appointed headteacher of our school.","She was elected president.","He became king in 1781.","Luke started working as CEO last week."],"contrast":"An ordinary job takes \u003cem>a/an\u003c/em>, and a role identified for the listener takes \u003cem>the\u003c/em>: \u003cem>Julie is a headteacher\u003c/em>, \u003cem>Julie is the headteacher of our school\u003c/em>.","frame":true},{"name":"in_the_next_last","regex":"\\bin the (next|last)\\b.*\\b(week|weekend|month|year|night|morning|afternoon|evening|summer|winter|spring|autumn|fall|term|semester|decade|century|monday|tuesday|wednesday|thursday|friday|saturday|sunday|january|february|march|april|may|june|july|august|september|october|november|december)\\b","article":"the","rule_ref":"7.11","explanation":"\u003cem>In the next / last\u003c/em> + a time word takes \u003cem>the\u003c/em>, and means a stretch running from now: \u003cem>in the next year\u003c/em> is \u003cem>between now and a year from now\u003c/em>, which is different from \u003cem>next year\u003c/em>.","examples":["I'll finish my thesis in the next year.","I lost my credit card sometime in the last week."]},{"name":"next_last_time","regex":"\\b(next|last) time\\b","article":"either the or no article","rule_ref":"7.11","explanation":"With \u003cem>next time\u003c/em> and \u003cem>last time\u003c/em> either \u003cem>the\u003c/em> or no article works.","examples":["(The) next time we go out, I'll bring my umbrella.","(The) last time I saw her, she looked really tired."]},{"name":"next_last_time_word","regex":"\\b(next|last) (week|weekend|month|year|night|morning|afternoon|evening|summer|winter|spring|autumn|fall|term|semester|decade|century|monday|tuesday|wednesday|thursday|friday|saturday|sunday|january|february|march|april|may|june|july|august|september|october|november|december)\\b","article":"no article","rule_ref":"7.11","explanation":"\u003cem>Next\u003c/em> and \u003cem>last\u003c/em> with a time expression take no article, even though they usually take \u003cem>the\u003c/em> as adjectives.","examples":["I'm going to visit my brother next week.","I saw David last week.","I went on vacation to Bolivia last summer."],"contrast":"With an ordinary noun they do take \u003cem>the\u003c/em>: \u003cem>We'll get on the next bus\u003c/em>, \u003cem>He ate the last chocolate\u003c/em>."},{"name":"ordinal_prize","regex":"\\b(first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth) (prize|place)\\b","article":"no article","rule_ref":"7.12","explanation":"\u003cem>First prize\u003c/em> and \u003cem>second place\u003c/em> in races and competitions are fixed expressions and take no article.","examples":["Lucy came in first place.","I won second prize!"]},{"name":"ordering_ideas","regex":"^(first|second|third|finally)$","article":"no article","rule_ref":"7.12","explanation":"Used alone to put ideas in order, an ordinal takes no article.","examples":["First, you mix the flour. Second, you add the water."]},{"name":"a_ordinal_one_more","regex":"\\b(a|an) (first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth) [a-z]+\\b","article":"a / an","rule_ref":"7.12","explanation":"\u003cem>A/an\u003c/em> with an ordinal means \u003cem>one more\u003c/em>, not \u003cem>the Nth one in a row\u003c/em>. Less common than \u003cem>the\u003c/em>.","examples":["Would you like a second cup of coffee?","We missed two buses, but thankfully a third bus came along."]},{"name":"next_last_adjective","regex":"\\b(next|last) [a-z]+\\b","article":"the","rule_ref":"2.4.4","explanation":"As ordinary adjectives, \u003cem>next\u003c/em> and \u003cem>last\u003c/em> take \u003cem>the\u003c/em>, because they identify which one you mean.","examples":["We'll get on the next bus.","I can't believe he ate the last chocolate!"],"contrast":"With a time expression they take no article instead: \u003cem>next week\u003c/em>, \u003cem>last summer\u003c/em>."},{"name":"ordinal_noun","regex":"\\b(first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth) [a-z]+\\b","article":"the","rule_ref":"7.12","explanation":"An ordinal takes \u003cem>the\u003c/em> when it makes clear which one you mean.","examples":["She bought the first dress she found.","I'd like the third cake on the shelf."],"contrast":"\u003cem>A/an\u003c/em> is possible when it does not identify which one, meaning \u003cem>one more\u003c/em>: \u003cem>Would you like a second cup of coffee?\u003c/em>"},{"name":"comparative_pair","regex":"^the (more|less|better|worse|[a-z]+er)\\b.*\\bthe (more|less|better|worse|[a-z]+er)\\b.*$","article":"the","rule_ref":"7.13","explanation":"The \u003cem>the + comparative, the + comparative\u003c/em> structure says that two things change together. Both halves take \u003cem>the\u003c/em>.","examples":["The sunnier it is, the happier I am.","The more work you do, the better your result will be.","The hotter the curry, the better!"]},{"name":"the_most","regex":"\\bthe most\\b","article":"the","rule_ref":"7.8","explanation":"\u003cem>The most\u003c/em> is part of a superlative with a long adjective, and implies a comparison. With a noun it means \u003cem>the largest number of\u003c/em>.","examples":["Lucy is the most intelligent student in the class.","James has the most books of the people in the class."],"frame":true},{"name":"most_of_the","regex":"\\bmost of the\\b","article":"no article","rule_ref":"7.8","explanation":"\u003cem>Most\u003c/em> itself takes no article. \u003cem>Most of the\u003c/em> + noun keeps the same meaning as bare \u003cem>most\u003c/em>, and needs \u003cem>the\u003c/em> because that noun is specific.","examples":["Most of the people in the class like cake.","Most of the cats in London wear collars."],"frame":true},{"name":"most_noun","regex":"^most [a-z]+","article":"no article","rule_ref":"7.8","explanation":"\u003cem>Most\u003c/em> before a noun means \u003cem>almost all\u003c/em> or \u003cem>very many\u003c/em>, and takes no article.","examples":["Most people like chocolate.","Most children drink milk."],"frame":true},{"name":"bare_few_little","regex":"\\b(few|little|lots of)\\b","article":"no article","rule_ref":"7.7","explanation":"Bare \u003cem>few\u003c/em> and \u003cem>little\u003c/em> take no article and mean \u003cem>almost none\u003c/em> — noticeably less than \u003cem>a few\u003c/em> and \u003cem>a little\u003c/em>, which mean \u003cem>a small amount, but enough\u003c/em>.","examples":["Sorry, I have little money. I really can't afford to go out.","There have been few problems with the new system, thankfully!"],"contrast":"Compare \u003cem>I have a little money, enough for the cinema\u003c/em> with \u003cem>I have little money\u003c/em>. With something unwanted, the bare form is positive: \u003cem>there is little crime in my town\u003c/em>."},{"name":"one_of_the","regex":"\\bone of (the|these|those)\\b","article":"one","rule_ref":"7.9.1","explanation":"Use \u003cem>one\u003c/em>, not \u003cem>a/an\u003c/em>, before \u003cem>of the\u003c/em>, \u003cem>of these\u003c/em> or \u003cem>of those\u003c/em>.","examples":["One of the students cheated in the exam.","I think Madonna lives in one of these houses."]},{"name":"a_with_large_numbers","regex":"\\b(a|an|one) (hundred|thousand|million|billion|quarter|third)\\b","article":"a / an","rule_ref":"7.9.1","explanation":"\u003cem>A/an\u003c/em> is the normal choice before \u003cem>hundred\u003c/em>, \u003cem>thousand\u003c/em>, \u003cem>million\u003c/em> and fractions like \u003cem>third\u003c/em> and \u003cem>quarter\u003c/em>. \u003cem>One\u003c/em> is possible but emphasizes the number.","examples":["My great-aunt is a hundred years old.","It cost a thousand pounds.","About a quarter of the earth's surface is covered by land."]},{"name":"and_a_half","regex":"\\b(and a half|a [a-z]+ and a half)\\b","article":"a / an","rule_ref":"7.9.2","explanation":"After a number, \u003cem>half\u003c/em> takes \u003cem>a\u003c/em>: \u003cem>two and a half hours\u003c/em>. The same applies after a word saying how much or how long, and that word must also take \u003cem>a\u003c/em>.","examples":["It took two and a half hours to get to the airport.","We were in Paris for a week and a half."]},{"name":"half_zero","regex":"\\bhalf (of|past|an|a)\\b","article":"no article","rule_ref":"7.9.2","explanation":"\u003cem>Half\u003c/em> normally takes no article of its own, and \u003cem>one\u003c/em> is not used with it.","examples":["Could I have half of the pizza, please?","It's half past four.","We walked along the beach for about half an hour."]},{"name":"body_part_after_verb","regex":"\\b(touch|touched|touches|shoot|shot|shoots|take|took|takes|pull|pulled|pulls|hit|hits|kick|kicked|kicks|pat|patted|pats|grab|grabbed|grabs|hold|held|holds|kiss|kissed|kisses|punch|punched|bite|bit)\\b.*\\b(on|in|by) the (head|arm|arms|leg|legs|face|shoulder|shoulders|hand|hands|back|nose|ear|ears|knee|knees|chest|neck|foot|feet|wrist|elbow|cheek|forehead|hair|stomach)\\b","article":"the","rule_ref":"4.7","explanation":"After certain verbs — \u003cem>touch, shoot, take, pull, hit, kick, pat, grab, hold, kiss\u003c/em> — a part of the body takes \u003cem>the\u003c/em> after a preposition. It is almost a fixed phrase.","examples":["She touched him on the arm.","The criminal shot the policeman in the leg."],"contrast":"Normally a body part takes a possessive instead: \u003cem>I've hurt my leg\u003c/em>, \u003cem>He broke his arm\u003c/em>."},{"name":"family_surname","regex":"^the [A-Z][a-z]+s$","article":"the","rule_ref":"9.4.2","explanation":"\u003cem>The\u003c/em> + surname + \u003cem>s\u003c/em> means that family.","examples":["The Smiths are coming to dinner.","We've been invited on vacation with the Blacks."],"case_sensitive":true,"not_if_known":true},{"name":"unknown_person","regex":"\\b(a|an) (mr|mrs|ms|miss|dr|doctor) [a-z]+\\b","article":"a / an","rule_ref":"9.4.3","explanation":"\u003cem>A/an\u003c/em> before a name says you do not know the person, or are uncertain who they are.","examples":["A Mr Thompson called for you.","There's a Jane Green at the door."]},{"name":"titled_name","regex":"^(mr|mrs|ms|miss|dr|doctor|professor|president|captain) [a-z]+","article":"no article","rule_ref":"9.4.1","explanation":"People's names take no article, including a title used with the name, and family words like \u003cem>Mom\u003c/em> and \u003cem>Grandpa\u003c/em>.","examples":["This is Mr Brown.","Aunt Mary and Uncle David have invited us to lunch."]}],"categories":{"languages":{"article":"no article","rule_ref":"6.1.1","explanation":"Languages take no article: \u003cem>She speaks Japanese\u003c/em>, \u003cem>They're studying Spanish\u003c/em>.\u003cbr>\u003cbr>Note that the word \u003cem>language\u003c/em> itself is an ordinary noun: \u003cem>the language I speak at home\u003c/em>, \u003cem>a new language\u003c/em>.","unusual":"If the word is used in an unusual way it stops being an exception and the ordinary rules apply again: \u003cem>the French that they speak in Montreal\u003c/em>, \u003cem>a beautiful Spanish\u003c/em>, \u003cem>the football they play in the USA\u003c/em>.","words":["english","french","spanish","german","italian","portuguese","japanese","chinese","mandarin","cantonese","korean","arabic","russian","hindi","urdu","bengali","turkish","polish","dutch","swedish","norwegian","danish","finnish","greek","hebrew","thai","vietnamese","indonesian","swahili","latin","welsh","irish","catalan","basque","czech","hungarian","romanian","ukrainian","farsi","persian","tagalog","malay","punjabi","tamil","telugu","afrikaans","icelandic"]},"meals":{"article":"no article","rule_ref":"6.1.2","explanation":"Meals take no article: \u003cem>What shall we have for dinner?\u003c/em>, \u003cem>I didn't eat breakfast\u003c/em>.","unusual":"A special occasion, or an adjective before the meal, brings the article back: \u003cem>The lunch we had after the wedding\u003c/em>, \u003cem>There will be a dinner for her birthday\u003c/em>, \u003cem>an early supper\u003c/em>.","words":["breakfast","lunch","dinner","supper","tea","brunch"]},"sports":{"article":"no article","rule_ref":"6.1.3","explanation":"Sports and games take no article: \u003cem>I don't like golf\u003c/em>, \u003cem>He often plays tennis\u003c/em>, \u003cem>John loves playing rugby\u003c/em>.","unusual":"If the word is used in an unusual way it stops being an exception and the ordinary rules apply again: \u003cem>the football they play in America\u003c/em>, \u003cem>a game of tennis we still talk about\u003c/em>, \u003cem>the golf was better than the weather\u003c/em>.","words":["football","soccer","tennis","golf","judo","karate","baseball","basketball","rugby","cricket","hockey","volleyball","badminton","chess","boxing","swimming","athletics","gymnastics","skiing","surfing","cycling","running","yoga","netball","squash","polo","rowing","sailing","wrestling","fencing","darts","snooker","bowling","taekwondo","rounders","handball"]}},"time_words":{"unusual":"A time word used in an unusual way — a particular one you both know — takes \u003cem>the\u003c/em>: \u003cem>Do you remember the Monday we met?\u003c/em>, \u003cem>The June when we got married\u003c/em>. And \u003cem>a\u003c/em> with a day means \u003cem>any\u003c/em>: \u003cem>Could we meet on a Monday?\u003c/em>","groups":{"months":{"article":"no article","rule_ref":"6.2.1","explanation":"Months take no article. The tense of the sentence says which one you mean: \u003cem>I'll see you in December\u003c/em> (next), \u003cem>We met in December\u003c/em> (last).","words":["january","february","march","april","may","june","july","august","september","october","november","december"]},"days":{"article":"no article","rule_ref":"6.2.2","explanation":"Days of the week take no article: \u003cem>I'm meeting Julia on Monday\u003c/em>, \u003cem>She started work last Wednesday\u003c/em>. A plural day means \u003cem>every\u003c/em>: \u003cem>I work on Mondays and Tuesdays\u003c/em>.","words":["monday","tuesday","wednesday","thursday","friday","saturday","sunday","mondays","tuesdays","wednesdays","thursdays","fridays","saturdays","sundays"]},"holidays":{"article":"no article","rule_ref":"6.2.3","explanation":"Holidays and special days take no article: \u003cem>on Christmas Day\u003c/em>, \u003cem>during Ramadan\u003c/em>, \u003cem>at Halloween\u003c/em>.","words":["christmas","christmas day","christmas eve","easter","halloween","thanksgiving","ramadan","eid","diwali","hanukkah","passover","new years eve","new years day","mothers day","fathers day","valentines day","independence day","boxing day","bonfire night"]},"seasons":{"article":"either the or no article","rule_ref":"6.2.6","explanation":"Seasons take either \u003cem>the\u003c/em> or no article: \u003cem>She goes to Spain in summer\u003c/em>, \u003cem>I don't go to the park in the winter\u003c/em>, \u003cem>Autumn is my favorite season\u003c/em>.\u003cbr>\u003cbr>With \u003cem>fall\u003c/em> (US English) \u003cem>the\u003c/em> is the more common choice.","words":["spring","summer","autumn","winter","fall"]},"periods":{"article":"the","rule_ref":"6.2.7","explanation":"Historical periods take \u003cem>the\u003c/em>: \u003cem>during the Renaissance\u003c/em>, \u003cem>in the Middle Ages\u003c/em>.","words":["renaissance","middle ages","enlightenment","industrial revolution","reformation","victorian era","cold war","great depression","stone age","bronze age","iron age","dark ages","belle epoque","jazz age"]}},"patterns":{"year":{"regex":"^(1[0-9]{3}|20[0-9]{2})$","article":"no article","rule_ref":"6.2.7","explanation":"Years take no article: \u003cem>She was born in 1991\u003c/em>, \u003cem>This castle was built in 1672\u003c/em>."},"decade":{"regex":"^([0-9]{4}s|[0-9]{2}s|twenties|thirties|forties|fifties|sixties|seventies|eighties|nineties)$","article":"the","rule_ref":"6.2.7","explanation":"Decades take \u003cem>the\u003c/em>: \u003cem>The Beatles were popular in the 1960s\u003c/em>, \u003cem>I became interested in music in the eighties\u003c/em>."},"century":{"regex":"(^|\\s)(\\d{1,2}(st|nd|rd|th)|first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|tenth|eleventh|twelfth|thirteenth|fourteenth|fifteenth|sixteenth|seventeenth|eighteenth|nineteenth|twentieth|twenty.first)\\s+century$","article":"the","rule_ref":"6.2.7","explanation":"Centuries take \u003cem>the\u003c/em>: \u003cem>Shakespeare was born in the sixteenth century\u003c/em>."},"date_number_first":{"regex":"^\\d{1,2}(st|nd|rd|th)?\\s+of\\s+(january|february|march|april|may|june|july|august|september|october|november|december)$","article":"the","rule_ref":"6.2.4","explanation":"A date with the number first takes \u003cem>the\u003c/em> (most common in British English): \u003cem>We got married on the 22nd of September\u003c/em>."},"date_number_second":{"regex":"^(january|february|march|april|may|june|july|august|september|october|november|december)\\s+\\d{1,2}(st|nd|rd|th)?$","article":"no article","rule_ref":"6.2.4","explanation":"A date with the number second takes no article (most common in US English): \u003cem>She met him on November 16th\u003c/em>."},"day_part":{"regex":"^(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\\s+(morning|afternoon|evening|night)$","article":"no article","rule_ref":"6.2.5","explanation":"A part of the day takes no article when you name the day with it: \u003cem>On Wednesday night we went to the theater\u003c/em>, \u003cem>I met John on Friday morning\u003c/em>.\u003cbr>\u003cbr>On its own it is different: \u003cem>in the morning\u003c/em>, \u003cem>at night\u003c/em>."}}},"proper_noun_the":{"article":"the","rule_ref":"9.2.2","named":["alps","andes","himalayas","netherlands","philippines","bahamas","maldives","usa","uk","united states","united kingdom","emirates","nile","amazon","thames","danube","rhine","ganges","mediterranean","atlantic","pacific","arctic","antarctic","sahara","gobi","middle east","far east","hague","prado","louvre","ritz","kremlin","vatican","guardian"],"keywords":["river","sea","ocean","desert","gulf","canal","strait","channel","republic","kingdom","mountains","islands","museum","hotel","theater","theater","times","post"],"contains_of":true,"requires_capital":true,"explanation":"Plural names, \u003cem>of\u003c/em>-constructions, rivers, seas, oceans, deserts, mountain ranges, regions, hotels, museums, theaters and newspapers take \u003cem>the\u003c/em>. This is a closed list — learn it as one group.","matching_note":"A keyword only counts inside a capitalized name (\u003cem>the Nile River\u003c/em>, not \u003cem>a storm crossed the desert\u003c/em>), and an \u003cem>of\u003c/em>-construction needs a capitalized word on each side (\u003cem>the Republic of Ireland\u003c/em>, not \u003cem>a cup of coffee\u003c/em>)."},"nationality_the":{"article":"the","rule_ref":"3.6","requires_prev":["the"],"examples":["british","english","irish","spanish","welsh","french","dutch","chinese","japanese","portuguese","vietnamese","swiss","scottish","danish","finnish","polish"],"explanation":"Nationality adjectives ending in \u003cem>-ish\u003c/em>, \u003cem>-ch\u003c/em> or \u003cem>-ese\u003c/em> take \u003cem>the\u003c/em> when they mean the people of that country as a whole: \u003cem>the British\u003c/em>, \u003cem>the French\u003c/em>. The plural noun form takes no article: \u003cem>Germans\u003c/em>, \u003cem>Kenyans\u003c/em>."},"phonetics":{"rule_ref":"Appendix 1","note":"\u003cem>A\u003c/em> or \u003cem>an\u003c/em> is chosen by the sound the next word starts with, not by the letter.","vowel_letter_consonant_sound":{"prefixes":["uni","use","usu","eu","ubiq","utili","unan"],"words":["university","universe","user","useful","usual","european","euro","unit","union","unique","unicorn","uniform","one","once"],"article":"a","why":"Starts with a vowel letter but a consonant sound: \u003cem>a university\u003c/em>, \u003cem>a European\u003c/em>, \u003cem>a one-way street\u003c/em>."},"consonant_letter_vowel_sound":{"prefixes":["hour","honest","honour","honor","heir"],"words":["hour","hourly","honest","honesty","honour","honourable","honor","honorable","heir","heiress"],"article":"an","why":"A silent \u003cem>h\u003c/em> leaves a vowel sound: \u003cem>an hour\u003c/em>, \u003cem>an honest answer\u003c/em>."},"initialisms":{"vowel_sounding_letters":"AEFHILMNORSX","rule_ref":"7.6.1","why":"An initialism is read letter by letter, so the letter's own name decides: \u003cem>an MBA\u003c/em> (em), \u003cem>an FBI agent\u003c/em> (ef), \u003cem>a UFO\u003c/em> (you)."},"word_acronyms":{"words":["nasa","nato","unesco","unicef","opec","laser","radar","scuba"],"rule_ref":"7.6.2","why":"An acronym pronounced as a word follows the word's sound, not its letters: \u003cem>a NASA engineer\u003c/em>."}},"patterns":{"noun_number":{"regex":"^(page|platform|question|room|chapter|section|gate|flight|number|line|track|part|step|level|floor|unit|table|figure|exercise)\\s+([0-9]+|[a-z])$","article":"no article","rule_ref":"6.3","explanation":"When a noun is followed by a classifying number or letter — \u003cem>Page 42\u003c/em>, \u003cem>Platform 9\u003c/em>, \u003cem>Question B\u003c/em> — English uses no article. The number does the identifying that \u003cem>the\u003c/em> would otherwise do."},"noun_adjunct":{"rule_ref":"7.1","explanation":"In a noun-noun pair the first noun works like an adjective, so the article is decided entirely by the \u003cb>second\u003c/b> noun."}},"form_labels":{"the":{"word":"the","cls":"r-the"},"an":{"word":"a / an","cls":"r-an"},"zero":{"word":"— no article —","cls":"r-zero"},"blocked":{"word":"no article needed","cls":"r-fixed"},"context":{"word":"it depends","cls":"r-fixed"},"either":{"word":"the — or none","cls":"r-fixed"},"one":{"word":"one — not a/an","cls":"r-an"},"countable":{"word":"a / an — or none","cls":"r-an"}},"determiner_conflict":{"result":"context_required","explanation":"This noun has a fixed sense, but the article already in your sentence points at a different one. The fixed rule does not apply here.","determiner_forms":{"a":"a / an","an":"a / an","the":"the"}},"decision_tree":{"q2":{"short":"a proper noun?","gate":"Names","q":"Is it a proper noun — a name?","note":"A name picks out one particular person, place, day, language or brand — and it is written with a capital letter.","opts":[{"label":"Yes — a name","ex":"Sarah · Madrid · Everest · Monday · Spanish · Toyota","go":"q2a"},{"label":"No — a kind of thing","ex":"friend · city · mountain · day · language · car","go":"q3"}]},"q2a":{"short":"a name that takes the?","gate":"Which kind of name","q":"Is it a name that takes \u003cem>the\u003c/em>?","note":"Plural names, \u003cem>of\u003c/em>-constructions, water and landforms, regions, buildings and publications.","opts":[{"label":"Yes","ex":"the Netherlands · the Alps · the Nile · the Sahara · the Middle East · the Prado · the Guardian · the Republic of Ireland · the University of Cambridge · the Gulf of Mexico · the Tropic of Capricorn","go":"outPropThe"},{"label":"No","ex":"Madrid · Spain · Micah · Everest · Portuguese · President Sánchez","go":"outPropZero"}]},"outPropThe":{"out":"the","cat":"A name that takes the","rule_ref":"9.2.2","rule_name":"Names that take the","why":"Plural names, \u003cem>of\u003c/em>-constructions, rivers, seas, oceans, deserts, mountain ranges, regions, hotels, museums, theaters and newspapers take \u003cem>the\u003c/em>. This is a closed list — learn it as one."},"outPropZero":{"out":"zero","cat":"An ordinary name","rule_ref":"9.2.1","rule_name":"Names that take no article","why":"People, cities, single countries, single mountains, streets, continents, languages and companies take no article. Also titles used with a name: \u003cem>President Sánchez\u003c/em>, \u003cem>Doctor Ruiz\u003c/em> — but \u003cem>the president\u003c/em> on its own is a role noun and routes to 4g."},"q3":{"short":"whole class, or instances?","gate":"A whole class, or particular ones","q":"Am I talking about the whole class, or about particular instances?","note":"Test: can you insert \u003cem>in general\u003c/em> without changing the meaning? If yes, it's generic.","opts":[{"label":"The class as a whole — generic","ex":"Dogs, \u003cins>in general\u003c/ins>, are loyal. · Life, \u003cins>in general\u003c/ins>, is hard.","go":"q3a"},{"label":"Particular instances","ex":"I saw a dog. · The dog bit me.","go":"q4"}],"warn":"\u003cstrong>The most common mistake here\u003c/strong>, and an easy one if your own language uses \u003cem>the\u003c/em> for a whole class: \u003cem>La vida es dura\u003c/em> becomes \u003cem>Life is hard\u003c/em>, not \u003cem>the life\u003c/em>. When you're unsure at this question, the whole class with no article is the safer guess."},"q3a":{"short":"how is it behaving?","gate":"How the noun is behaving","q":"How is the noun behaving here?","note":"All three forms can be generic in English. This is the one place where \u003cem>the\u003c/em> and \u003cem>a\u003c/em> and zero are all live options for the same meaning.","opts":[{"label":"Plural countable","ex":"Dogs are loyal.","tag":"the usual choice","go":"outGenZeroPl"},{"label":"Non-count or abstract","ex":"Life is hard. · She studies economics.","go":"outGenZeroNc"},{"label":"Singular countable, any representative","ex":"A dog needs exercise.","go":"outGenA"},{"label":"Singular countable, the species","ex":"The dog is a social animal.","tag":"formal","go":"outGenThe"}]},"outGenZeroPl":{"out":"zero","cat":"A whole class, said in the plural","rule_ref":"3.1","why":"The default way to talk about a whole class in English. Reach for this first when the generic reading is what you want."},"outGenZeroNc":{"out":"zero","cat":"A whole class, said as an uncountable","rule_ref":"3.1","why":"Abstractions and mass nouns take no article in their generic sense: \u003cem>water, life, music, economics, happiness, advice\u003c/em>. This is the single biggest source of article errors for Romance-language speakers.\u003cbr>\u003cbr>One exception worth knowing: in formal or literary English you can put \u003cem>a/an\u003c/em> on an uncountable noun when you name a \u003cem>particular type\u003c/em> of it, almost always with an adjective — \u003cem>a profound sadness\u003c/em>, \u003cem>an excellent knowledge of history\u003c/em>."},"outGenA":{"out":"an","cat":"Any one of the class, standing for all","rule_ref":"3.3","why":"Picks out any arbitrary member to stand for the class. Slightly more formal than the plural, and it won't work with everything you might say — \u003cem>A dog is widespread\u003c/em> fails, because being widespread is true of the species and not of any individual."},"outGenThe":{"out":"the","cat":"The species as a whole","rule_ref":"3.4","why":"Names the class as a single entity. Formal and mostly scientific: \u003cem>The blue whale is endangered.\u003c/em> It does not work with everything you might say — \u003cem>The tiger is endangered\u003c/em> is fine, \u003cem>The tiger is everywhere\u003c/em> is not. Note this reading is only reachable from the question about whole classes."},"q4":{"short":"can the listener identify it?","gate":"Identifying which one","q":"Can my listener identify \u003cem>which one\u003c/em> I mean?","note":"Take the first option only if nothing below fits. Otherwise work down the list — the first match is your answer, and the labels just tell you why.","group":"Everything below answers \u003cem>the\u003c/em> — pick the first one that matches","style":"checklist","opts":[{"label":"The sentence itself specifies it","ex":"the book I lent you · the man in the corner · the capital of Spain","go":"out4a"},{"label":"There's a superlative, ordinal or uniqueness word","ex":"the best · the first · the only · the same · the next","go":"out4b"},{"label":"We've mentioned it already","ex":"I bought a car. The car was red.","go":"out4c"},{"label":"It's inferable from something we mentioned","ex":"I bought a car. The engine was noisy.","go":"out4d"},{"label":"There's only one in the world","ex":"the sun · the equator · the internet","go":"out4e"},{"label":"The place we're both in makes it obvious which one","ex":"Pass me the glass (the one on our table) · I went to the cafeteria (the one in our building) · apples at the market (the one in our town)","go":"out4f"},{"label":"It's an everyday place we all know","ex":"the gym · the park · the bank · the doctor's · the mall","go":"q4g"},{"label":"It's a role that belongs to something","ex":"the government · the president · the economy · the weather","go":"out4h"},{"label":"None of these — my listener can't tell which one","go":"q5","cls":"none"}]},"out4a":{"out":"the","cat":"Specified by the sentence itself","rule_ref":"2.4","why":"A relative clause, a prepositional phrase or an \u003cem>of\u003c/em>-phrase narrows the noun to one particular thing, so the sentence itself says which one.\u003cbr>\u003cbr>Careful: a modifier alone is not enough. It has to make clear \u003cem>which one\u003c/em> is meant. \u003cem>I met a woman who speaks Icelandic\u003c/em> keeps \u003cem>a\u003c/em>, because the clause describes her rather than picking out which woman is meant."},"out4b":{"out":"the","cat":"A superlative, ordinal or uniqueness word","rule_ref":"2.4.5","rule_name":"Superlatives, ordinals and uniqueness words","why":"\u003cem>Best, first, only, same, next, last, main\u003c/em> all entail that there's exactly one, so \u003cem>the\u003c/em> follows automatically."},"out4c":{"out":"the","cat":"Mentioned once already","rule_ref":"2.5","why":"The classic \u003cem>a\u003c/em> → \u003cem>the\u003c/em> switch. First mention introduces, second mention points back."},"out4d":{"out":"the","cat":"Inferable from what we mentioned","rule_ref":"2.6","why":"Part-whole and possession relations license this without any prior mention of the noun itself. A car has one engine, a room has one ceiling, so naming the whole makes the part identifiable."},"out4e":{"out":"the","cat":"The only one in the world","rule_ref":"2.3","why":"Shared world knowledge does the identifying. No context needed at all."},"out4f":{"out":"the","cat":"The place we are both in","rule_ref":"2.2","why":"The place we are both in does the identifying. With one glass on the table, \u003cem>pass me the glass\u003c/em> is clear — no other choice arises.\u003cbr>\u003cbr>The situation need not be the room. It can be the building, the town or the country: \u003cem>I went to the cafeteria\u003c/em> means the one in our building, and \u003cem>you can buy apples at the market\u003c/em> means the market in our town.\u003cbr>\u003cbr>Put more than one in view and \u003cem>which one?\u003c/em> comes back, so you are on \u003cem>a/an\u003c/em> again: \u003cem>please close the window\u003c/em> when one is open, \u003cem>please close a window\u003c/em> when three are."},"outActivityZero":{"out":"zero","cat":"An institutional activity, not a place","rule_ref":"7.3","why":"When the noun names the activity an institution exists for rather than its building, English drops the article: \u003cem>at school\u003c/em> (studying), \u003cem>in prison\u003c/em> (serving a sentence), \u003cem>in bed\u003c/em> (sleeping), \u003cem>at work\u003c/em> (working), \u003cem>in class\u003c/em>, \u003cem>at sea\u003c/em>, \u003cem>in court\u003c/em>.\u003cbr>\u003cbr>Put \u003cem>the\u003c/em> back the moment you mean the building instead: \u003cem>I parked at the school.\u003c/em>"},"q5":{"short":"countable, as used here?","gate":"Countable or not","q":"How am I using the noun here — countable or not?","note":"Ask about this use, not about the noun. \u003cem>Coffee\u003c/em> and \u003cem>a coffee\u003c/em>. \u003cem>Experience\u003c/em> and \u003cem>an experience\u003c/em>. \u003cem>Paper\u003c/em> and \u003cem>a paper\u003c/em>. Asking what kind of noun it is, rather than how it is used here, sends the words that work both ways down the wrong path and keeps them there.","opts":[{"label":"Singular countable","ex":"I saw a dog. · She's a teacher. · I need a pen.","go":"out5a"},{"label":"Plural countable","ex":"I bought books.","go":"out5zPl"},{"label":"Non-count","ex":"We need water.","go":"out5zNc"}]},"out5a":{"out":"an","cat":"One of many, singular","rule_ref":"2.1.2","why":"Countable, singular, and your listener can't yet tell which one. Covers first mention, non-specific \u003cem>any\u003c/em> uses, and classifying after \u003cem>be\u003c/em> — \u003cem>She is a doctor\u003c/em>."},"out5zPl":{"out":"zero","cat":"Some of many, plural","rule_ref":"2.1.2","why":"The plural counterpart of \u003cem>a\u003c/em>. English has no plural indefinite article, so the slot stays empty. Add \u003cem>some\u003c/em> if you need to signal quantity."},"out5zNc":{"out":"zero","cat":"An uncountable amount","rule_ref":"2.1.2","why":"Mass nouns take no article when indefinite. Add a quantifier if you need one: \u003cem>some water\u003c/em>, \u003cem>a lot of water\u003c/em>."},"out4h":{"out":"the","cat":"A role that belongs to something","rule_ref":"2.3","rule_name":"Roles that belong to something","why":"Role nouns are inherently \u003cem>of\u003c/em> something: government of a country, capital of a country, manager of a team. \u003cem>The\u003c/em> is allowed because the noun leaves a gap that the situation fills, and the gap can stay unspoken. \u003cem>What should the government do?\u003c/em> works between an American and a Spaniard discussing neither country, because it means \u003cem>the government of whatever situation we're discussing\u003c/em>. There is only one of it in the conversation, not only one of it in the world."},"q4g":{"short":"a place, or an activity?","gate":"A place, or an activity","q":"Does the noun name a place, or an institutional activity?","note":"This is where \u003cem>the mall\u003c/em> and \u003cem>at school\u003c/em> collide. Both are familiar community places, so it is easy to take the wrong one.","opts":[{"label":"A place","ex":"mall · beach · park · gym · bank · airport · library · store","go":"out4g"},{"label":"An institutional activity or state","ex":"school · church · class · prison · court · bed · work · sea","go":"outActivityZero"}],"warn":"Compare \u003cem>at school\u003c/em>, meaning studying, with \u003cem>at the school\u003c/em>, meaning standing in the building. The activity set is closed and somewhat arbitrary — \u003cem>I'm at school\u003c/em> is available but \u003cem>I'm at library\u003c/em> isn't."},"out4g":{"out":"the","cat":"An everyday place we all know","rule_ref":"4.1","rule_name":"The with everyday places","why":"Not a particular one — the kind of place itself. \u003cem>I like going to the cinema\u003c/em> is about cinema-going, not about a building. This is \u003cem>the\u003c/em> used for a whole category as a general idea — things everybody knows. It covers entertainment and recreation, and shops and other businesses.\u003cbr>\u003cbr>This does not contradict the question about whole classes. There are two ways to generalize: a plural or uncountable noun with no article (\u003cem>dogs\u003c/em>, \u003cem>life\u003c/em>), or \u003cem>the\u003c/em> with a singular noun for a whole category (\u003cem>the cinema\u003c/em>, \u003cem>the gym\u003c/em>).\u003cbr>\u003cbr>\u003cb>An intuition, not a rule:\u003c/b> these read like leftovers from when there really was one in town — one hospital, one post office, one mall — so \u003cem>the\u003c/em> was literal, and it stuck. The same instinct still works today: \u003cem>the market\u003c/em> means the market in our town.\u003cbr>\u003cbr>Careful: \u003cem>café\u003c/em> and \u003cem>restaurant\u003c/em> are not used like this. \u003cem>Let's go to the restaurant\u003c/em> can only mean a particular one."}},"traces":[{"p":"during the week"},{"p":"go to school"},{"p":"the Netherlands"},{"p":"Madrid","path":[0,1]},{"p":"Dogs are loyal","path":[1,0,0]},{"p":"Life is hard","path":[1,0,1]},{"p":"the book I lent you","path":[1,1,0]},{"p":"Pass me the glass","path":[1,1,5]},{"p":"the mall"},{"p":"the barber's","path":[1,1,6,0]},{"p":"at school"},{"p":"the government","path":[1,1,7]},{"p":"I need a pen","path":[1,1,8,0]},{"p":"We need water","path":[1,1,8,2]},{"p":"bus station"},{"p":"Page 42"},{"p":"the French"},{"p":"my book"},{"p":"each student"},{"p":"She speaks Arabic"},{"p":"rugby"},{"p":"brunch"},{"p":"in June"},{"p":"the 1960s"},{"p":"November 16th"},{"p":"in summer"},{"p":"next week"},{"p":"the next bus"},{"p":"second prize"},{"p":"Most people like chocolate"},{"p":"half an hour"},{"p":"the Smiths"},{"p":"There's a post office in my town"},{"p":"What a beautiful day"},{"p":"She was elected president"},{"p":"by train"},{"p":"on foot"},{"p":"in bed"},{"p":"at night"},{"p":"have lunch"},{"p":"in a hurry"},{"p":"by heart"},{"p":"once a week"},{"p":"at the moment"},{"p":"play the piano"},{"p":"on the other hand"},{"p":"side by side"},{"p":"in prison"},{"p":"take place"},{"p":"all of a sudden"},{"p":"by mistake"},{"p":"in the end"},{"p":"at first"},{"p":"in the morning"},{"p":"twice a month"},{"p":"a few"},{"p":"as a result"},{"p":"the cinema"},{"p":"the <script>
"use strict";

/* =========================================================

   Tkinter app. Gate 0 is matched here; the tree is walked.

var D = null, T = null, FORM = null;
var cur = null, hist = [], entry = "q2";
var pendingNote = null;
var pinned = null;
/* Why the answer is pinned to one word: because the reader tapped that word,
   or because they came through the two-readings card. Going back means
   something different in each case. */
var pinnedBy = null;
/* the word the readings list is showing, kept so a walk started from a
   reading has somewhere to go back to */
var readWord = null, readDisp = null;

var stage    = document.getElementById("stage");
var trail    = document.getElementById("trail");
var trailbox = document.getElementById("trailbox");
var phrase   = document.getElementById("phrase");
var mapEl    = document.getElementById("map");
var chipsEl  = document.getElementById("chips");
var focusEl  = document.getElementById("focusbar");
var backBtn  = document.getElementById("back");

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---------------- normalization (mirrors logic.py) ---------------- */

var PUNCT = /[!-\/:-@\[-`{-~]/g;

/* Punctuation goes, except an apostrophe between two letters. Part 4.2 is full
   of places spelled that way - the doctor's, the baker's - and stripping it
   turned the headword into `doctors` and cut the word off from its own entry. */
function stripPunct(s){
  return String(s)
    .replace(/([A-Za-z0-9])['’]([A-Za-z0-9])/g, "$1$2")
    .replace(PUNCT, "")
    .replace(//g, "'");
}

function normalize(s){
  var n = String(s == null ? "" : s).trim();
  n = n.replace(/^(?:the|an|a)\s+/i, "");
  n = stripPunct(n);
  n = n.replace(/\s+/g, " ").trim();
  return n.toLowerCase();
}

/* same trimming as normalize(), but keeps the user's capitalisation so
   proper nouns render as "the Nile" rather than "the nile" */
function displayWord(s){
  var n = String(s == null ? "" : s).trim();
  n = n.replace(/^(?:the|an|a)\s+/i, "");
  n = stripPunct(n);
  return n.replace(/\s+/g, " ").trim();
}

/* mirrors WORD_PATTERN in logic.py: the clitic stays attached, so `There's`
   is one token and can be told apart from a possessive */
function tokenize(s){
  var m = String(s == null ? "" : s).toLowerCase()
            .match(/[a-z0-9\u00c0-\u024f]+(?:['\u2019][a-z\u00c0-\u024f]+)?/g);
  return m || [];
}

/* word tokens with their original capitalisation kept */
function casedTokens(s){
  var m = String(s == null ? "" : s)
    .match(/[A-Za-z0-9\u00c0-\u024f]+(?:'[A-Za-z\u00c0-\u024f]+)?/g);
  return m || [];
}
function isCap(t){ return !!t && t[0] >= "A" && t[0] <= "Z"; }

/* a or an by sound, not spelling: the lists live in the JSON */
function chooseAOrAn(word){
  if(!word) return "a";
  var bare = String(word)
    .replace(/^[^A-Za-z0-9\u00c0-\u024f]+|[^A-Za-z0-9\u00c0-\u024f]+$/g, "");
  if(!bare) return "a";
  var low = bare.toLowerCase(), P = D.phonetics, i;

  if(P.word_acronyms.words.indexOf(low) !== -1){
    return "aeiou".indexOf(low.charAt(0)) !== -1 ? "an" : "a";
  }

  /* a leading run of capitals is read as letters: MBA, FBI, X-ray */
  var run = bare.match(/^[A-Z]+/);
  if(run){
    var rest = bare.slice(run[0].length);
    var nextIsLower = rest.length > 0 && rest[0] >= "a" && rest[0] <= "z";
    if(run[0].length > 1 || !nextIsLower){
      return P.initialisms.vowel_sounding_letters.indexOf(run[0].charAt(0)) !== -1 ? "an" : "a";
    }
  }

  var cs = P.vowel_letter_consonant_sound;
  if(cs.words.indexOf(low) !== -1) return cs.article;
  for(i = 0; i < cs.prefixes.length; i++){
    if(low.indexOf(cs.prefixes[i]) === 0) return cs.article;
  }

  var vs = P.consonant_letter_vowel_sound;
  if(vs.words.indexOf(low) !== -1) return vs.article;
  for(i = 0; i < vs.prefixes.length; i++){
    if(low.indexOf(vs.prefixes[i]) === 0) return vs.article;
  }

  return "aeiou".indexOf(low.charAt(0)) !== -1 ? "an" : "a";
}

/* ---- the sentence, with the targeted word marked and the rest clickable --- */

function renderFocusBar(text, hitResult){
  var raw = String(text || "").trim();
  var cands = focusCandidates(raw);

  var target = pinned ? normalize(pinned)
             : (hitResult ? String(hitResult.match || "") : inferFocus(raw));
  var targetWords = target ? target.split(" ") : [];

  /* The word Gate 0 matched is not always a candidate: in `I work for
     government` the verb filter drops `work`, but Gate 0 still answers about
     it, so the bar has to stay up or there is no way off that answer. */
  var alternatives = 0;
  for(var k = 0; k < cands.length; k++){
    if(targetWords.indexOf(cands[k].word) === -1) alternatives++;
  }

  /* Nothing to disambiguate unless some other word could have been the
     subject. A multi-word match like "Page 42" covers every candidate there
     is, so the bar would offer a choice it cannot honour. */
  if(!raw || !alternatives){ focusEl.classList.add("hidden"); return; }
  focusEl.classList.remove("hidden");

  var head = document.createElement("h2");
  head.textContent = pinned ? "Deciding about" : "Deciding about \u2014 tap another word to change";
  focusEl.appendChild(head);

  var line = document.createElement("p");
  line.className = "sentence";

  /* walk the original text so capitalisation and punctuation survive */
  var parts = raw.split(/(\s+)/), i, bare, isTarget, isCand;

  /* Where the match actually sits. Testing each word for membership lights up
     any repeat of it, so "in the morning" also lit the `the` in "the post
     office" earlier in the sentence. Find the run instead, and only fall back
     to membership when the words are not adjacent in the text. */
  var wordAt = [];
  for(var w = 0; w < parts.length; w++){
    if(!/^\s+$/.test(parts[w])) wordAt.push(w);
  }
  var on = {}, start, step, matched;
  for(start = 0; start + targetWords.length <= wordAt.length; start++){
    matched = true;
    for(step = 0; step < targetWords.length; step++){
      if(normalizeWord(parts[wordAt[start + step]]) !== targetWords[step]){ matched = false; break; }
    }
    if(matched){
      for(step = 0; step < targetWords.length; step++) on[wordAt[start + step]] = true;
      break;
    }
  }
  if(targetWords.length && !matched){
    for(step = 0; step < wordAt.length; step++){
      if(targetWords.indexOf(normalizeWord(parts[wordAt[step]])) !== -1) on[wordAt[step]] = true;
    }
  }

  function targetAt(n){ return !!on[n]; }

  var spanWords = 0;
  for(i = 0; i < parts.length; i++){
    if(/^\s+$/.test(parts[i])){ line.appendChild(document.createTextNode(parts[i])); continue; }
    bare = normalizeWord(parts[i]);
    isTarget = !!on[i];
    /* A second copy of the word already being decided about is not another
       choice - tapping "book" in "the book I lent you" when "book" is already
       the subject changes nothing - so it is text, not a button. */
    isCand = targetWords.indexOf(bare) === -1;
    if(isCand){
      isCand = false;
      for(var c = 0; c < cands.length; c++){ if(cands[c].word === bare) isCand = true; }
    }

    /* A match of more than one word is one thing, not several: "half an
       hour" and "Page 42" get a single highlight, not a box per word. */
    if(isTarget){
      var end = i, words = 1;
      while(targetAt(end + 2)){ end += 2; words++; }
      var run = document.createElement("span");
      run.className = "w on";
      run.textContent = parts.slice(i, end + 1).join("");
      line.appendChild(run);
      if(words > spanWords) spanWords = words;
      i = end;
      continue;
    }

    if(isCand){
      var b = document.createElement("button");
      b.type = "button";
      b.className = "w";
      b.textContent = parts[i];
      b.title = "Decide about \u201c" + bare + "\u201d instead";
      (function(word){
        b.addEventListener("click", function(){
          pinnedBy = "word";
          analyze(phrase.value, null, word);
          stage.scrollIntoView({block:"nearest", behavior:"smooth"});
        });
      })(cands.filter(function(x){ return x.word === bare; })[0].word);
      line.appendChild(b);
    }else{
      var span = document.createElement("span");
      span.className = "w";
      span.textContent = parts[i];
      line.appendChild(span);
    }
  }
  focusEl.appendChild(line);

  var hint = document.createElement("p");
  hint.className = "focushint";
  hint.textContent = targetWords.length
    ? ("Answering about the highlighted " + (spanWords > 1 ? "phrase" : "word") +
       ". The others are underlined \u2014 tap one to switch.")
    : "More than one noun here. Tap the one you are deciding about.";
  focusEl.appendChild(hint);
}

/* strip punctuation from one word, keeping the clitic */
function normalizeWord(w){
  return String(w).toLowerCase()
    .replace(/^[^a-z0-9\u00c0-\u024f]+|[^a-z0-9\u00c0-\u024f'\u2019]+$/g, "");
}

/* ---- which word is the learner asking about? (mirrors logic.py) ---- */

var NOT_A_FOCUS = ["a","an","the","this","that","these","those","my","your",
  "his","her","its","our","their","i","you","he","she","it","we","they","me",
  "him","us","them","and","or","but","if","so","because","at","in","on","to",
  "for","from","with","by","of","about","as","into","over","under","very",
  "really","always","never","not","there","here","then","than","when","where",
  "how","why","what","some","any","no","all","every","each","much","many",
  "more","most","few","little","lots","one","two","three","next","last",
  "first","second","other","same","own",
  /* time adverbs: `I went to the bank yesterday` is about the bank */
  "yesterday","today","tomorrow","tonight","soon","later","ago","again"];

/* mirrors _infer_focus_noun in logic.py: the noun after the first article,
   otherwise the last content word */
/* What closes a noun phrase: the sentence has moved on to a preposition, a
   conjunction, another clause, or a verb. */
var NP_END = ["and","or","but","if","so","because","at","in","on","to","for",
  "from","with","by","of","about","as","into","over","under","there","here",
  "then","than","when","where","how","why","that","which","who","whose",
  "i","you","he","she","it","we","they","me","him","us","them",
  /* the rest of the common prepositions: `a cinema near my house` is about
     the cinema, and the phrase ends where the preposition begins */
  "near","before","after","during","without","within","between","among",
  "against","through","across","behind","beside","around","above","below",
  "until","since","via","upon","off","out","up","down"];
var DETS = ["a","an","the"];
/* Another determiner opens another noun phrase, so it closes this one:
   `the radio every day` is about the radio, not the day. */
var NEW_PHRASE = ["every","each","some","any","all","no","this","that","these",
  "those","my","your","his","her","its","our","their"];

/* The head of the noun phrase opening at `start`: its last candidate word.
   `the tallest mountain` is about the mountain, not the tallest, and the
   modifiers in between are often not candidates at all - `a very long book`
   was answering about `very`. */
/* `beautifully` and `badly` are not what a sentence is about. Only a
   preference, so a real noun that ends in -ly - family, supply, reply - is
   still picked when it is the only thing there. */
function looksAdverbial(word){ return /ly$/.test(word); }

function npHead(toks, start, isCandidate){
  var j = start, run = [], r;
  while(j < toks.length && NP_END.indexOf(toks[j]) === -1 &&
        DETS.indexOf(toks[j]) === -1 && NEW_PHRASE.indexOf(toks[j]) === -1 &&
        VERB_HINTS.indexOf(toks[j]) === -1){
    run.push(toks[j]);
    j++;
  }
  /* A word sitting between this phrase and the determiner opening the next
     one is the verb that joins them, whatever else it can be: `The car hit
     the car` is about the car, not about the hit. */
  if(run.length > 1 && j < toks.length && DETS.indexOf(toks[j]) !== -1) run.pop();
  for(r = run.length - 1; r >= 0; r--){
    if(isCandidate[run[r]] && !looksAdverbial(run[r])) return run[r];
  }
  for(r = run.length - 1; r >= 0; r--){
    if(isCandidate[run[r]]) return run[r];
  }
  return "";
}

function inferFocus(text){
  var toks = tokenize(text), i;
  var cands = focusCandidates(text), isCandidate = {}, head;
  for(i = 0; i < cands.length; i++) isCandidate[cands[i].word] = 1;

  for(i = 0; i < toks.length - 1; i++){
    if(DETS.indexOf(toks[i]) === -1) continue;
    head = npHead(toks, i + 1, isCandidate);
    if(head) return head;
  }
  if(!cands.length) return "";

  /* `Dogs are loyal` ends in an adjective, so the last content word is the
     wrong guess. After a copula with no determiner behind it the tail is a
     predicate adjective, and the subject in front is what the sentence is
     about. A determiner there means a predicate noun - `is a teacher` - and
     the scan above has already returned it. */
  for(i = 0; i < toks.length; i++){
    if(BE_FORMS.indexOf(toks[i]) === -1) continue;
    for(var c = cands.length - 1; c >= 0; c--){
      if(cands[c].index < i) return cands[c].word;
    }
    break;
  }
  for(i = cands.length - 1; i >= 0; i--){
    if(!looksAdverbial(cands[i].word)) return cands[i].word;
  }
  return cands[cands.length - 1].word;
}

var BE_FORMS = ["is","are","was","were","am","be","been","being"];

/* Does the data have a rule for this word as a noun? `work` is on the verb
   list and is also a lookup entry, so a word the tool can actually answer
   about must not be filtered out as a verb. */
function isKnownNoun(t){
  if(Object.prototype.hasOwnProperty.call(D.lookup_table, t)) return true;
  var name;
  for(name in D.categories){
    if(Object.prototype.hasOwnProperty.call(D.categories, name) &&
       D.categories[name].words.indexOf(t) !== -1) return true;
  }
  for(name in D.time_words.groups){
    if(Object.prototype.hasOwnProperty.call(D.time_words.groups, name) &&
       D.time_words.groups[name].words.indexOf(t) !== -1) return true;
  }
  return false;
}

/* A pronoun that can head a clause. The word straight after one of these is
   that pronoun's verb, whatever else the word can be, which is the one verb
   test a word list cannot do: `work`, `play` and `book` are all real nouns
   with real rules, so `I work`, `did you book a table` and `the book I lent
   you` can only be settled by where the word sits. */
var SUBJECT_PRONOUNS = ["i","you","he","she","it","we","they"];

function focusCandidates(text){
  var seen = {}, out = [], toks = tokenize(text), i, t;
  for(i = 0; i < toks.length; i++){
    t = toks[i];
    if(NOT_A_FOCUS.indexOf(t) !== -1) continue;
    if(i > 0 && SUBJECT_PRONOUNS.indexOf(toks[i - 1]) !== -1) continue;
    if(VERB_HINTS.indexOf(t) !== -1 && !isKnownNoun(t)) continue;
    /* Same positional test, from the other side: a word between one noun
       phrase and the determiner opening the next is that phrase's verb. */
    if(i > 0 && i + 1 < toks.length && DETS.indexOf(toks[i + 1]) !== -1 &&
       Object.prototype.hasOwnProperty.call(seen, toks[i - 1])) continue;
    if(t.length < 2) continue;
    if(Object.prototype.hasOwnProperty.call(seen, t)) continue;
    seen[t] = 1;
    out.push({word:t, index:i});
  }
  return out;
}

/* longest n-gram in tokens that exists as a key of map */
function longestPhrase(tokens, map){
  var max = Math.min(tokens.length, 5), n, i, key;
  for(n = max; n >= 1; n--){
    for(i = 0; i + n <= tokens.length; i++){
      key = tokens.slice(i, i + n).join(" ");
      if(Object.prototype.hasOwnProperty.call(map, key)) return key;
    }
  }
  return null;
}

/* article string -> form key */
function formOf(article){
  var a = String(article).toLowerCase();
  if(a.indexOf("either") === 0) return "either";
  if(a === "one") return "one";
  if(a.indexOf("a / an with") === 0) return "countable";
  if(a.indexOf("the") === 0) return "the";
  if(a.indexOf("a /") === 0 || a.indexOf("a/") === 0 || a.indexOf("an") === 0) return "an";
  return "zero";
}

/* ---------------- Gate 0 ---------------- */

function gate0(text){
  var norm = normalize(text);
  var tokens = tokenize(text);
  if(!norm && !tokens.length) return null;
  var key, e;

  /* 0. constructions whose match covers the whole input. First, because
        `last summer` is Part 7.11 and not a season. */
  var whole = checkConstructions(text, tokens, true);
  if(whole) return whole;

  /* 0.5 the article slot may already be taken: my book, this book, each student.
        That is not a zero-article answer - no article can go there at all. */
  var det = checkDeterminer(text, tokens);
  if(det) return det;

  /* 1. fixed expressions win over everything */
  key = longestPhrase(tokens, D.fixed_expressions) ||
        (D.fixed_expressions[norm] ? norm : null);
  if(key){
    e = D.fixed_expressions[key];
    return {form:formOf(e.article), why:e.explanation, ref:e.rule_ref,
            cat:"Fixed expression", match:key, fixed:true};
  }

  /* 2. noun + classifying number or letter */
  var np = D.patterns.noun_number;
  if(new RegExp(np.regex, "i").test(norm)){
    return {form:formOf(np.article), why:np.explanation, ref:np.rule_ref,
            cat:"Noun with a classifying number", match:norm};
  }

  /* 3. the lookup table, direct then longest phrase - subject to conditions */
  key = Object.prototype.hasOwnProperty.call(D.lookup_table, norm) ? norm
      : longestPhrase(tokens, D.lookup_table);
  if(key){
    return lookupResult(key, tokens);
  }

  /* 3.5 time words: months, days, holidays, seasons, periods, dates, years */
  var timeHit = checkTimeWords(norm, tokens);
  if(timeHit) return timeHit;

  /* 4. nationality adjective for a whole people. This is the "the + adjective"
        construction, so it needs the article in front - without it, `Spanish`
        is a language, not a people. */
  var nat = D.nationality_the;
  if(nat.examples.indexOf(norm) !== -1){
    var natSpan = spanOf(tokens, norm);
    var need = nat.requires_prev;
    var okPrev = !need || (natSpan[1] !== null && natSpan[0] > 0 &&
