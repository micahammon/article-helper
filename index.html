<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Articles: a / an / the / zero</title>
<style>
:root{
  --paper:#EDF0F2;
  --card:#FAFBFB;
  --ink:#16232B;
  --muted:#5A6E78;
  --rule:#C7D0D5;
  --the:#1F5C7A;
  --the-wash:#E2ECF1;
  --an:#6B3F87;
  --an-wash:#EDE5F2;
  --zero:#2F6B4F;
  --zero-wash:#E1EDE7;
  --fixed:#7A5C10;
  --fixed-wash:#F2EBD8;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:0 auto;padding:32px 24px 80px}

/* ---------- masthead ---------- */
.masthead{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:24px;flex-wrap:wrap;
  border-bottom:2px solid var(--ink);
  padding-bottom:14px;margin-bottom:28px;
}
.masthead h1{
  font-family:var(--serif);
  font-size:30px;font-weight:400;letter-spacing:-.01em;
  margin:0;
}
.masthead h1 .slash{color:var(--muted);padding:0 2px}
.modes{display:flex;gap:2px;background:var(--rule);padding:2px;border-radius:2px}
.modes button{
  font-family:var(--sans);font-size:13px;
  border:0;background:transparent;color:var(--muted);
  padding:6px 14px;cursor:pointer;border-radius:1px;
}
.modes button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:600}
.modes button:focus-visible{outline:2px solid var(--the);outline-offset:1px}

/* ---------- phrase bar ---------- */
.phrasebar{margin-bottom:24px}
.phrasebar label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.phrasebar input{
  width:100%;font-family:var(--serif);font-size:19px;
  padding:10px 12px;border:1px solid var(--rule);border-radius:2px;
  background:var(--card);color:var(--ink);
}
.phrasebar input:focus{outline:2px solid var(--the);outline-offset:-1px;border-color:var(--the)}

/* ---------- question card ---------- */
.qcard{
  background:var(--card);
  border:1px solid var(--rule);
  border-left:4px solid var(--ink);
  border-radius:2px;
  padding:24px 26px;
}
.gate{font-size:13px;color:var(--muted);margin-bottom:10px}
.qtext{
  font-family:var(--serif);
  font-size:25px;line-height:1.3;font-weight:400;
  margin:0 0 10px;max-width:34em;
}
.qnote{font-size:14px;color:var(--muted);margin:0 0 20px;max-width:46em}
.qnote em{font-family:var(--serif);font-style:italic;font-size:15px;color:var(--ink)}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:block;width:100%;text-align:left;
  font-family:var(--sans);font-size:15px;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:12px 14px;cursor:pointer;
  transition:border-color .12s,background .12s;
}
.opt:hover{border-color:var(--ink);background:var(--card)}
.opt:focus-visible{outline:2px solid var(--the);outline-offset:1px}
.opt .ex{display:block;font-family:var(--serif);font-style:italic;font-size:15px;color:var(--muted);margin-top:4px}
.opt .tag{float:right;font-size:12px;color:var(--muted);margin-left:12px}

/* checklist style for the identifiability gate */
.checklist .opt{border-left:3px solid var(--the)}
.checklist .opt.none{border-left:3px solid var(--rule);margin-top:6px}

.warn{
  background:var(--fixed-wash);
  border:1px solid #DBCB9A;border-radius:2px;
  padding:12px 14px;font-size:14px;margin:16px 0 0;
}
.warn strong{font-weight:600}
.warn em{font-family:var(--serif);font-size:15px}

/* ---------- result ---------- */
.result{border-radius:2px;padding:26px;border:1px solid var(--rule)}
.result .form{
  font-family:var(--serif);font-size:52px;line-height:1;font-weight:400;
  margin:0 0 6px;letter-spacing:-.02em;
}
.result .cat{font-size:14px;margin:0 0 18px;font-weight:600}
.result .why{font-size:15px;max-width:44em;margin:0 0 16px}
.result .why em{font-family:var(--serif);font-size:16px}
.result .built{
  font-family:var(--serif);font-size:24px;
  padding:14px 0 0;border-top:1px solid rgba(0,0,0,.13);margin-top:6px;
}
.result ul{margin:10px 0 0;padding-left:20px}
.result li{font-family:var(--serif);font-size:16px;margin-bottom:3px}
.r-the{background:var(--the-wash);border-color:#B4CEDC}
.r-the .form,.r-the .cat{color:var(--the)}
.r-an{background:var(--an-wash);border-color:#CDB8D9}
.r-an .form,.r-an .cat{color:var(--an)}
.r-zero{background:var(--zero-wash);border-color:#B2CFC0}
.r-zero .form,.r-zero .cat{color:var(--zero)}
.r-fixed{background:var(--fixed-wash);border-color:#DBCB9A}
.r-fixed .form,.r-fixed .cat{color:var(--fixed)}

/* ---------- trail ---------- */
.trail{margin-top:26px;border-top:1px solid var(--rule);padding-top:16px}
.trail h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 10px}
.trail ol{margin:0;padding:0;list-style:none;counter-reset:step}
.trail li{
  counter-increment:step;font-size:14px;padding:5px 0 5px 30px;position:relative;
  border-bottom:1px solid var(--rule);
}
.trail li:last-child{border-bottom:0}
.trail li::before{
  content:counter(step);position:absolute;left:0;top:5px;
  width:20px;height:20px;border-radius:50%;background:var(--rule);color:var(--ink);
  font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:600;
}
.trail .q{color:var(--muted)}
.trail .a{color:var(--ink);font-weight:600}

.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
.btn{
  font-family:var(--sans);font-size:14px;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  padding:9px 16px;border-radius:2px;cursor:pointer;
}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--the);outline-offset:1px}
.btn.ghost{border-color:var(--rule);color:var(--muted)}
.btn.ghost:hover{background:var(--rule);color:var(--ink)}

/* ---------- traces ---------- */
.traces{margin-top:34px;border-top:1px solid var(--rule);padding-top:18px}
.traces h2{font-size:13px;color:var(--muted);font-weight:600;margin:0 0 12px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-family:var(--serif);font-size:15px;font-style:italic;
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  padding:6px 11px;cursor:pointer;color:var(--ink);
}
.chip:hover{border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--the);outline-offset:1px}

/* ---------- map ---------- */
.map .mgate{margin-bottom:26px;background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ink);border-radius:2px;padding:18px 22px}
.map h3{font-family:var(--serif);font-weight:400;font-size:21px;margin:0 0 4px}
.map .mq{font-size:14px;color:var(--muted);margin:0 0 14px}
.map .row{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--rule);font-size:14px;align-items:flex-start}
.map .row .lead{flex:1 1 auto}
.map .row .ex{font-family:var(--serif);font-style:italic;color:var(--muted);display:block;margin-top:2px}
.pill{
  flex:0 0 auto;font-size:12px;font-weight:600;padding:3px 9px;border-radius:2px;white-space:nowrap;
}
.p-the{background:var(--the-wash);color:var(--the)}
.p-an{background:var(--an-wash);color:var(--an)}
.p-zero{background:var(--zero-wash);color:var(--zero)}
.p-fixed{background:var(--fixed-wash);color:var(--fixed)}
.p-next{background:var(--rule);color:var(--ink)}
.hidden{display:none}
.foot{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:14px}
@media (max-width:560px){
  .wrap{padding:22px 16px 60px}
  .masthead h1{font-size:24px}
  .qtext{font-size:21px}
  .result .form{font-size:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- gate 0 ---------- */
.phrasebar .row{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}
.phrasebar .row input{flex:1 1 240px}
.gate0{
  display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;padding:3px 8px;border-radius:2px;
  background:var(--rule);color:var(--ink);margin-bottom:10px;
}
.g-hit{background:var(--fixed-wash);color:var(--fixed)}
.g-miss{background:var(--rule);color:var(--muted)}
.ref{
  display:inline-block;font-size:12px;color:var(--muted);
  border:1px solid var(--rule);border-radius:2px;padding:2px 7px;margin-top:14px;
}
.note-card{
  background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--fixed);
  border-radius:2px;padding:14px 18px;margin-bottom:18px;font-size:14px;
}
.note-card b{font-weight:600}
.err{
  background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--an);
  border-radius:2px;padding:18px 22px;font-size:14px;
}
.reflist{columns:2;column-gap:26px;margin:10px 0 0;padding:0;list-style:none}
.reflist li{
  font-family:var(--serif);font-style:italic;font-size:14px;
  break-inside:avoid;padding:2px 0;color:var(--ink);
}
.refgroup{margin-bottom:18px}
.refgroup h4{margin:0;font-size:13px;font-weight:600;color:var(--muted);
  display:flex;align-items:center;gap:8px}
.senses{margin-top:16px;border-top:1px solid var(--rule)}
.senses .sense{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule);
  align-items:flex-start;font-size:14px}
.senses .sense:last-child{border-bottom:0}
.senses .lead{flex:1 1 auto}
.senses .lead b{font-weight:600}
.senses .ex{font-family:var(--serif);font-style:italic;color:var(--muted);
  display:block;margin-top:3px}
@media (max-width:560px){ .reflist{columns:1} }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <h1>a <span class="slash">/</span> an <span class="slash">/</span> the <span class="slash">/</span> zero</h1>
    <div class="modes" role="group" aria-label="View">
      <button id="m-walk" aria-pressed="true">Walk the tree</button>
      <button id="m-map" aria-pressed="false">See the whole map</button>
    </div>
  </div>

  <!-- ============ WALK ============ -->
  <div id="walk">
    <div class="phrasebar">
      <label for="phrase">Noun or phrase you're deciding about</label>
      <div class="row">
        <input id="phrase" type="text" placeholder="government" autocomplete="off">
        <button class="btn" id="check">Check</button>
      </div>
    </div>

    <div id="stage" aria-live="polite"></div>

    <div class="trail hidden" id="trailbox">
      <h2>Your path</h2>
      <ol id="trail"></ol>
    </div>

    <div class="actions">
      <button class="btn ghost" id="back">Go back a step</button>
      <button class="btn ghost" id="restart">Start over</button>
    </div>

    <div class="traces">
      <h2>Or watch one of these route itself</h2>
      <div class="chips" id="chips"></div>
    </div>
  </div>

  <!-- ============ MAP ============ -->
  <div id="map" class="map hidden"></div>

  <p class="foot">Fixed expressions and known names are matched automatically. Everything else answers the first question that matches and stops as soon as it reaches a form.</p>
</div>

<script>
"use strict";

/* =========================================================
   All content lives in rules_data.json, shared with the
   Tkinter app. Gate 0 is matched here; the tree is walked.
   ========================================================= */

var D = null, T = null, FORM = null;
var cur = null, hist = [], entry = "q2";
var pendingNote = null;

var stage    = document.getElementById("stage");
var trail    = document.getElementById("trail");
var trailbox = document.getElementById("trailbox");
var phrase   = document.getElementById("phrase");
var mapEl    = document.getElementById("map");
var chipsEl  = document.getElementById("chips");

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

/* ---------------- normalization (mirrors logic.py) ---------------- */

var PUNCT = /[!-\/:-@\[-`{-~]/g;

function stripPunct(s){ return String(s).replace(PUNCT, ""); }

function normalize(s){
  var n = String(s == null ? "" : s).trim();
  n = n.replace(/^(?:the|an|a)\s+/i, "");
  n = stripPunct(n);
  n = n.replace(/\s+/g, " ").trim();
  return n.toLowerCase();
}

/* same trimming as normalize(), but keeps the user's capitalisation so
   proper nouns render as "the Nile" rather than "the nile" */
function displayWord(s){
  var n = String(s == null ? "" : s).trim();
  n = n.replace(/^(?:the|an|a)\s+/i, "");
  n = stripPunct(n);
  return n.replace(/\s+/g, " ").trim();
}

function tokenize(s){
  var t = stripPunct(String(s == null ? "" : s).toLowerCase());
  t = t.replace(/\s+/g, " ").trim();
  return t ? t.split(" ") : [];
}

/* word tokens with their original capitalisation kept */
function casedTokens(s){
  var m = String(s == null ? "" : s).match(/[A-Za-z0-9]+(?:'[A-Za-z]+)?/g);
  return m || [];
}
function isCap(t){ return !!t && t[0] >= "A" && t[0] <= "Z"; }

/* a or an by sound, not spelling: the lists live in the JSON */
function chooseAOrAn(word){
  if(!word) return "a";
  var bare = String(word).replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g, "");
  if(!bare) return "a";
  var low = bare.toLowerCase(), P = D.phonetics, i;

  if(P.word_acronyms.words.indexOf(low) !== -1){
    return "aeiou".indexOf(low.charAt(0)) !== -1 ? "an" : "a";
  }

  /* a leading run of capitals is read as letters: MBA, FBI, X-ray */
  var run = bare.match(/^[A-Z]+/);
  if(run){
    var rest = bare.slice(run[0].length);
    var nextIsLower = rest.length > 0 && rest[0] >= "a" && rest[0] <= "z";
    if(run[0].length > 1 || !nextIsLower){
      return P.initialisms.vowel_sounding_letters.indexOf(run[0].charAt(0)) !== -1 ? "an" : "a";
    }
  }

  var cs = P.vowel_letter_consonant_sound;
  if(cs.words.indexOf(low) !== -1) return cs.article;
  for(i = 0; i < cs.prefixes.length; i++){
    if(low.indexOf(cs.prefixes[i]) === 0) return cs.article;
  }

  var vs = P.consonant_letter_vowel_sound;
  if(vs.words.indexOf(low) !== -1) return vs.article;
  for(i = 0; i < vs.prefixes.length; i++){
    if(low.indexOf(vs.prefixes[i]) === 0) return vs.article;
  }

  return "aeiou".indexOf(low.charAt(0)) !== -1 ? "an" : "a";
}

/* longest n-gram in tokens that exists as a key of map */
function longestPhrase(tokens, map){
  var max = Math.min(tokens.length, 5), n, i, key;
  for(n = max; n >= 1; n--){
    for(i = 0; i + n <= tokens.length; i++){
      key = tokens.slice(i, i + n).join(" ");
      if(Object.prototype.hasOwnProperty.call(map, key)) return key;
    }
  }
  return null;
}

/* article string -> form key */
function formOf(article){
  var a = String(article).toLowerCase();
  if(a.indexOf("the") === 0) return "the";
  if(a.indexOf("a /") === 0 || a.indexOf("a/") === 0 || a.indexOf("an") === 0) return "an";
  return "zero";
}

/* ---------------- Gate 0 ---------------- */

function gate0(text){
  var norm = normalize(text);
  var tokens = tokenize(text);
  if(!norm && !tokens.length) return null;
  var key, e;

  /* 0. the article slot may already be taken: my book, this book, each student.
        That is not a zero-article answer - no article can go there at all. */
  var det = checkDeterminer(text, tokens);
  if(det) return det;

  /* 1. fixed expressions win over everything */
  key = longestPhrase(tokens, D.fixed_expressions) ||
        (D.fixed_expressions[norm] ? norm : null);
  if(key){
    e = D.fixed_expressions[key];
    return {form:formOf(e.article), why:e.explanation, ref:e.rule_ref,
            cat:"Gate 0 \u00b7 fixed expression", match:key, fixed:true};
  }

  /* 2. noun + classifying number or letter */
  var np = D.patterns.noun_number;
  if(new RegExp(np.regex, "i").test(norm)){
    return {form:formOf(np.article), why:np.explanation, ref:np.rule_ref,
            cat:"Gate 0 \u00b7 noun with a classifying number", match:norm};
  }

  /* 3. the lookup table, direct then longest phrase - subject to conditions */
  key = Object.prototype.hasOwnProperty.call(D.lookup_table, norm) ? norm
      : longestPhrase(tokens, D.lookup_table);
  if(key){
    return lookupResult(key, tokens);
  }

  /* 4. nationality adjective for a whole people */
  var nat = D.nationality_the;
  if(nat.examples.indexOf(norm) !== -1){
    return {form:formOf(nat.article), why:nat.explanation, ref:nat.rule_ref,
            cat:"Gate 0 \u00b7 nationality adjective", match:norm};
  }

  /* 5. names in the the-taking class */
  if(isTheTakingName(text, norm)){
    var pn = D.proper_noun_the;
    return {form:formOf(pn.article), why:pn.explanation, ref:pn.rule_ref,
            cat:"Gate 0 \u00b7 name in the the-taking class", match:norm};
  }

  return null;
}

/* ---- the lookup table, but only where the fixed sense actually holds ---- */

var LOOKBACK_BOUNDARY = ["on","in","at","to","by","for","of","with","from","into",
  "onto","about","over","under","and","or","but","that","who","which","than"];
var LOOKBACK_LIMIT = 4;

function spanOf(tokens, phrase){
  var parts = phrase.split(" "), i, j, ok;
  for(i = 0; i + parts.length <= tokens.length; i++){
    ok = true;
    for(j = 0; j < parts.length; j++){
      if(tokens[i + j] !== parts[j]){ ok = false; break; }
    }
    if(ok) return [i, i + parts.length];
  }
  return [0, null];
}

/* the determiner governing a noun, looking past any adjectives between them */
function determinerBefore(tokens, start, words){
  var i = start - 1, steps = 0, t;
  while(i >= 0 && steps < LOOKBACK_LIMIT){
    t = tokens[i];
    if(words.indexOf(t) !== -1) return t;
    if(LOOKBACK_BOUNDARY.indexOf(t) !== -1) return null;
    i--; steps++;
  }
  return null;
}

function lookupResult(key, tokens){
  var e = D.lookup_table[key];
  var cond = e.conditions || null;
  var span = spanOf(tokens, key);
  var start = span[0], end = span[1];
  var following = (end !== null && end < tokens.length) ? tokens[end] : null;
  var forms = D.determiner_conflict.determiner_forms;

  function deferred(reason, why){
    return {form:"context", context:true, reason:reason, why:why,
            ref:(cond && cond.contrast_rule_ref) || e.rule_ref,
            cat:"Gate 0 \u00b7 depends on the sentence", match:key,
            fixed:null,
            fixedSense:{article:e.article, why:e.explanation, ref:e.rule_ref},
            sense:cond ? cond.sense : null,
            examples:(cond && cond.examples) || []};
  }

  /* 1. a determiner already in front of the noun */
  var words = Object.keys(forms), g;
  for(g in D.determiners.groups){
    if(Object.prototype.hasOwnProperty.call(D.determiners.groups, g)){
      words = words.concat(D.determiners.groups[g]);
    }
  }
  var governing = determinerBefore(tokens, start, words);
  if(governing){
    for(g in D.determiners.groups){
      if(!Object.prototype.hasOwnProperty.call(D.determiners.groups, g)) continue;
      if(D.determiners.groups[g].indexOf(governing) !== -1){
        return {form:"blocked", blocked:true, why:D.determiners.explanation,
                ref:(g === "some_any" ? D.determiners.some_any_rule_ref : D.determiners.rule_ref),
                cat:"Gate 0 \u00b7 the slot is already taken", match:key};
      }
    }
    if(forms[governing] && forms[governing] !== e.article){
      return deferred("determiner_conflict", D.determiner_conflict.explanation);
    }
  }

  /* 2. the entry's own conditions */
  if(cond){
    var prev = start > 0 ? tokens[start - 1] : null;
    if(cond.requires_prev && cond.requires_prev.indexOf(prev) === -1){
      return deferred("missing_required_word", cond.contrast);
    }
    if(cond.blocked_by_next && cond.blocked_by_next.indexOf(following) !== -1){
      return deferred("blocked_by_following_word", cond.contrast);
    }
    if(cond.requires_any){
      var found = false, i;
      for(i = 0; i < cond.requires_any.length; i++){
        if(tokens.indexOf(cond.requires_any[i]) !== -1){ found = true; break; }
      }
      if(!found) return deferred("missing_required_word", cond.contrast);
    }
  }

  return {form:formOf(e.article), why:e.explanation, ref:e.rule_ref,
          cat:"Gate 0 \u00b7 listed noun", match:key, note:e.note || null};
}

/* The article slot is already filled. */
function checkDeterminer(text, tokens){
  if(!tokens.length) return null;
  var det = D.determiners, first = tokens[0], group, words;

  for(group in det.groups){
    if(!Object.prototype.hasOwnProperty.call(det.groups, group)) continue;
    words = det.groups[group];
    if(words.indexOf(first) !== -1){
      return {form:"blocked", why:det.explanation, blocked:true,
              ref:(group === "some_any" ? det.some_any_rule_ref : det.rule_ref),
              cat:"Gate 0 \u00b7 the slot is already taken",
              match:tokens.slice(1).join(" ") || first};
    }
  }

  /* a possessive 's fills the same slot: Sarah's car */
  if(/^\s*\S+['\u2019]s\s+\S+/.test(String(text || ""))){
    return {form:"blocked", why:det.explanation, blocked:true, ref:det.rule_ref,
            cat:"Gate 0 \u00b7 the slot is already taken",
            match:tokens.slice(1).join(" ") || tokens[0]};
  }
  return null;
}

/* A the-taking name, checked conservatively: a keyword only counts inside a
   capitalised name, and an of-construction needs a capital on each side. */
function isTheTakingName(text, norm){
  var pn = D.proper_noun_the;
  if(pn.named.indexOf(norm) !== -1) return true;

  var cased = casedTokens(text), i, j, t, neighbours;
  var lowered = cased.map(function(x){ return x.toLowerCase(); });

  for(i = 0; i < lowered.length; i++){
    if(pn.named.indexOf(lowered[i]) !== -1 && isCap(cased[i])) return true;
  }

  for(i = 0; i < lowered.length; i++){
    t = lowered[i];
    if(pn.keywords.indexOf(t) === -1 || !isCap(cased[i])) continue;
    neighbours = [];
    if(i > 0) neighbours.push(cased[i - 1]);
    if(i + 1 < cased.length) neighbours.push(cased[i + 1]);
    for(j = 0; j < neighbours.length; j++){
      if(isCap(neighbours[j])) return true;
    }
  }

  if(pn.contains_of){
    for(i = 1; i + 1 < cased.length; i++){
      if(lowered[i] === "of" && isCap(cased[i - 1]) && isCap(cased[i + 1])) return true;
    }
  }
  return false;
}

/* ---------------- entry point ---------------- */

function analyze(text, scriptedPath){
  hist = [];
  pendingNote = null;
  cur = entry;

  var hitResult = gate0(text);
  if(hitResult){ renderGate0(hitResult); return true; }

  /* noun adjunct: two bare nouns, nothing matched -> the second noun decides */
  var tokens = tokenize(normalize(text));
  if(tokens.length === 2){
    var second = tokens[1];
    var secondHit = gate0(second);
    if(secondHit){
      secondHit.adjunct = tokens[0];
      renderGate0(secondHit);
      return true;
    }
    pendingNote = "<b>Noun-noun pair.</b> " + D.patterns.noun_adjunct.explanation +
                  " Deciding about <em>" + esc(second) + "</em>. (" +
                  D.patterns.noun_adjunct.rule_ref + ")";
  }

  if(scriptedPath && scriptedPath.length){
    scriptedPath.forEach(function(idx){
      var n = T[cur];
      if(!n || !n.opts) return;
      hist.push({node:cur, opt:idx});
      cur = n.opts[idx].go;
    });
  }
  render();
  return false;
}

/* ---------------- rendering ---------------- */

function render(){
  var n = T[cur];
  stage.innerHTML = "";
  if(pendingNote){
    var nc = document.createElement("div");
    nc.className = "note-card";
    nc.innerHTML = pendingNote;
    stage.appendChild(nc);
  }
  if(!hist.length){
    var badge = document.createElement("div");
    badge.className = "gate0 g-miss";
    badge.textContent = "Gate 0 \u2014 no fixed expression or listed name matched";
    stage.appendChild(badge);
  }
  if(n.out) renderResult(n); else renderQuestion(n);
  renderTrail();
}

function renderQuestion(n){
  var card = document.createElement("div");
  card.className = "qcard";
  var h = '<div class="gate">' + n.gate + '</div><h2 class="qtext">' + n.q + '</h2>';
  if(n.note) h += '<p class="qnote">' + n.note + '</p>';
  card.innerHTML = h;

  var box = document.createElement("div");
  box.className = "opts" + (n.style === "checklist" ? " checklist" : "");
  n.opts.forEach(function(o, i){
    var b = document.createElement("button");
    b.className = "opt" + (o.cls ? " " + o.cls : "");
    var inner = "";
    if(o.tag) inner += '<span class="tag">' + o.tag + '</span>';
    inner += o.label;
    if(o.ex) inner += '<span class="ex">' + o.ex + '</span>';
    b.innerHTML = inner;
    b.addEventListener("click", function(){ choose(i); });
    box.appendChild(b);
  });
  card.appendChild(box);

  if(n.warn){
    var w = document.createElement("div");
    w.className = "warn";
    w.innerHTML = n.warn;
    card.appendChild(w);
  }
  stage.appendChild(card);
}

function buildPhrase(form, word){
  if(!word) return "";
  if(form === "the") return "the " + word;
  if(form === "an")  return chooseAOrAn(word) + " " + word;
  return word;
}

function renderResult(n){
  var f = FORM[n.out];
  var card = document.createElement("div");
  card.className = "result " + f.cls;
  var h = '<p class="form">' + f.word + '</p>' +
          '<p class="cat">' + n.cat + '</p>' +
          '<p class="why">' + n.why + '</p>';
  if(n.list){
    h += "<ul>";
    n.list.forEach(function(li){ h += "<li>" + li + "</li>"; });
    h += "</ul>";
  }
  var word = displayWord(phrase.value);
  if(word && n.out !== "fixed"){
    h += '<p class="built">' + esc(buildPhrase(n.out, word)) + '</p>';
  }
  if(n.rule_ref) h += '<span class="ref">Rule ' + esc(n.rule_ref) + '</span>';
  card.innerHTML = h;
  stage.appendChild(card);
}

function renderGate0(r){
  stage.innerHTML = "";
  trailbox.classList.add("hidden");
  trail.innerHTML = "";

  var badge = document.createElement("div");
  badge.className = "gate0 g-hit";
  badge.textContent = r.context
    ? "Gate 0 \u2014 \u201c" + r.match + "\u201d has more than one reading"
    : "Gate 0 \u2014 matched \u201c" + r.match + "\u201d before any question";
  stage.appendChild(badge);

  if(r.adjunct){
    var nc = document.createElement("div");
    nc.className = "note-card";
    nc.innerHTML = "<b>Noun-noun pair.</b> " + D.patterns.noun_adjunct.explanation +
                   " So <em>" + esc(r.adjunct) + "</em> is ignored and <em>" +
                   esc(r.match) + "</em> decides. (" + D.patterns.noun_adjunct.rule_ref + ")";
    stage.appendChild(nc);
  }

  if(r.context){ renderContext(r); return; }

  var f = FORM[r.form];
  var card = document.createElement("div");
  card.className = "result " + f.cls;
  var h = '<p class="form">' + f.word + '</p>' +
          '<p class="cat">' + r.cat + '</p>' +
          '<p class="why">' + r.why + '</p>';
  if(r.note){
    h += '<div class="senses"><div class="sense">' +
         '<span class="pill p-next">but</span><div class="lead">' + r.note.text +
         '<span class="ex">' + r.note.examples.map(esc).join(" \u00b7 ") + '</span>' +
         '</div></div></div>';
  }
  if(r.fixed || r.blocked){
    /* nothing to build: the phrase is already complete as typed, so echo it
       verbatim rather than through displayWord, which strips the apostrophe
       out of "Sarah's car" */
    h += '<p class="built">' + esc(String(phrase.value).trim() || r.match) + '</p>';
  }else{
    /* prefer what the user actually typed, so capitalisation survives */
    var typed = displayWord(phrase.value);
    var word = (normalize(typed) === r.match) ? typed : r.match;
    h += '<p class="built">' + esc(buildPhrase(r.form, word)) + '</p>';
  }
  if(r.ref) h += '<span class="ref">Rule ' + esc(r.ref) + '</span>';
  card.innerHTML = h;
  stage.appendChild(card);
}

/* Two readings, and no guess between them. Shows the fixed sense, the sense
   that applies otherwise, and a way into the questions. */
function renderContext(r){
  var f = FORM.context;
  var card = document.createElement("div");
  card.className = "result " + f.cls;

  var fixedForm = FORM[formOf(r.fixedSense.article)];
  var h = '<p class="form">' + f.word + '</p>' +
          '<p class="cat">' + r.cat + '</p>' +
          '<p class="why">' + r.why + '</p>' +
          '<div class="senses">' +
            '<div class="sense"><span class="pill ' + fixedForm.cls.replace("r-","p-") + '">' +
              fixedForm.word + '</span><div class="lead"><b>' +
              (r.sense ? esc(r.sense) : "the fixed sense") + '</b><span class="ex">' +
              r.fixedSense.why + '</span></div></div>';

  if(r.examples && r.examples.length){
    h += '<div class="sense"><span class="pill p-next">otherwise</span>' +
         '<div class="lead"><b>ordinary rules apply</b><span class="ex">' +
         r.examples.map(function(x){ return esc(x); }).join(" \u00b7 ") +
         '</span></div></div>';
  }
  h += '</div>';
  if(r.ref) h += '<span class="ref">Rule ' + esc(r.ref) + '</span>';
  card.innerHTML = h;
  stage.appendChild(card);

  var go = document.createElement("button");
  go.className = "btn";
  go.style.marginTop = "14px";
  go.textContent = "Work it out with the questions";
  go.addEventListener("click", function(){
    hist = []; cur = entry; pendingNote = null;
    render();
    stage.scrollIntoView({block:"nearest", behavior:"smooth"});
  });
  stage.appendChild(go);
}

function renderTrail(){
  if(!hist.length){ trailbox.classList.add("hidden"); trail.innerHTML = ""; return; }
  trailbox.classList.remove("hidden");
  trail.innerHTML = "";
  hist.forEach(function(step){
    var n = T[step.node], o = n.opts[step.opt];
    var li = document.createElement("li");
    /* the gate number alone says nothing ("Question 2 - No"), so carry the
       question with it */
    var gate = n.short ? n.gate.split(" \u00b7 ")[0] : n.gate;
    var asked = gate + (n.short ? " \u00b7 " + n.short : "");
    li.innerHTML = '<span class="q">' + asked + ' \u2014 </span>' +
                   '<span class="a">' + o.label.replace(/^\d[a-z]? \u00b7 /, "") + '</span>';
    trail.appendChild(li);
  });
}

function choose(i){
  var n = T[cur];
  hist.push({node:cur, opt:i});
  cur = n.opts[i].go;
  pendingNote = null;
  render();
  stage.scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* ---------------- controls ---------------- */

function runCheck(){
  analyze(phrase.value, null);
  stage.scrollIntoView({block:"nearest", behavior:"smooth"});
}

document.getElementById("check").addEventListener("click", runCheck);
phrase.addEventListener("keydown", function(e){
  if(e.key === "Enter"){ e.preventDefault(); runCheck(); }
});

document.getElementById("back").addEventListener("click", function(){
  if(!hist.length) return;
  var last = hist.pop();
  cur = last.node;
  render();
});

document.getElementById("restart").addEventListener("click", function(){
  hist = []; cur = entry; pendingNote = null; phrase.value = "";
  render(); phrase.focus();
});

/* ---------------- map ---------------- */

function buildMap(){
  mapEl.innerHTML = "";

  /* Gate 0 reference: what used to be Question 1 */
  var fr = D.fixed_reference;
  var g0 = document.createElement("div");
  g0.className = "mgate";
  var gh = "<h3>" + fr.title + "</h3><p class=\"mq\">" + fr.note + "</p>";
  fr.groups.forEach(function(grp){
    gh += '<div class="refgroup"><h4>' + grp.label +
          ' <span class="pill p-' + (grp.form === "an" ? "an" : grp.form) + '">' +
          FORM[grp.form].word + '</span></h4><ul class="reflist">';
    grp.items.forEach(function(it){ gh += "<li>" + esc(it) + "</li>"; });
    gh += "</ul></div>";
  });
  g0.innerHTML = gh;
  mapEl.appendChild(g0);

  /* the tree itself, generated from the same data the walk uses */
  var order = ["q2", "q3", "q4", "q5"];
  order.forEach(function(id){
    var n = T[id];
    var d = document.createElement("div");
    d.className = "mgate";
    var h = "<h3>" + n.gate + " \u2014 " + n.q + "</h3>";
    if(n.note) h += '<p class="mq">' + n.note + "</p>";
    h += renderMapRows(n);
    d.innerHTML = h;
    mapEl.appendChild(d);
  });
}

function pillFor(nodeId){
  var n = T[nodeId];
  if(!n) return {p:nodeId, c:"p-next"};
  if(n.out) return {p:FORM[n.out].word, c:"p-" + n.out};
  return {p:n.gate, c:"p-next"};
}

function renderMapRows(n){
  var h = "";
  n.opts.forEach(function(o){
    var target = T[o.go], rows;
    /* expand a sub-question inline so the map stays flat and readable */
    if(target && target.opts && (o.go === "q2a" || o.go === "q3a" || o.go === "q4f")){
      rows = target.opts.map(function(so){
        var pf = pillFor(so.go);
        return {t: o.label + " \u2192 " + so.label, e: so.ex || "", p: pf.p, c: pf.c};
      });
    }else{
      var pf2 = pillFor(o.go);
      rows = [{t:o.label, e:o.ex || "", p:pf2.p, c:pf2.c}];
    }
    rows.forEach(function(r){
      h += '<div class="row"><div class="lead">' + r.t +
           (r.e ? '<span class="ex">' + r.e + "</span>" : "") +
           '</div><span class="pill ' + r.c + '">' + r.p + "</span></div>";
    });
  });
  return h;
}

/* ---------------- traces ---------------- */

function buildChips(){
  chipsEl.innerHTML = "";
  D.traces.forEach(function(t){
    var b = document.createElement("button");
    b.className = "chip";
    b.textContent = t.p;
    b.addEventListener("click", function(){
      phrase.value = t.p;
      analyze(t.p, t.path || null);
      stage.scrollIntoView({block:"nearest", behavior:"smooth"});
    });
    chipsEl.appendChild(b);
  });
}

/* ---------------- mode toggle ---------------- */

var walkEl = document.getElementById("walk");
var bWalk  = document.getElementById("m-walk");
var bMap   = document.getElementById("m-map");
function mode(isWalk){
  walkEl.classList.toggle("hidden", !isWalk);
  mapEl.classList.toggle("hidden", isWalk);
  bWalk.setAttribute("aria-pressed", String(isWalk));
  bMap.setAttribute("aria-pressed", String(!isWalk));
}
bWalk.addEventListener("click", function(){ mode(true); });
bMap.addEventListener("click", function(){ mode(false); });

/* ---------------- boot ---------------- */

/* Pages serves this with max-age=600, and it is cached independently of the
   page that reads it. Without revalidation a deploy can leave a visitor
   running new code against ten-minute-old rules. "no-cache" still uses the
   cache, but checks the ETag first, so a stale pair cannot happen. */
fetch("rules_data.json", {cache: "no-cache"})
  .then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.json();
  })
  .then(function(data){
    D = data;
    T = D.decision_tree;
    FORM = D.form_labels;
    entry = (D.meta && D.meta.entry_node) || "q2";
    cur = entry;
    buildChips();
    buildMap();
    render();
  })
  .catch(function(err){
    stage.innerHTML = '<div class="err"><b>Could not load rules_data.json.</b><br><br>' +
      'The page reads its rules from that file, so it has to be served over HTTP \u2014 ' +
      'opening the .html directly from disk will not work. Run ' +
      '<code>python -m http.server</code> in the project folder and open ' +
      '<code>http://localhost:8000/</code>.<br><br>' +
      '<span class="ex">' + esc(String(err && err.message ? err.message : err)) + '</span></div>';
  });
</script>
</body>
</html>
