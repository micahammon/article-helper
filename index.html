                           need.indexOf(tokens[natSpan[0] - 1]) !== -1);
    if(okPrev){
      return {form:formOf(nat.article), why:nat.explanation, ref:nat.rule_ref,
              cat:"Nationality adjective", match:norm};
    }
  }

  /* 4.5 productive categories: languages, meals, sports.

     The word has to be what the phrase is about. `french fries`, `a german
     car` and `the english teacher` all carry a language word in front of the
     noun they modify, and answering "languages take no article" there is the
     wrong reason and, with a determiner in front, the wrong article. */
  var catHit = checkCategories(norm, tokens);
  if(catHit && (tokens.length < 2 || catHit.match === inferFocus(text))) return catHit;

  /* 5. names in the the-taking class */
  if(isTheTakingName(text, norm)){
    var pn = D.proper_noun_the;
    return {form:formOf(pn.article), why:pn.explanation, ref:pn.rule_ref,
            cat:"A name that takes the", match:norm};
  }

  /* last: a construction inside a longer sentence. An incidental match loses
     to the gates above, which name a specific noun. */
  var loose = checkConstructions(text, tokens, false);
  if(loose) return loose;

  return null;
}

/* Patterns where the shape of the phrase decides the article, not the noun.
   Two passes: whole-input matches go first, loose matches last. */
function checkConstructions(text, tokens, wholeOnly){
  var phrase = tokens.join(" ");
  if(!phrase) return null;
  var i, rule, subject, m, covers;

  for(i = 0; i < D.constructions.length; i++){
    rule = D.constructions[i];
    subject = rule.case_sensitive ? String(text || "") : phrase;
    m = new RegExp(rule.regex, rule.case_sensitive ? "" : "i").exec(subject);
    if(!m) continue;
    /* too generic to trust over a name the tool already knows: `the
       Netherlands` fits "the + capitalised word + s" as neatly as `the
       Smiths` does */
    if(rule.not_if_known){
      var known = normalize(text);
      if(Object.prototype.hasOwnProperty.call(D.lookup_table, known) ||
         D.proper_noun_the.named.indexOf(known) !== -1) continue;
    }
    covers = (m.index === 0 && m.index + m[0].length === subject.replace(/^\s+|\s+$/g, "").length);
    /* a frame rule describes the shape of the whole clause rather than an
       adjunct inside it, so it belongs in the first pass even when partial */
    if(wholeOnly !== (covers || !!rule.frame)) continue;
    return {form:formOf(rule.article), why:rule.explanation, ref:rule.rule_ref,
            cat:"Sentence pattern",
            /* what the rule actually matched: the page highlights this, and a
               pinned focus is checked against it */
            match:(m[0] || "").replace(/^\s+|\s+$/g, "") || phrase,
            matched:(m[0] || "").replace(/^\s+|\s+$/g, ""),
            frame:!!rule.frame,
            construction:true,
            either:(String(rule.article).indexOf("either") === 0),
            examples:rule.examples || [], contrast:rule.contrast || null};
  }
  return null;
}

/* the longest listed phrase present in the tokens */
function findIn(tokens, words){
  var size, start, candidate;
  for(size = Math.min(3, tokens.length); size >= 1; size--){
    for(start = 0; start + size <= tokens.length; start++){
      candidate = tokens.slice(start, start + size).join(" ");
      if(words.indexOf(candidate) !== -1) return candidate;
    }
  }
  return null;
}

/* months, days, holidays, seasons, periods, and the date/year/decade patterns */
function checkTimeWords(norm, tokens){
  var T2 = D.time_words, name, p, g, key;
  for(name in T2.patterns){
    if(!Object.prototype.hasOwnProperty.call(T2.patterns, name)) continue;
    p = T2.patterns[name];
    if(new RegExp(p.regex, "i").test(norm)){
      return {form:formOf(p.article), why:p.explanation, ref:p.rule_ref,
              cat:"Time expression", match:norm,
              either:(p.article.indexOf("either") === 0)};
    }
  }
  for(name in T2.groups){
    if(!Object.prototype.hasOwnProperty.call(T2.groups, name)) continue;
    g = T2.groups[name];
    key = (g.words.indexOf(norm) !== -1) ? norm : findIn(tokens, g.words);
    if(key){
      return {form:formOf(g.article), why:g.explanation, ref:g.rule_ref,
              cat:cap(name.replace(/s$/, "")), match:key,
              either:(g.article.indexOf("either") === 0),
              unusual:T2.unusual};
    }
  }
  return null;
}

/* languages, meals and sports - productive rules, not word lists */
function checkCategories(norm, tokens){
  var name, c, key;
  for(name in D.categories){
    if(!Object.prototype.hasOwnProperty.call(D.categories, name)) continue;
    c = D.categories[name];
    key = (c.words.indexOf(norm) !== -1) ? norm : findIn(tokens, c.words);
    if(key){
      return {form:formOf(c.article), why:c.explanation, ref:c.rule_ref,
              cat:cap(name.replace(/s$/, "")), match:key,
              unusual:c.unusual};
    }
  }
  return null;
}

/* ---- the lookup table, but only where the fixed sense actually holds ---- */

var LOOKBACK_BOUNDARY = ["on","in","at","to","by","for","of","with","from","into",
  "onto","about","over","under","and","or","but","that","who","which","than"];
var LOOKBACK_LIMIT = 4;

function spanOf(tokens, phrase){
  var parts = phrase.split(" "), i, j, ok;
  for(i = 0; i + parts.length <= tokens.length; i++){
    ok = true;
    for(j = 0; j < parts.length; j++){
      if(tokens[i + j] !== parts[j]){ ok = false; break; }
    }
    if(ok) return [i, i + parts.length];
  }
  return [0, null];
}

/* the determiner governing a noun, looking past any adjectives between them */
function determinerBefore(tokens, start, words){
  var i = start - 1, steps = 0, t;
  while(i >= 0 && steps < LOOKBACK_LIMIT){
    t = tokens[i];
    if(words.indexOf(t) !== -1) return t;
    if(LOOKBACK_BOUNDARY.indexOf(t) !== -1) return null;
    i--; steps++;
  }
  return null;
}

function lookupResult(key, tokens){
  var e = D.lookup_table[key];
  var cond = e.conditions || null;
  var span = spanOf(tokens, key);
  var start = span[0], end = span[1];
  var following = (end !== null && end < tokens.length) ? tokens[end] : null;
  var forms = D.determiner_conflict.determiner_forms;

  function deferred(reason, why){
    return {form:"context", context:true, reason:reason, why:why,
            ref:(cond && cond.contrast_rule_ref) || e.rule_ref,
            cat:"Depends on the sentence", match:key,
            fixed:null,
            fixedSense:{article:e.article, why:e.explanation, ref:e.rule_ref},
            sense:cond ? cond.sense : null,
            examples:(cond && cond.examples) || []};
  }

  /* 1. a determiner already in front of the noun */
  var words = Object.keys(forms), g;
  for(g in D.determiners.groups){
    if(Object.prototype.hasOwnProperty.call(D.determiners.groups, g)){
      words = words.concat(D.determiners.groups[g]);
    }
  }
  var governing = determinerBefore(tokens, start, words);
  if(governing){
    for(g in D.determiners.groups){
      if(!Object.prototype.hasOwnProperty.call(D.determiners.groups, g)) continue;
      if(D.determiners.groups[g].indexOf(governing) !== -1){
        return {form:"blocked", blocked:true, why:D.determiners.explanation,
                ref:(g === "some_any" ? D.determiners.some_any_rule_ref : D.determiners.rule_ref),
                rule_name:(g === "some_any" ? null : D.determiners.rule_name),
                cat:"Another word already fills the slot", match:key};
      }
    }
    if(forms[governing] && forms[governing] !== e.article){
      return deferred("determiner_conflict", D.determiner_conflict.explanation);
    }
  }

  /* 2. the entry's own conditions */
  if(cond){
    var prev = start > 0 ? tokens[start - 1] : null;
    if(cond.requires_prev && cond.requires_prev.indexOf(prev) === -1){
      return deferred("missing_required_word", cond.contrast);
    }
    if(cond.blocked_by_next && cond.blocked_by_next.indexOf(following) !== -1){
      return deferred("blocked_by_following_word", cond.contrast);
    }
    if(cond.requires_any){
      var found = false, i;
      for(i = 0; i < cond.requires_any.length; i++){
        if(tokens.indexOf(cond.requires_any[i]) !== -1){ found = true; break; }
      }
      if(!found) return deferred("missing_required_word", cond.contrast);
    }
  }

  return {form:formOf(e.article), why:e.explanation, ref:e.rule_ref,
          cat:"Listed noun", match:key, note:e.note || null};
}

/* how long an input can be and still read as a bare noun phrase, and the verbs
   that mark it as a sentence instead */
var NOUN_PHRASE_LIMIT = 4;
var VERB_HINTS = ["is","are","was","were","am","be","been","being","have","has",
  "had","do","does","did","go","goes","went","like","likes","liked","want",
  "wants","need","needs","think","thinks","said","say","says","saw","see",
  "sees","bought","buy","buys","take","takes","took","get","gets","got","make",
  "makes","made","come","comes","came","play","plays","played","eat","eats",
  "ate","live","lives","lived","work","works","worked","study","studies",
  "studied","speak","speaks","spoke","read","reads","write","writes","wrote",
  "gave","give","gives","put","puts","know","knows","knew","found","find",
  "lend","lends","lent","send","sends","sent","spend","spends","spent",
  "meet","meets","met","tell","tells","told","bring","brings","brought",
  "catch","catches","caught","teach","teaches","taught","keep","keeps","kept",
  "feel","feels","felt","hold","holds","held","hear","hears","heard",
  "win","wins","won","pay","pays","paid","sell","sells","sold",
  "build","builds","built","mean","means","meant","become","becomes","became",
  "begin","begins","began","choose","chooses","chose","forget","forgets",
  "forgot","understand","understands","understood","borrow","borrows",
  "borrowed","wear","wears","wore","break","breaks","broke",
  "arrive","arrives","arrived","sing","sings","sang","sung"];

/* Gate 0 for a noun the learner picked, inside the sentence they typed.
   The sentence still supplies context - the determiner in front of the word,
   the verb a condition needs - so only the matching narrows to that word. */
function gate0Pinned(text, focus){
  var tokens = tokenize(text);
  var word = normalize(focus);
  var span = spanOf(tokens, word);
  var i, hit;

  for(i = 0; i < 2; i++){
    hit = checkConstructions(text, tokens, i === 0);
    /* a frame speaks for the whole clause, so it still covers a noun inside
       it; any other rule has to have matched that word */
    if(hit && word && (hit.frame || (hit.matched || "").split(" ").indexOf(word) !== -1)){
      return hit;
    }
  }

  if(span[1] !== null){
    if(Object.prototype.hasOwnProperty.call(D.fixed_expressions, word)){
      var fx = D.fixed_expressions[word];
      return {form:formOf(fx.article), why:fx.explanation, ref:fx.rule_ref,
              cat:"Fixed expression", match:word, fixed:true};
    }
    if(Object.prototype.hasOwnProperty.call(D.lookup_table, word)){
      return lookupResult(word, tokens);
    }
  }

  hit = checkTimeWords(word, [word]) || checkCategories(word, [word]);
  if(hit) return hit;

  var nat = D.nationality_the;
  if(nat.examples.indexOf(word) !== -1 && span[0] > 0 &&
     (nat.requires_prev || ["the"]).indexOf(tokens[span[0] - 1]) !== -1){
    return {form:formOf(nat.article), why:nat.explanation, ref:nat.rule_ref,
            cat:"Nationality adjective", match:word};
  }

  if(isTheTakingName(text, word)){
    var pn = D.proper_noun_the;
    return {form:formOf(pn.article), why:pn.explanation, ref:pn.rule_ref,
            cat:"A name that takes the", match:word};
  }
  return null;
}

/* The article slot is already filled.

   Only looks at the first word, so it can only speak for a bare noun phrase.
   In a sentence the leading determiner governs the subject, not necessarily
   the noun being asked about - "My mother is a teacher" was answering about
   `my mother` when the question is plainly about `a teacher`. */
function checkDeterminer(text, tokens){
  if(!tokens.length) return null;
  if(tokens.length > NOUN_PHRASE_LIMIT) return null;
  for(var v = 0; v < tokens.length; v++){
    if(VERB_HINTS.indexOf(tokens[v]) !== -1) return null;
  }
  var det = D.determiners, first = tokens[0], group, words;

  for(group in det.groups){
    if(!Object.prototype.hasOwnProperty.call(det.groups, group)) continue;
    words = det.groups[group];
    if(words.indexOf(first) !== -1){
      return {form:"blocked", why:det.explanation, blocked:true,
              ref:(group === "some_any" ? det.some_any_rule_ref : det.rule_ref),
              rule_name:(group === "some_any" ? null : det.rule_name),
              cat:"Another word already fills the slot",
              match:tokens.slice(1).join(" ") || first};
    }
  }

  /* a possessive 's fills the same slot: Sarah's car. A contraction does not -
     "There's a post office" is "there is". */
  var CONTRACTIONS = ["there","here","it","that","what","who","he","she","let",
                      "this","how","where"];
  var stem = String(first).split(/['\u2019]/)[0];
  if(CONTRACTIONS.indexOf(stem) === -1 &&
     /^\s*\S+['\u2019]s\s+\S+/.test(String(text || ""))){
    return {form:"blocked", why:det.explanation, blocked:true, ref:det.rule_ref,
            rule_name:det.rule_name,
            cat:"Another word already fills the slot",
            match:tokens.slice(1).join(" ") || tokens[0]};
  }
  return null;
}

/* A the-taking name, checked conservatively: a keyword only counts inside a
   capitalised name, and an of-construction needs a capital on each side. */
function isTheTakingName(text, norm){
  var pn = D.proper_noun_the;
  if(pn.named.indexOf(norm) !== -1) return true;

  var cased = casedTokens(text), i, j, t, neighbours;
  var lowered = cased.map(function(x){ return x.toLowerCase(); });

  for(i = 0; i < lowered.length; i++){
    if(pn.named.indexOf(lowered[i]) !== -1 && isCap(cased[i])) return true;
  }

  for(i = 0; i < lowered.length; i++){
    t = lowered[i];
    if(pn.keywords.indexOf(t) === -1 || !isCap(cased[i])) continue;
    neighbours = [];
    if(i > 0) neighbours.push(cased[i - 1]);
    if(i + 1 < cased.length) neighbours.push(cased[i + 1]);
    for(j = 0; j < neighbours.length; j++){
      if(isCap(neighbours[j])) return true;
    }
  }

  if(pn.contains_of){
    for(i = 1; i + 1 < cased.length; i++){
      if(lowered[i] === "of" && isCap(cased[i - 1]) && isCap(cased[i + 1])) return true;
    }
  }
  return false;
}

/* ---------------- entry point ---------------- */

function analyze(text, scriptedPath, focus){
  hist = [];
  pendingNote = null;
  cur = entry;
  pinned = focus || null;
  if(!pinned) pinnedBy = null;

  var hitResult = focus ? gate0Pinned(text, focus) : gate0(text);
  renderFocusBar(text, hitResult);
  if(hitResult){ renderGate0(hitResult); updateActions(); return true; }

  /* noun adjunct: two bare nouns, nothing matched -> the second noun decides */
  var tokens = tokenize(normalize(text));
  if(tokens.length === 2){
    var second = tokens[1];
    var secondHit = gate0(second);
    if(secondHit){
      secondHit.adjunct = tokens[0];
      renderGate0(secondHit);
      return true;
    }
    pendingNote = "<b>Noun-noun pair.</b> " + D.patterns.noun_adjunct.explanation +
                  " Deciding about <em>" + esc(second) + "</em>.";
  }

  if(scriptedPath && scriptedPath.length){
    scriptedPath.forEach(function(idx){
      var n = T[cur];
      if(!n || !n.opts) return;
      hist.push({node:cur, opt:idx});
      cur = n.opts[idx].go;
    });
  }
  render();
  return false;
}

/* ---------------- rendering ---------------- */

function render(){
  var n = T[cur];
  stage.innerHTML = "";
  if(pendingNote){
    var nc = document.createElement("div");
    nc.className = "note-card";
    nc.innerHTML = pendingNote;
    stage.appendChild(nc);
  }
  if(!hist.length){
    var badge = document.createElement("div");
    badge.className = "gate0 g-miss";
    badge.textContent = "No fixed expression or known name \u2014 working through the questions";
    stage.appendChild(badge);
  }
  if(n.out) renderResult(n); else renderQuestion(n);
  renderTrail();
  updateActions();
}

function renderQuestion(n){
  var card = document.createElement("div");
  card.className = "qcard";
  var h = '<div class="gate">' + n.gate + '</div><h2 class="qtext">' + n.q + '</h2>';
  if(n.note) h += '<p class="qnote">' + n.note + '</p>';
  card.innerHTML = h;

  var box = document.createElement("div");
  var isChecklist = (n.style === "checklist");
  box.className = "opts" + (isChecklist ? " checklist" : "");

  function addOption(o, i){
    var b = document.createElement("button");
    b.className = "opt" + (o.cls ? " " + o.cls : "");
    var inner = "";
    if(o.tag) inner += '<span class="tag">' + o.tag + '</span>';
    inner += o.label;
    if(o.ex) inner += '<span class="ex">' + o.ex + '</span>';
    b.innerHTML = inner;
    b.addEventListener("click", function(){ choose(i); });
    box.appendChild(b);
  }

  /* On the checklist gate the way out goes first, and the reasons that all
     end in `the` sit under a heading that says so. Bottom-of-the-list, the
     escape hatch read as the last resort after seven the-options rather than
     as the other half of the choice.

     Indexes stay the ones in the data, so saved trace paths and the map do
     not move with the buttons. */
  var escapes = [], reasons = [];
  n.opts.forEach(function(o, i){
    (isChecklist && o.cls === "none" ? escapes : reasons).push({o:o, i:i});
  });

  if(isChecklist && escapes.length){
    escapes.forEach(function(e){ addOption(e.o, e.i); });
    var head = document.createElement("p");
    head.className = "optgroup";
    head.innerHTML = n.group || "";
    box.appendChild(head);
  }
  reasons.forEach(function(e){ addOption(e.o, e.i); });
  card.appendChild(box);

  if(n.warn){
    var w = document.createElement("div");
    w.className = "warn";
    w.innerHTML = n.warn;
    card.appendChild(w);
  }
  stage.appendChild(card);
}

/* The word this card is about, set as a heading. The card reads like a
   reference entry, so the entry needs a headword - otherwise the only clue
   that "work" was chosen over "government" is a line of small grey caps. */
function headword(word){
  if(!word) return "";
  return '<p class="headword">' + esc(asTyped(word)) + '</p>';
}

/* Matched keys are normalised, so `the Netherlands` comes back as
   "netherlands". Show it the way the learner wrote it. */
function asTyped(word){
  var raw = String(phrase.value || "");
  if(!raw || !word) return word;
  var escaped = String(word).replace(/[.*+?^${}()|[\]\\]/g, "\\$&")
                            .replace(/\s+/g, "\\s+");
  var m = new RegExp("\\b" + escaped + "\\b", "i").exec(raw);
  return m ? m[0] : word;
}

/* Is the whole input a bare noun phrase, so the article goes in front of all
   of it? Same test checkDeterminer uses. */
var CLAUSE_MARKERS = ["i","you","he","she","it","we","they","me","him","her",
  "us","them","who","which","that","there"];

function isNounPhrase(text){
  var toks = tokenize(normalize(text));
  if(!toks.length || toks.length > NOUN_PHRASE_LIMIT) return false;
  for(var v = 0; v < toks.length; v++){
    /* a pronoun is a clause subject or object, never part of the noun phrase
       being decided: `I work for government` is a sentence, not a phrase */
    if(CLAUSE_MARKERS.indexOf(toks[v]) !== -1) return false;
    if(VERB_HINTS.indexOf(toks[v]) !== -1 && !isKnownNoun(toks[v])) return false;
  }
  return true;
}

/* The word the answer is about.

   For `a lovely dinner` that is the whole input - the article goes in front of
   the phrase. For a sentence it is one noun inside it, so building the answer
   from the whole input gave `an I work for government`. */
function resultWord(){
  var raw = String(phrase.value || "");
  if(pinned) return asTyped(normalize(pinned));
  if(isNounPhrase(raw)) return displayWord(raw);
  var f = inferFocus(raw);
  return f ? asTyped(f) : displayWord(raw);
}

function buildPhrase(form, word){
  if(!word) return "";
  /* one lookup key carries its own article - `the hague` - and adding another
     built `the the hague` */
  if(/^(?:the|an?)\s/i.test(word)) return word;
  if(form === "the") return "the " + word;
  if(form === "an")  return chooseAOrAn(word) + " " + word;
  return word;
}

function renderResult(n){
  var f = FORM[n.out];
  var card = document.createElement("div");
  card.className = "result " + f.cls;
  var h = headword(resultWord()) +
          '<p class="form">' + f.word + '</p>' +
          '<p class="cat">' + n.cat + '</p>' +
          '<p class="why">' + n.why + '</p>';
  if(n.list){
    h += "<ul>";
    n.list.forEach(function(li){ h += "<li>" + li + "</li>"; });
    h += "</ul>";
  }
  var word = resultWord();
  if(word){
    h += '<p class="built">' + esc(buildPhrase(n.out, word)) + '</p>';
  }
  h += refPill(n.rule_ref, n.rule_name);
  card.innerHTML = h;
  stage.appendChild(card);
}

function renderGate0(r){
  stage.innerHTML = "";
  trailbox.classList.add("hidden");
  trail.innerHTML = "";

  var badge = document.createElement("div");
  badge.className = "gate0 g-hit";
  badge.textContent = r.context
    ? "\u201c" + r.match + "\u201d has more than one reading"
    : "Matched \u201c" + r.match + "\u201d before any question";
  stage.appendChild(badge);

  if(r.adjunct){
    var nc = document.createElement("div");
    nc.className = "note-card";
    nc.innerHTML = "<b>Noun-noun pair.</b> " + D.patterns.noun_adjunct.explanation +
                   " So <em>" + esc(r.adjunct) + "</em> is ignored and <em>" +
                   esc(r.match) + "</em> decides.";
    stage.appendChild(nc);
  }

  if(r.context){ renderContext(r); return; }

  /* The phrase this card is about, ready to read. A construction matches a
     pattern rather than a word - "what a", "one of the", "half an" - so the
     fragment it matched would make a poor name for the card; the reader's own
     phrase is the subject. */
  var built;
  if(r.fixed || r.blocked || r.either || r.construction){
    /* nothing to build: the phrase is already complete as typed, so echo it
       verbatim rather than through displayWord, which strips the apostrophe
       out of "Sarah's car" */
    built = String(phrase.value).trim() || r.match;
  }else{
    /* prefer what the user actually typed, so capitalisation survives */
    var typed = displayWord(phrase.value);
    var bare = String(r.match).replace(/^(?:the|an?)\s+/i, "");
    var same = normalize(typed) === r.match || normalize(typed) === bare;
    /* the match is normalized and lower case; asTyped finds it back in the
       input, so a name keeps its capital - `in June` built `june` */
    built = buildPhrase(r.form, same ? typed : asTyped(r.match));
  }

  /* The headword names what was matched. When that is already what the built
     phrase says, one of them is noise - "Page 42" over "Page 42". */
  var name = r.construction ? "" : asTyped(r.match);
  if(name && normalize(name) === normalize(built)) name = "";

  stage.appendChild(resultCard(r, built, name));
}

/* The answer card itself, given the phrase to show and the headword to put
   over it. Gate 0 works both out from the sentence; the readings mode already
   knows them, because the learner chose them. */
function resultCard(r, built, name){
  var f = FORM[r.form];
  var card = document.createElement("div");
  card.className = "result " + f.cls;

  var h = headword(name) +
          '<p class="form">' + f.word + '</p>' +
          '<p class="cat">' + r.cat + '</p>' +
          '<p class="why">' + r.why + '</p>';
  if(r.note){
    h += '<div class="senses"><div class="sense">' +
         '<span class="pill p-next">but</span><div class="lead">' + r.note.text +
         '<span class="ex">' + r.note.examples.map(esc).join(" \u00b7 ") + '</span>' +
         '</div></div></div>';
  }
  if(r.unusual){
    h += '<div class="senses"><div class="sense">' +
         '<span class="pill p-next">unusual use</span>' +
         '<div class="lead">' + r.unusual + '</div></div></div>';
  }
  if(r.construction && (r.examples.length || r.contrast)){
    h += '<div class="senses">';
    if(r.examples.length){
      h += '<div class="sense"><span class="pill p-next">examples</span>' +
           '<div class="lead"><span class="ex">' +
           r.examples.map(esc).join(" \u00b7 ") + '</span></div></div>';
    }
    if(r.contrast){
      h += '<div class="sense"><span class="pill p-next">but</span>' +
           '<div class="lead">' + r.contrast + '</div></div>';
    }
    h += '</div>';
  }
  h += '<p class="built">' + esc(built) + '</p>';
  h += refPill(r.ref, r.rule_name);
  card.innerHTML = h;
  return card;
}

/* Two readings, and no guess between them. Shows the fixed sense, the sense
   that applies otherwise, and a way into the questions. */
function renderContext(r){
  var f = FORM.context;
  var card = document.createElement("div");
  card.className = "result " + f.cls;

  var fixedForm = FORM[formOf(r.fixedSense.article)];
  var h = headword(r.match) +
          '<p class="form">' + f.word + '</p>' +
          '<p class="cat">' + r.cat + '</p>' +
          '<p class="why">' + r.why + '</p>' +
          '<div class="senses">' +
            '<div class="sense"><span class="pill ' + fixedForm.cls.replace("r-","p-") + '">' +
              fixedForm.word + '</span><div class="lead"><b>' +
              (r.sense ? esc(r.sense) : "the fixed sense") + '</b><span class="ex">' +
              r.fixedSense.why + '</span></div></div>';

  if(r.examples && r.examples.length){
    h += '<div class="sense"><span class="pill p-next">otherwise</span>' +
         '<div class="lead"><b>ordinary rules apply</b><span class="ex">' +
         r.examples.map(function(x){ return esc(x); }).join(" \u00b7 ") +
         '</span></div></div>';
  }
  h += '</div>';
  h += refPill(r.ref, r.rule_name);
  card.innerHTML = h;
  stage.appendChild(card);

  var go = document.createElement("button");
  go.className = "btn";
  go.style.marginTop = "14px";
  go.textContent = "Work it out with the questions";
  go.addEventListener("click", function(){
    hist = []; cur = entry; pendingNote = null;
    /* the questions are about the word Gate 0 flagged, not whatever the
       sentence would otherwise infer - keep the answer on that word */
    pinned = r.match;
    pinnedBy = "context";
    render();
    stage.scrollIntoView({block:"nearest", behavior:"smooth"});
  });
  stage.appendChild(go);
}

function renderTrail(){
  if(!hist.length){ trailbox.classList.add("hidden"); trail.innerHTML = ""; return; }
  trailbox.classList.remove("hidden");
  trail.innerHTML = "";
  hist.forEach(function(step){
    var n = T[step.node], o = n.opts[step.opt];
    var li = document.createElement("li");
    /* short is the question in a few words - "can the listener identify it?"
       - which is what the reader needs to see beside their answer */
    var asked = n.short || n.gate;
    asked = asked.charAt(0).toUpperCase() + asked.slice(1);
    li.innerHTML = '<span class="q">' + asked + ' \u2014 </span>' +
                   '<span class="a">' + o.label.replace(/^\d[a-z]? \u00b7 /, "") + '</span>';
    trail.appendChild(li);
  });
}

function choose(i){
  var n = T[cur];
  hist.push({node:cur, opt:i});
  cur = n.opts[i].go;
  pendingNote = null;
  render();
  stage.scrollIntoView({block:"nearest", behavior:"smooth"});
}

/* ---------------- controls ---------------- */

/* Nothing to decide about yet. The questions are about a word, so asking
   them before there is one walks the reader through a tree about nothing. */
function renderEmpty(message){
  hist = []; cur = entry; pendingNote = null; pinned = null;
  trailbox.classList.add("hidden");
  trail.innerHTML = "";
  focusEl.classList.add("hidden");
  focusEl.innerHTML = "";
  stage.innerHTML = "";
  var card = document.createElement("div");
  card.className = "note-card";
  card.innerHTML = message || ("Type a noun or phrase above, then press " +
    "<b>Check</b>. Try <em>car</em>, <em>the Netherlands</em> or " +
    "<em>go to school</em> \u2014 or pick one of the examples below.");
  stage.appendChild(card);
  updateActions();
}

function runCheck(){
  /* tokenize keeps only word characters, so this catches an empty box,
     stray punctuation, and text in a script the rules cannot read */
  if(!tokenize(phrase.value).length){
    renderEmpty("Type a noun or phrase first \u2014 something like <em>car</em>, " +
                "<em>the Netherlands</em> or <em>go to school</em>.");
    return;
  }
  analyze(phrase.value, null);
  stage.scrollIntoView({block:"nearest", behavior:"smooth"});
}

document.getElementById("check").addEventListener("click", runCheck);
phrase.addEventListener("keydown", function(e){
  if(e.key === "Enter"){ e.preventDefault(); runCheck(); }
});

/* "Go back a step" has to mean something at every point. After a Gate 0 match
   there is no walk to unwind, so the only step the learner has taken is
   choosing a word - and if they have not done that either, the button is
   disabled rather than sitting there doing nothing. */
function stepsAvailable(){
  return hist.length > 0 || !!pinned;
}

function updateActions(){
  restartBtn.disabled = !hist.length && !pinned && !String(phrase.value || "").trim();
  backBtn.disabled = !stepsAvailable();
  backBtn.textContent = (!hist.length && pinned)
    ? (pinnedBy === "context" ? "Back to the two readings"
      : pinnedBy === "readings" ? "Back to the readings"
      : "Undo word choice")
    : "Go back a step";
}

backBtn.addEventListener("click", function(){
  if(hist.length){
    var last = hist.pop();
    cur = last.node;
    render();
    return;
  }
  if(pinnedBy === "readings" && readWord){
    /* the walk was entered from the readings list, so that list is the step
       before this one - not whatever the sentence would infer */
    mode("senses");
    renderReadings(readWord, readDisp);
    return;
  }
  if(pinned){
    /* back to the word the tool picked on its own */
    analyze(phrase.value, null, null);
    stage.scrollIntoView({block:"nearest", behavior:"smooth"});
  }
});

var restartBtn = document.getElementById("restart");
restartBtn.addEventListener("click", function(){
  phrase.value = "";
  renderEmpty();
  updateActions();
  phrase.focus();
});

/* ---------------- map ---------------- */

function buildMap(){
  mapEl.innerHTML = "";

  /* Gate 0 reference: what used to be Question 1 */
  var fr = D.fixed_reference;
  var g0 = document.createElement("div");
  g0.className = "mgate";
  var gh = "<h2>" + fr.title + "</h2><p class=\"mq\">" + fr.note + "</p>";
  fr.groups.forEach(function(grp){
    gh += '<div class="refgroup"><h3>' +
          '<span class="pill p-' + (grp.form === "an" ? "an" : grp.form) + '">' +
          FORM[grp.form].word + '</span></h3><ul class="reflist">';
    grp.items.forEach(function(it){ gh += "<li>" + esc(it) + "</li>"; });
    gh += "</ul></div>";
  });
  g0.innerHTML = gh;
  mapEl.appendChild(g0);

  /* the tree itself, generated from the same data the walk uses */
  var order = ["q2", "q3", "q4", "q5"];
  order.forEach(function(id){
    var n = T[id];
    var d = document.createElement("div");
    d.className = "mgate";
    var h = "<h2>" + n.q + "</h2>";
    if(n.note) h += '<p class="mq">' + n.note + "</p>";
    h += renderMapRows(n);
    d.innerHTML = h;
    mapEl.appendChild(d);
  });
}

function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

/* A rule reaches the reader by name. The number it carries internally is for
   us, not for a student who has no numbered rules to look up.

   Some outcomes are reached by more than their cited section covers - the
   ordinary-name leaf answers for people and companies, not only places - so
   they carry a name of their own, and it wins over the one the ref implies. */
function refPill(ref, override){
  var name = override || (ref && D.rule_names ? D.rule_names[ref] : null);
  return name ? '<span class="ref">' + esc(name) + "</span>" : "";
}

function pillFor(nodeId){
  var n = T[nodeId];
  if(!n) return {p:nodeId, c:"p-next"};
  if(n.out) return {p:FORM[n.out].word, c:"p-" + n.out};
  return {p:n.gate, c:"p-next"};
}

function renderMapRows(n){
  var h = "";
  /* The walk shows the way out first and heads the rest with what they all
     answer. The map read the raw order, so the same question came out in two
     different shapes depending on which view you were in. */
  var opts = n.opts, heading = -1;
  if(n.style === "checklist"){
    opts = n.opts.filter(function(o){ return o.cls === "none"; });
    heading = opts.length;
    opts = opts.concat(n.opts.filter(function(o){ return o.cls !== "none"; }));
  }
  opts.forEach(function(o, oi){
    if(oi === heading && n.group){
      h += '<p class="optgroup">' + n.group + "</p>";
    }
    var target = T[o.go], rows;
    /* expand a sub-question inline so the map stays flat and readable */
    if(target && target.opts && (o.go === "q2a" || o.go === "q3a" || o.go === "q4g")){
      rows = target.opts.map(function(so){
        var pf = pillFor(so.go);
        return {t: o.label + " \u2192 " + so.label, e: so.ex || "", p: pf.p, c: pf.c};
      });
    }else{
      var pf2 = pillFor(o.go);
      rows = [{t:o.label, e:o.ex || "", p:pf2.p, c:pf2.c}];
    }
    rows.forEach(function(r){
      h += '<div class="row"><div class="lead">' + r.t +
           (r.e ? '<span class="ex">' + r.e + "</span>" : "") +
           '</div><span class="pill ' + r.c + '">' + r.p + "</span></div>";
    });
  });
  return h;
}

/* ---------------- traces ---------------- */

var CHIP_COUNT = 24;
var SEEN_KEY = "article-helper:seen";

/* Which phrases have already been run. Kept across reloads so the row reads as
   a checklist, but a seen phrase stays in the pool and can be drawn again. */
var seen = loadSeen();

function loadSeen(){
  try{
    var raw = window.localStorage.getItem(SEEN_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  }catch(e){
    return new Set();
  }
}

function saveSeen(){
  try{
    window.localStorage.setItem(SEEN_KEY, JSON.stringify(Array.from(seen)));
  }catch(e){ /* private mode, file:// quirks - the marks are just not kept */ }
}

function shuffled(list){
  var a = list.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function buildChips(){
  chipsEl.innerHTML = "";
  shuffled(D.traces).slice(0, CHIP_COUNT).forEach(function(t){
    var b = document.createElement("button");
    b.className = "chip" + (seen.has(t.p) ? " seen" : "");
    b.textContent = t.p;
    if(seen.has(t.p)) b.title = "already run";
    b.addEventListener("click", function(){
      seen.add(t.p);
      saveSeen();
      b.className = "chip seen";
      b.title = "already run";
      phrase.value = t.p;
      analyze(t.p, t.path || null);
      stage.scrollIntoView({block:"nearest", behavior:"smooth"});
    });
    chipsEl.appendChild(b);
  });
}

document.getElementById("shuffle").addEventListener("click", buildChips);
document.getElementById("clearseen").addEventListener("click", function(){
  seen = new Set();
  saveSeen();
  buildChips();
});


/* ---------------- every reading of a word ---------------- */

/* The walk answers with one reading and has to guess which one was meant.
   Here the learner says. Nothing below is new advice: every reading is
   assembled out of rules already written in rules_data.json, and a word that
   is on no list still gets the three ordinary ones, so the mode never ends
   with an empty page. */

var READ_CAP = 6;

/* Where each node is arrived at, the option that goes there carries the
   example that made it recognisable. Indexing them by destination means the
   examples follow the tree if a question is ever re-cut, rather than being
   copied here to go stale. */
var EX = null;
function exFor(nodeId){
  var k, n, i, o;
  if(!EX){
    EX = {};
    for(k in T){
      if(!Object.prototype.hasOwnProperty.call(T, k)) continue;
      n = T[k];
      for(i = 0; i < (n.opts || []).length; i++){
        o = n.opts[i];
        if(o.ex && o.go && !EX[o.go]) EX[o.go] = o.ex;
      }
    }
  }
  return EX[nodeId] || null;
}

/* Two examples are a card; four are a wall. */
function firstItems(ex, n){
  if(!ex) return null;
  return ex.split(" \u00b7 ").slice(0, n).join(" \u00b7 ");
}

/* What a listed entry shows off. Most explanations name the use they are
   about - <em>go to the cinema</em>, <em>listen to the radio</em> - and that
   phrase is the example the entry never got a field for. */
function emExamples(html, word){
  var re = /<em>(.*?)<\/em>/gi, m, out = [], t;
  while((m = re.exec(String(html || ""))) && out.length < 2){
    t = m[1].replace(/<[^>]*>/g, "");
    if(t.toLowerCase().indexOf(word) !== -1 && normalize(t) !== word) out.push(t);
  }
  return out;
}

/* Worked phrases that use this word. The lookup table and the fixed
   expressions carry no examples of their own, but the traces that feed the
   chips are real uses, and 45 of the 70 listed words appear in one. */
function traceExamples(word, title){
  var out = [], i, p;
  for(i = 0; i < D.traces.length && out.length < 2; i++){
    p = D.traces[i].p;
    if(tokenize(p).indexOf(word) === -1) continue;
    /* a trace that only repeats the card's own phrase teaches nothing */
    if(normalize(p) === normalize(title)) continue;
    out.push(p);
  }
  return out;
}

/* the words that switch a conditional entry on, said as a cue */
function cueFor(cond){
  var list = cond.requires_any || cond.requires_prev || null;
  if(!list || !list.length) return null;
  var shown = list.slice(0, 5).map(function(w){ return "<em>" + esc(w) + "</em>"; });
  return "Used after " + shown.join(", ") +
         (list.length > 5 ? " and the like" : "") + ".";
}

function readingsFor(word, disp){
  var out = [], seenKey = {}, k;

  function add(r){
    /* the phrase is built on what the learner typed - `the French`, not `the
       french` - while every lookup below runs on the normalized word */
    r.title = r.title || buildPhrase(r.form, disp);
    /* the label is part of the identity: two of Q4's cues cite 2.3, and
       keying on the rule alone dropped the second one */
    k = r.form + "|" + (r.ref || "") + "|" + r.title + "|" + (r.cat || "");
    if(seenKey[k]) return;
    seenKey[k] = 1;
    out.push(r);
  }

  /* 1. the listed noun, and whatever it says about its other sense */
  var e = Object.prototype.hasOwnProperty.call(D.lookup_table, word)
        ? D.lookup_table[word] : null;
  if(e){
    var cond = e.conditions || null;
    add({kind:"listed", pick:"answer", form:formOf(e.article),
         cat:(cond && cond.sense) ? cap(cond.sense) : "Listed noun",
         why:e.explanation, ref:e.rule_ref, when:cond ? cueFor(cond) : null,
         examples:emExamples(e.explanation, word)});
    if(cond){
      add({kind:"listed", pick:"walk", form:"context", title:"anything else",
           cat:"Any other use", why:cond.contrast || "The ordinary rules apply.",
           ref:cond.contrast_rule_ref || null, when:null,
           examples:cond.examples || []});
    }
    if(e.note){
      add({kind:"listed", pick:"walk", form:"context", title:"a different sense",
           /* no rule name on a note, as the walk shows none: eight of the
              notes cite 6.1.4, whose name is about meals, sports and
              languages and reads as a mislabel over `a cinema` */
           cat:"A different sense", why:e.note.text, ref:null,
           when:null, examples:e.note.examples || []});
    }
  }

  /* 2. fixed expressions the word appears in - `by car`, `at night` */
  var fixed = [], key;
  for(key in D.fixed_expressions){
    if(!Object.prototype.hasOwnProperty.call(D.fixed_expressions, key)) continue;
    if(/\d/.test(key)) continue;
    if(key.split(" ").indexOf(word) !== -1) fixed.push(key);
  }
  fixed.sort(function(a, b){ return a.length - b.length; });
  fixed.slice(0, READ_CAP).forEach(function(f){
    var fx = D.fixed_expressions[f];
    add({kind:"listed", pick:"answer", form:formOf(fx.article), title:f,
         cat:"Fixed expression", why:fx.explanation, ref:fx.rule_ref,
         when:null, examples:emExamples(fx.explanation, word), match:f});
  });

  /* 3. the productive groups: languages, meals, sports, months, days, ... */
  function fromGroups(map){
    var name, g;
    for(name in map){
      if(!Object.prototype.hasOwnProperty.call(map, name)) continue;
      g = map[name];
      if(!g.words || g.words.indexOf(word) === -1) continue;
      add({kind:"listed", pick:"answer", form:formOf(g.article),
           cat:cap(name.replace(/s$/, "")), why:g.explanation, ref:g.rule_ref,
           when:null, examples:emExamples(g.explanation, word)});
    }
  }
  fromGroups(D.categories);
  fromGroups(D.time_words.groups);

  /* 4. names, and nationality adjectives standing for a whole people */
  if(D.nationality_the.examples.indexOf(word) !== -1){
    add({kind:"listed", pick:"answer", form:formOf(D.nationality_the.article),
         cat:"A whole people", why:D.nationality_the.explanation,
         ref:D.nationality_the.rule_ref, when:null, examples:[]});
  }
  if(D.proper_noun_the.named.indexOf(word) !== -1){
    add({kind:"listed", pick:"answer", form:formOf(D.proper_noun_the.article),
         cat:"A name that takes the", why:D.proper_noun_the.explanation,
         ref:D.proper_noun_the.rule_ref, when:null, examples:[]});
  }

  /* 5. the ordinary readings, always. These are doorways rather than answers:
        which one is right depends on the sentence, so they hand the word to
        the questions instead of asserting a form. */
  /* except where the learner typed the article themselves - `the Hague` takes
     no other shape, so three cards saying `the Hague` would only be noise */
  if(/^(?:the|an?)\s/i.test(disp) && out.length) return out;

  var a = T.out5a, z = T.outGenZeroPl;
  add({kind:"ordinary", pick:"walk", form:"an", cat:a.cat, why:a.why,
       ref:a.rule_ref, when:null, ex:firstItems(exFor("out5a"), 2)});
  /* `the` is not one reading, it is eight. Collapsing Q4's cues into a
     single card hid the one a learner most often wants - `government` is a
     role that belongs to something, and that reading was unreachable here.
     Each cue is a leaf with its own name, rule and examples, so each is a
     reading in its own right, and picking one is the choice Q4 would have
     asked for. */
  T.q4.opts.forEach(function(o){
    var leaf = T[o.go];
    /* the last cue is "none of these", which is the a/an card above */
    if(!leaf || o.go === "q5") return;
    if(leaf.out){
      add({kind:"cue", pick:"answer", form:leaf.out, title:buildPhrase(leaf.out, disp),
           cat:leaf.cat, why:leaf.why, ref:leaf.rule_ref, ruleName:leaf.rule_name || null,
           when:null, ex:o.ex});
    }else{
      /* one cue opens a further question rather than answering */
      add({kind:"cue", pick:"walk", node:o.go, form:"the", title:buildPhrase("the", disp),
           cat:o.label, why:leaf.q, ref:null, when:null, ex:o.ex});
    }
  });
  add({kind:"ordinary", pick:"walk", form:"zero", cat:z.cat, why:z.why,
       ref:z.rule_ref, when:null,
       ex:[firstItems(exFor("outGenZeroPl"), 1), firstItems(exFor("outGenZeroNc"), 1)]
            .filter(Boolean).join(" \u00b7 ") || null});

  return out;
}

/* An example that only says the phrase already at the top of the card - `at
   night` under `at night` - is not an example. */
function exceptTitle(text, title){
  if(!text) return null;
  var keep = String(text).split(" \u00b7 ").filter(function(x){
    return normalize(x) !== normalize(title);
  });
  return keep.length ? keep.join(" \u00b7 ") : null;
}

function readHead(text){
  var el = document.createElement("p");
  el.className = "readhead";
  el.textContent = text;
  return el;
}

function renderReadings(word, disp){
  sstage.innerHTML = "";
  var list = readingsFor(word, disp), lastKind = null;
  readWord = word; readDisp = disp;

  var lead = document.createElement("p");
  lead.className = "readhead";
  lead.textContent = "Readings of \u201c" + disp + "\u201d \u2014 pick the one you meant";
  sstage.appendChild(lead);

  var saidOrdinary = false, saidCue = false;
  list.forEach(function(r){
    if(r.kind !== "listed" && !saidOrdinary){
      saidOrdinary = true;
      sstage.appendChild(readHead("Or, as an ordinary noun"));
    }
    if(r.kind === "cue" && !saidCue){
      saidCue = true;
      sstage.appendChild(readHead("\u201c" + buildPhrase("the", disp) +
        "\u201d \u2014 pick why your listener can tell which one"));
    }
    lastKind = r.kind;

    var f = FORM[r.form];
    var b = document.createElement("button");
    b.type = "button";
    b.className = "reading " + f.cls + (r.kind === "cue" ? " cue" : "");
    /* An example of its own comes first; failing that, a worked phrase that
       uses the word. A card with neither closes up. */
    var ex = exceptTitle(r.ex, r.title) ||
             exceptTitle((r.examples || []).map(esc).join(" \u00b7 "), r.title) ||
             (r.kind === "listed"
                ? exceptTitle(traceExamples(word, r.title).map(esc).join(" \u00b7 "), r.title)
                : null);

    var h = "";
    if(r.kind !== "cue"){
      h += '<div class="top"><p class="built">' + esc(r.title) + '</p>' +
           '<span class="pill ' + f.cls.replace("r-", "p-") + '">' + f.word + '</span></div>';
    }
    if(ex) h += '<p class="lead-ex">' + ex + '</p>';
    h += '<p class="cat">' + esc(r.cat) + '</p>';
    if(r.when) h += '<p class="when">' + r.when + '</p>';
    h += '<p class="why">' + r.why + '</p>';
    h += refPill(r.ref, null);
    b.innerHTML = h;
    b.addEventListener("click", function(){ chooseReading(word, disp, r); });
    sstage.appendChild(b);
  });
}

function chooseReading(word, disp, r){
  if(r.pick === "walk"){
    /* a cue that opens a further question starts there, not at the top */
    /* the same handoff the "it depends" card makes: the questions run on the
       word the learner named, not on whatever a sentence would infer */
    mode("walk");
    phrase.value = disp;
    hist = []; cur = r.node || entry; pendingNote = null;
    pinned = word; pinnedBy = "readings";
    render();
    stage.scrollIntoView({block:"nearest", behavior:"smooth"});
    return;
  }

  sstage.innerHTML = "";
  var built = r.match ? r.match : buildPhrase(r.form, disp);
  /* the headword would only repeat the phrase when the two are the same */
  var name = (normalize(built) === word) ? "" : disp;
  sstage.appendChild(resultCard({form:r.form, why:r.why, cat:r.cat, ref:r.ref,
                                 rule_name:r.ruleName || null}, built, name));

  var again = document.createElement("button");
  again.className = "btn ghost";
  again.style.marginTop = "14px";
  again.type = "button";
  again.textContent = "Choose again";
  again.addEventListener("click", function(){ renderReadings(word, disp); });
  sstage.appendChild(again);
}

function readingsEmpty(msg){
  sstage.innerHTML = '<div class="note-card">' + msg + "</div>";
}

function runReadings(){
  var tokens = tokenize(sword.value);
  if(!tokens.length){
    readingsEmpty("Type a word first \u2014 something like <em>radio</em>, " +
                  "<em>cinema</em> or <em>night</em>.");
    return;
  }
  renderReadings(tokens.join(" "), String(sword.value).replace(/^\s+|\s+$/g, ""));
}

var sword  = document.getElementById("sword");
var sstage = document.getElementById("sstage");
document.getElementById("scheck").addEventListener("click", runReadings);
sword.addEventListener("keydown", function(e){
  if(e.key === "Enter"){ e.preventDefault(); runReadings(); }
});

/* ---------------- play ---------------- */

/* The other three modes hand the learner the answer. This one asks for it
   first, and the only reward for guessing is the same explanation the tree
   gives - so nothing here authors a question. Every phrase is lifted out of
   the rules the tool already carries and then handed back to gate0(); an item
   only survives if the engine agrees with the entry it came from. A rules edit
   can therefore never leave the game teaching something the tool denies. */

var GAME_KEY = "article-helper:game";
var GAME_FORMS = ["the", "an", "zero"];
var ART_TOKENS = {a:"an", an:"an", the:"the"};

/* words that can stand in front of the blank when the phrase has no article of
   its own: `in ___ prison`, `for ___ dinner`, `by ___ bus` */
var CLOZE_LEAD = ["in","on","at","to","by","for","of","with","from","into",
  "after","before","during","over","under","go","goes","went","play","plays",
  "played","listen","listens","watch","watches","speak","speaks","have","has",
  "had","learn","learns","teach","teaches","study","studies","take","takes"];

var GAME_POOL = null;

function gameStrip(s){
  return String(s == null ? "" : s).replace(/<[^>]*>/g, "").replace(/^\s+|\s+$/g, "");
}

/* Every phrase the data already contains, with whatever answer its own entry
   declares. A null ref means the source cannot vouch for the answer and gate0
   alone decides - which is right for the note and contrast examples, since
   those illustrate the *other* sense of the word they hang under. */
function gameCandidates(){
  var out = [], k, e, i, nid;

  function add(p, ref, article, src, also){
    p = gameStrip(p);
    if(!p) return;
    out.push({phrase:p, ref:ref || null, form:article ? formOf(article) : null,
              src:src, also:also || []});
  }

  for(k in D.fixed_expressions){
    if(!Object.prototype.hasOwnProperty.call(D.fixed_expressions, k)) continue;
    e = D.fixed_expressions[k];
    add(k, e.rule_ref, e.article, "fixed");
  }

  for(k in D.lookup_table){
    if(!Object.prototype.hasOwnProperty.call(D.lookup_table, k)) continue;
    e = D.lookup_table[k];
    var also = [];
    if(e.note && e.note.rule_ref) also.push(e.note.rule_ref);
    if(e.conditions && e.conditions.contrast_rule_ref) also.push(e.conditions.contrast_rule_ref);
    add(k, e.rule_ref, e.article, "lookup", also);
    gameAddAll(add, gameNoteExamples(e), null, null, "lookup-ex", [e.rule_ref]);
  }

  for(i = 0; i < D.constructions.length; i++){
    e = D.constructions[i];
    gameAddAll(add, e.examples, e.rule_ref, e.article, "construction");
  }

  for(k in D.categories){
    if(!Object.prototype.hasOwnProperty.call(D.categories, k)) continue;
    e = D.categories[k];
    /* a language is a name and keeps its capital; a meal or a sport does not */
    gameAddAll(add, (e.words || []).map(k === "languages" ? cap : String),
               e.rule_ref, e.article, "category");
  }

  D.traces.forEach(function(t){ add(t.p, null, null, "trace"); });

  for(nid in T){
    if(!Object.prototype.hasOwnProperty.call(T, nid)) continue;
    (T[nid].opts || []).forEach(function(o){
      if(!o.ex) return;
      String(o.ex).split(/\s*·\s*/).forEach(function(x){
        add(x, null, null, "treeex");
      });
    });
  }

  return out;
}

function gameAddAll(add, list, ref, article, src, also){
  (list || []).forEach(function(x){ add(x, ref, article, src, also); });
}

function gameNoteExamples(e){
  return ((e.note && e.note.examples) || [])
    .concat((e.conditions && e.conditions.examples) || []);
}

/* The verification step. gate0 has to answer, and answer something a learner
   can be asked to pick: `it depends`, a filled article slot, and the either/
   countable/one forms are all true answers and all unaskable. */
function gameVerify(c){
  var r = gate0(c.phrase);
  if(!r) return null;
  if(r.context || r.blocked) return null;
  if(GAME_FORMS.indexOf(r.form) === -1) return null;
  if(!r.ref || !D.rule_names[r.ref]) return null;
  if(c.ref && r.ref !== c.ref) return null;
  if(c.form && r.form !== c.form) return null;

  /* refs the data itself calls another reading of this phrase. They are barred
     as wrong answers: a distractor that is also right is not a question. */
  var also = {};
  (c.also || []).forEach(function(x){ if(x) also[x] = 1; });
  if(r.note && r.note.rule_ref) also[r.note.rule_ref] = 1;
  [displayWord(c.phrase), r.match].forEach(function(t){
    if(!t || t === c.phrase) return;
    var alt = gate0(t);
    if(alt && alt.ref) also[alt.ref] = 1;
  });
  delete also[r.ref];

  return {phrase:c.phrase, form:r.form, ref:r.ref, name:D.rule_names[r.ref],
          why:r.why || "", cat:r.cat || "", src:c.src, also:also,
          cloze:gameCloze(c.phrase, r.match || "", r.form),
          len:tokenize(c.phrase).length};
}

function gameJoin(toks, at, drop){
  return toks.slice(0, at).concat(["___"], toks.slice(at + (drop ? 1 : 0))).join(" ");
}

/* Where the blank goes, or null if it cannot go anywhere honestly. */
function gameCloze(phrase, match, form){
  var toks = casedTokens(phrase);
  var low = tokenize(phrase);
  if(!toks.length || toks.length !== low.length) return null;

  var slots = [], i;
  for(i = 0; i < low.length; i++){
    if(Object.prototype.hasOwnProperty.call(ART_TOKENS, low[i])) slots.push(i);
  }

  /* two articles in one sentence: only the one the rule matched is in play */
  if(slots.length > 1 && match){
    var span = spanOf(low, tokenize(match).join(" "));
    if(span[1] !== null){
      slots = slots.filter(function(ix){ return ix >= span[0] && ix < span[1]; });
    }
  }

  if(slots.length === 1){
    /* `half an hour` is a no-article expression that happens to carry an `an`.
       Blanking that `an` would ask a question whose answer is a lie. */
    if(ART_TOKENS[low[slots[0]]] !== form) return null;
    return gameJoin(toks, slots[0], true);
  }
  if(slots.length) return null;

  if(form !== "zero") return null;
  if(toks.length === 1) return "___ " + toks[0];

  /* the blank belongs in front of the noun, so every leading function word has
     to be walked past first: `go to school` is `go to ___ school`, not
     `go ___ to school` */
  var at = 0;
  while(at < low.length && CLOZE_LEAD.indexOf(low[at]) !== -1) at++;
  if(at === 0 || at >= low.length) return null;
  return gameJoin(toks, at, false);
}

/* A floor, not a partition: a level draws everything at its tier and below, so
   the easy items come back round under a harder question. */
function gameTier(it){
  if(it.cloze && it.len <= 3 &&
     (it.src === "fixed" || it.src === "lookup" || it.src === "category")) return 1;
  if(it.len <= 5 && it.src !== "construction") return 2;
  return 3;
}

function buildGamePool(){
  if(GAME_POOL) return GAME_POOL;
  var items = [], keys = {}, byRef = {}, byForm = {}, byPrefix = {};

  gameCandidates().forEach(function(c){
    var k = normalize(c.phrase);
    if(!k || Object.prototype.hasOwnProperty.call(keys, k)) return;
    keys[k] = 1;
    var it = gameVerify(c);
    if(!it) return;
    it.tier = gameTier(it);
    items.push(it);
  });

  items.forEach(function(it){
    (byRef[it.ref] = byRef[it.ref] || []).push(it);
    (byForm[it.form] = byForm[it.form] || []).push(it);
  });
  Object.keys(byRef).forEach(function(ref){
    var p = String(ref).split(".")[0];
    (byPrefix[p] = byPrefix[p] || []).push(ref);
  });

  GAME_POOL = {items:items, byRef:byRef, byForm:byForm, byPrefix:byPrefix,
               refs:Object.keys(byRef)};
  return GAME_POOL;
}

/* ---------------- questions ---------------- */

function plainForm(form){
  if(form === "zero") return "no article";
  return FORM[form] ? FORM[form].word : form;
}

function articleOptions(item){
  return shuffled([{key:"the"}, {key:"an"}, {key:"zero"}]).map(function(o){
    o.label = plainForm(o.key);
    o.right = (o.key === item.form);
    return o;
  });
}

/* A wrong answer has to be wrong. Two bars: a name identical to the right
   answer's (rule names are not unique - two of Q4's cues cite the same rule),
   and any ref the data offered as another reading of this very phrase. */
function alsoCorrect(item, ref){
  return ref === item.ref ||
         D.rule_names[ref] === item.name ||
         !!item.also[ref];
}

/* Near misses first, then any rule that answers the same article, then the
   whole pool - so three options can always be found. */
function ruleOptions(item, near){
  var pool = GAME_POOL, pick = [], tried = {}, names = {};
  names[item.name] = 1;

  var sameSection = pool.byPrefix[String(item.ref).split(".")[0]] || [];
  var sameForm = (pool.byForm[item.form] || []).map(function(x){ return x.ref; });
  var sources = near ? [sameSection, sameForm, pool.refs] : [pool.refs];

  sources.forEach(function(src){
    shuffled(src).forEach(function(ref){
      if(pick.length >= 3) return;
      if(Object.prototype.hasOwnProperty.call(tried, ref)) return;
      tried[ref] = 1;
      if(alsoCorrect(item, ref)) return;
      var nm = D.rule_names[ref];
      if(!nm || Object.prototype.hasOwnProperty.call(names, nm)) return;
      names[nm] = 1;
      pick.push(ref);
    });
  });

  if(pick.length < 3) return null;
  return shuffled(pick.concat([item.ref])).map(function(r){
    return {key:r, label:D.rule_names[r], right:(r === item.ref)};
  });
}

/* ---------------- the run ---------------- */

var LEVELS = [
  {ask:"article", tier:1, near:false, need:5,
   blurb:"which article?",
   intro:"Short phrases. Say which article fills the blank."},
  {ask:"article", tier:1, near:false, need:6,
   blurb:"which article?",
   intro:"Same question, with more of the rules in play."},
  {ask:"rule",    tier:2, near:false, need:5,
   blurb:"which rule?",
   intro:"The article is not the question any more. Say which rule decides it."},
  {ask:"rule",    tier:2, near:true,  need:6,
   blurb:"which rule? · closer calls",
   intro:"The wrong answers are now rules from the same family."},
  {ask:"both",    tier:3, near:true,  need:6,
   blurb:"article, then rule",
   intro:"Both halves, on longer phrases."},
  {ask:"both",    tier:3, near:true,  need:8,
   blurb:"article, then rule",
   intro:"Last level. Everything the rules hold."}
];

var G = null;
var GSTATS = null;
var gstage = document.getElementById("gstage");

function freshStats(){
  return {best:0, bestStreak:0, runs:0, missed:[]};
}

/* Same defensive shape as loadSeen - a file:// page in private mode simply
   keeps no record. Every field is checked on the way in as well: a rule that
   has since been retired must not come back as a blank button. */
function loadStats(){
  try{
    var raw = window.localStorage.getItem(GAME_KEY);
    var s = raw ? JSON.parse(raw) : null;
    if(!s || typeof s !== "object") return freshStats();
    return {
      best: +s.best || 0,
      bestStreak: +s.bestStreak || 0,
      runs: +s.runs || 0,
      missed: (Array.isArray(s.missed) ? s.missed : []).filter(function(r){
        return typeof r === "string" && !!D.rule_names[r];
      }).slice(0, 40)
    };
  }catch(e){
    return freshStats();
  }
}

function saveStats(){
  try{
    window.localStorage.setItem(GAME_KEY, JSON.stringify(GSTATS));
  }catch(e){ /* private mode, file:// quirks - the run is just not kept */ }
}

function freshRun(){
  return {level:0, right:0, rounds:0, streak:0, best:0, score:0,
          item:null, stage:null, opts:null, answered:false,
          used:{}, formTurn:0, missed:[], levelNote:null, over:false};
}

function gameEligible(list, L, needCloze){
  return list.filter(function(it){
    if(it.tier > L.tier) return false;
    if(needCloze && !it.cloze) return false;
    return !Object.prototype.hasOwnProperty.call(G.used, it.phrase);
  });
}

function gameDraw(list){
  return list[Math.floor(Math.random() * list.length)];
}

function gamePick(L){
  var pool = GAME_POOL, list, i, form;

  if(L.ask === "article" || L.ask === "both"){
    /* the pool is more than half no-article. Walking the three forms in turn
       stops "no article" from being the guess that keeps on winning. */
    for(i = 0; i < GAME_FORMS.length; i++){
      form = GAME_FORMS[(G.formTurn + i) % GAME_FORMS.length];
      list = gameEligible(pool.byForm[form] || [], L, true);
      if(list.length){
        G.formTurn = (G.formTurn + i + 1) % GAME_FORMS.length;
        return gameDraw(list);
      }
    }
  }

  list = gameEligible(pool.items, L, false);
  if(!list.length){
    /* out of unseen items at this tier: let them come round again rather than
       ending a run the learner is in the middle of */
    G.used = {};
    list = gameEligible(pool.items, L, false);
  }
  return list.length ? gameDraw(list) : null;
}

function nextRound(){
  var L = LEVELS[G.level], it = null, tries;
  for(tries = 0; tries < 12; tries++){
    it = gamePick(L);
    if(!it) break;
    if(L.ask === "article" || ruleOptions(it, L.near)) break;
    G.used[it.phrase] = 1;
    it = null;
  }
  if(!it){
    endGame("That is every phrase the rules hold.");
    return;
  }
  G.used[it.phrase] = 1;
  G.item = it;
  G.stage = (L.ask === "rule") ? "rule" : "article";
  G.answered = false;
  renderRound();
}

/* ---------------- rendering ---------------- */

function gameHead(){
  var L = LEVELS[G.level];
  document.getElementById("glevel").textContent =
    "Level " + (G.level + 1) + " of " + LEVELS.length + " · " + L.blurb;
  document.getElementById("gpts").textContent = String(G.score);
  document.getElementById("gstreak").textContent = String(G.streak);
}

function clozeHTML(s){
  return esc(s).replace(/___/g, '<span class="blank">___</span>');
}

function renderRound(){
  var L = LEVELS[G.level], it = G.item, asking = G.stage;
  var opts = (asking === "article") ? articleOptions(it) : ruleOptions(it, L.near);
  if(!opts){ G.used[it.phrase] = 1; nextRound(); return; }
  G.opts = opts;

  var shown = (asking === "article" && it.cloze) ? it.cloze : it.phrase;
  var h = '<div class="qcard">';
  if(G.levelNote){
    h += '<p class="glevelnote">' + esc(G.levelNote) + "</p>";
    G.levelNote = null;
  }
  h += '<p class="gate">' +
       (asking === "article" ? "Which article goes in the blank?"
                             : "Which rule decides this?") + "</p>";
  h += '<p class="gphrase">' + clozeHTML(shown) + "</p>";
  if(asking === "rule" && L.ask === "both"){
    h += '<p class="qnote">The article is <em>' + esc(plainForm(it.form)) +
         "</em>. Now the reason.</p>";
  }
  h += '<div class="gopts">';
  opts.forEach(function(o, i){
    h += '<button class="gopt" type="button" data-i="' + i + '">' +
         '<span class="num">' + (i + 1) + "</span><span>" + esc(o.label) +
         "</span></button>";
  });
  h += "</div></div>";

  gstage.innerHTML = h;
  var btns = gstage.querySelectorAll(".gopt"), i;
  for(i = 0; i < btns.length; i++){
    btns[i].addEventListener("click", function(){
      answerGame(+this.getAttribute("data-i"));
    });
  }
  if(btns.length) btns[0].focus();
  gameHead();
}

function answerGame(i){
  if(!G || G.over || G.answered) return;
  var o = G.opts && G.opts[i];
  if(!o) return;
  G.answered = true;

  var btns = gstage.querySelectorAll(".gopt"), k;
  for(k = 0; k < btns.length; k++){
    btns[k].disabled = true;
    if(G.opts[k] && G.opts[k].right) btns[k].className = "gopt right";
  }
  if(!o.right && btns[i]) btns[i].className = "gopt wrong";

  G.rounds++;
  if(o.right){
    G.streak++;
    if(G.streak > G.best) G.best = G.streak;
    /* a streak is worth having, but not worth more than the answer itself */
    G.score += 10 + Math.min(20, G.streak * 2);
    G.right++;
  }else{
    G.streak = 0;
    G.missed.push({ref:G.item.ref, name:G.item.name, phrase:G.item.phrase});
  }
  gameHead();
  renderGameFeedback(o.right);
}

function gameFilled(it){
  if(it.form === "zero" && it.cloze){
    return esc(it.cloze).replace(/___/g, '<span class="fill">—</span>');
  }
  return esc(it.phrase);
}

function renderGameFeedback(right){
  var L = LEVELS[G.level], it = G.item;
  /* the article half of a both-round must not name the rule: that is the very
     next question */
  var partial = (L.ask === "both" && G.stage === "article");

  var h = '<div class="qcard gfeed">';
  h += '<p class="gverdict ' + (right ? "good" : "bad") + '">' +
       (right ? "Right" : "Not this time") + "</p>";
  if(G.stage === "article") h += '<p class="built">' + gameFilled(it) + "</p>";
  if(!partial){
    if(it.cat) h += '<p class="cat">' + esc(it.cat) + "</p>";
    if(it.why) h += '<p class="why">' + it.why + "</p>";
    h += "<p>" + refPill(it.ref, null) + "</p>";
  }
  h += '<div class="gacts">' +
       '<button class="btn" id="gnext" type="button">Next</button>' +
       '<button class="btn ghost" id="gwalk" type="button">Walk this one</button>' +
       "</div></div>";

  var box = document.createElement("div");
  box.innerHTML = h;
  gstage.appendChild(box.firstChild);

  document.getElementById("gnext").addEventListener("click", gameAdvance);
  document.getElementById("gwalk").addEventListener("click", function(){
    walkThisOne(it.phrase);
  });
  document.getElementById("gnext").focus();
}

/* the walk card reads phrase.value for the phrase it names, and analyze()
   touches the focus bar - so the panel has to be showing first */
function walkThisOne(text){
  mode("walk");
  phrase.value = text;
  analyze(text, null, null);
  stage.scrollIntoView({block:"nearest", behavior:"smooth"});
}

function gameAdvance(){
  var L = LEVELS[G.level];
  if(L.ask === "both" && G.stage === "article"){
    G.stage = "rule";
    G.answered = false;
    renderRound();
    return;
  }
  if(G.right >= L.need){
    if(G.level + 1 >= LEVELS.length){ endGame(null); return; }
    G.level++;
    G.right = 0;
    G.levelNote = LEVELS[G.level].intro;
    recordRun(false);
  }
  G.answered = false;
  nextRound();
}

function recordRun(finished){
  if(G.score > GSTATS.best) GSTATS.best = G.score;
  if(G.best > GSTATS.bestStreak) GSTATS.bestStreak = G.best;
  if(finished) GSTATS.runs++;
  G.missed.forEach(function(m){
    if(GSTATS.missed.indexOf(m.ref) === -1) GSTATS.missed.push(m.ref);
  });
  GSTATS.missed = GSTATS.missed.slice(0, 40);
  saveStats();
}

function endGame(msg){
  if(G.over) return;
  G.over = true;
  recordRun(true);

  var h = '<div class="qcard">';
  h += '<p class="gverdict good">Run over</p>';
  if(msg) h += '<p class="qnote">' + esc(msg) + "</p>";
  h += '<div class="gsum">' +
       "<div><b>" + G.score + "</b>points</div>" +
       "<div><b>" + G.best + "</b>longest streak</div>" +
       "<div><b>" + G.rounds + "</b>answered</div></div>";
  h += '<p class="qnote">Best so far: ' + GSTATS.best + " points, a streak of " +
       GSTATS.bestStreak + ", over " + GSTATS.runs +
       (GSTATS.runs === 1 ? " run." : " runs.") + "</p>";
  if(G.missed.length){
    h += '<h2 class="gmissh">Worth another look</h2><div class="chips gmiss">';
    G.missed.forEach(function(m, i){
      h += '<button class="chip" type="button" data-m="' + i + '">' +
           esc(m.phrase) + " — " + esc(m.name) + "</button>";
    });
    h += "</div>";
  }
  h += '<div class="gacts">' +
       '<button class="btn" id="gagain" type="button">Play again</button>' +
       '<button class="btn ghost" id="gback" type="button">Back to the tree</button>' +
       "</div></div>";
  gstage.innerHTML = h;

  var miss = gstage.querySelectorAll(".gmiss .chip"), i;
  for(i = 0; i < miss.length; i++){
    miss[i].addEventListener("click", function(){
      walkThisOne(G.missed[+this.getAttribute("data-m")].phrase);
    });
  }
  document.getElementById("gagain").addEventListener("click", startGame);
  document.getElementById("gback").addEventListener("click", function(){ mode("walk"); });
  document.getElementById("gagain").focus();
  gameHead();
}

function gameFail(err){
  gstage.innerHTML = '<div class="err"><b>The drill could not be built.</b><br><br>' +
    "The other three views still work — they read the rules directly.<br><br>" +
    '<span class="ex">' + esc(String(err && err.message ? err.message : err)) +
    "</span></div>";
}

function startGame(){
  try{
    buildGamePool();
    if(!GSTATS) GSTATS = loadStats();
    G = freshRun();
    G.levelNote = LEVELS[0].intro;
    nextRound();
  }catch(err){
    G = null;
    gameFail(err);
  }
}

document.getElementById("gskip").addEventListener("click", function(){
  if(!G || G.over) return;
  G.answered = false;
  G.streak = 0;
  nextRound();
});
document.getElementById("greset").addEventListener("click", startGame);

/* 1-4 answer, n moves on. Guarded on the panel showing and on the learner not
   being in one of the other panels' text fields. */
document.addEventListener("keydown", function(e){
  if(!G || document.getElementById("play").classList.contains("hidden")) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  var tag = document.activeElement ? document.activeElement.tagName : "";
  if(tag === "INPUT" || tag === "TEXTAREA") return;
  if(e.key >= "1" && e.key <= "4"){
    if(G.answered || G.over) return;
    e.preventDefault();
    answerGame(+e.key - 1);
    return;
  }
  if(e.key === "n" || e.key === "N"){
    if(document.getElementById("gnext")){ e.preventDefault(); gameAdvance(); }
  }
});

/* ---------------- mode toggle ---------------- */

/* Three panels now, so the toggle is a name rather than a boolean. */
var PANELS = {
  walk:   ["walk", "m-walk"],
  map:    ["map", "m-map"],
  senses: ["senses", "m-senses"],
  play:   ["play", "m-play"]
};
function mode(name){
  var k;
  for(k in PANELS){
    if(!Object.prototype.hasOwnProperty.call(PANELS, k)) continue;
    document.getElementById(PANELS[k][0]).classList.toggle("hidden", k !== name);
    document.getElementById(PANELS[k][1]).setAttribute("aria-pressed", String(k === name));
  }
}
Object.keys(PANELS).forEach(function(k){
  document.getElementById(PANELS[k][1]).addEventListener("click", function(){
    mode(k);
    /* the pool is mined the first time it is asked for: 350-odd gate0 calls
       that the other three views have no use for, and a fault in them must not
       reach the boot block the whole page depends on */
    if(k === "play" && !G) startGame();
  });
});

/* ---------------- boot ---------------- */

/* The rules travel inside the page. Fetching them meant the file had to be
   served over HTTP, and a learner who was sent the .html and opened it got a
   web server to install instead of an answer.

   rules_data.json is still where the rules are written and where the Python
   side and the tests read them; tools/inline_rules.py copies it in here, and
   the suite fails if this copy has drifted.

   It also retires a caching problem: Pages served the two files separately
   with max-age=600, so a deploy could leave a visitor running new code against
   ten-minute-old rules. One file cannot disagree with itself. */
try{
  D = JSON.parse(document.getElementById("rules-data").textContent);
  T = D.decision_tree;
  FORM = D.form_labels;
  entry = (D.meta && D.meta.entry_node) || "q2";
  cur = entry;
  buildChips();
  buildMap();
  renderEmpty();
  readingsEmpty("Type a word to see every reading the rules hold for it \u2014 " +
                "try <em>radio</em>, <em>cinema</em> or <em>night</em>.");
}catch(err){
  stage.innerHTML = '<div class="err"><b>This page is missing its rules.</b><br><br>' +
    'It cannot answer anything without them, so it needs to be downloaded ' +
    'again \u2014 ask whoever sent it to you for a fresh copy.<br><br>' +
    '<span class="ex">' + esc(String(err && err.message ? err.message : err)) + '</span></div>';
}
</script>
</body>
</html>
